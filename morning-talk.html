<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朝礼ネタAI</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f5;color:#222}header{background:#fff;padding:18px 20px;font-size:24px;font-weight:800;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}main{max-width:850px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0001}h1,h2,h3{margin-top:0}button,select,input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font-size:16px}.theme-input{margin:8px 0;border:1px solid #bbb;background:#fff}.theme-help{margin:0 0 16px;font-size:14px;line-height:1.6;color:#555}.primary{border:0;background:#111;color:#fff;font-weight:800}.secondary{border:0;background:#ececec;color:#111;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.topic{border:1px solid #ddd;border-radius:14px;padding:15px;margin-top:12px;background:#fafafa}.tag{display:inline-block;background:#eee;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.hook{font-size:18px;font-weight:800;line-height:1.55}.muted{color:#666;font-size:13px;line-height:1.6}.speech{white-space:pre-wrap;line-height:1.9;font-size:17px}.polish-note{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff8e8;font-size:13px;line-height:1.55}.source{padding:9px 0;border-bottom:1px solid #eee}.source:last-child{border-bottom:0}.source a{word-break:break-all}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.hidden{display:none}.status{text-align:center;padding:18px;color:#555}@media(max-width:560px){.grid,.actions{grid-template-columns:1fr}}</style></head><body><header>朝礼ネタAI</header><main>
<div class="card"><h2>今日の朝礼を探す</h2><p>世界のWebから事実確認できる話を探し、少し道徳的で仕事につながる朝礼を3候補作ります。</p><label for="theme"><b>話したいテーマ（自由入力）</b></label><input id="theme" class="theme-input" type="text" maxlength="200" placeholder="例：プロ意識、責任感、小さな改善" aria-describedby="theme-help"><p id="theme-help" class="theme-help">テーマに関連する実話・研究・企業事例をWebで探し、朝礼にまとめます。空欄ならおまかせで探します。</p><div class="grid"><div><label>ジャンル</label><select id="category"><option>おまかせ</option><option>人間関係・思いやり</option><option>仕事・改善</option><option>安全・品質</option><option>心理学・習慣</option><option>歴史・人物</option><option>科学・身近な疑問</option><option>企業の成功・失敗</option><option>海外の話</option></select></div><div><label>雰囲気</label><select id="tone"><option>ちょっと道徳的</option><option>面白く考えさせる</option><option>仕事に強く結びつける</option><option>やさしく前向き</option></select></div></div><button class="primary" id="generate">今日の朝礼を作る</button><button class="secondary" id="again">別の話を探す</button><div id="status" class="status hidden">世界のWebから朝礼向きの話を探しています…</div></div>
<div id="results"></div><div class="card"><h2>使用した朝礼</h2><div id="history" class="muted">まだありません。</div></div></main><script>
const U='https://emauqxftmauvsffdjvyh.supabase.co',K='sb_publishable_9rgwKLiJU9dGVkqttq0-fQ_hrhNqnfa',$=id=>document.getElementById(id);
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const hist=()=>{try{return JSON.parse(localStorage.getItem('morningTalkHistory')||'[]')}catch{return[]}};
function saveUsed(t){let a=hist();a.unshift({title:t.title,category:t.category,date:new Date().toLocaleDateString('ja-JP')});localStorage.setItem('morningTalkHistory',JSON.stringify(a.slice(0,60)));renderHistory()}
function renderHistory(){let a=hist();$('history').innerHTML=a.length?a.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eee"><b>${esc(x.date)}</b>　${esc(x.title)} <span class="tag">${esc(x.category)}</span></div>`).join(''):'まだありません。'}
function render(topics){$('results').innerHTML=topics.map((t,i)=>`<div class="card topic"><span class="tag">${esc(t.category)}</span><h2 style="margin-top:10px">${esc(t.title)}</h2><div class="hook">${esc(t.hook)}</div><p>${esc(t.summary)}</p><p><b>この話から考えること：</b>${esc(t.lesson)}</p><p><b>仕事へのつながり：</b>${esc(t.work_link)}</p><div class="actions"><button class="primary" onclick="openSpeech(${i},3)">3分版を読む</button><button class="secondary" onclick="openSpeech(${i},5)">5分版を読む</button></div><div id="speech-${i}" class="hidden" style="margin-top:16px"><div class="speech"></div><button class="primary polish-button" style="margin-top:12px" onclick="polishSpeech(${i})">✨ 朝礼らしく洗練する</button><div class="polish-note">話し言葉に整え、つかみ → 身近な例 → 問いかけ → 今日の行動 → 前向きな締め、の流れにします。URLや出典名は本文から外します。</div><h3 style="margin-top:20px">参考にした資料</h3><div class="sources"></div><button class="secondary" onclick="markUsed(${i})">この朝礼を使用済みにする</button></div></div>`).join('');window.currentTopics=topics}
window.openSpeech=(i,min)=>{const t=window.currentTopics[i],box=$('speech-'+i);box.dataset.minutes=String(min);box.classList.remove('hidden');box.querySelector('.speech').textContent=min===3?(t.polished3||t.speech3):(t.polished5||t.speech5);box.querySelector('.sources').innerHTML=(t.sources||[]).map(s=>`<div class="source"><b>${esc(s.publisher)}</b> ${esc(s.date||'')}<br><a href="${esc(/^https?:\/\//i.test(s.url)?s.url:'#')}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a></div>`).join('');box.scrollIntoView({behavior:'smooth',block:'start'})}
window.polishSpeech=async i=>{const t=window.currentTopics[i],box=$('speech-'+i),min=Number(box.dataset.minutes||3),btn=box.querySelector('.polish-button'),speech=box.querySelector('.speech'),original=min===3?t.speech3:t.speech5;btn.disabled=true;btn.textContent='朝礼らしく整えています…';try{const r=await fetch(U+'/functions/v1/generate-morning-talk',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({mode:'polish',minutes:min,title:t.title,category:t.category,tone:$('tone').value,speech:original,instructions:'朝礼で社長が社員にそのまま話せる自然な日本語に推敲する。冒頭は短いつかみ。研究論文の説明調を避ける。身近な仕事の例を入れる。社員への問いかけを1つ入れる。今日からできる具体的行動を1つ示す。最後は前向きに締める。URL、ドメイン名、括弧付き出典、参考文献は読み上げ本文に絶対に入れない。事実関係や数値は元原稿から勝手に変更・追加しない。箇条書きではなく話し言葉の連続した原稿にする。'})});const d=await r.json();if(!r.ok)throw Error(d.error||'洗練に失敗しました');const polished=String(d.polished_speech||d.speech||d.text||'').trim();if(!polished)throw Error('洗練した原稿を取得できませんでした');speech.textContent=polished;if(min===3)t.polished3=polished;else t.polished5=polished;btn.textContent='✓ 朝礼らしく洗練しました'}catch(e){alert(e.message);btn.textContent='✨ 朝礼らしく洗練する'}finally{btn.disabled=false}};
window.markUsed=i=>{saveUsed(window.currentTopics[i]);alert('使用済みにしました。次回から似た話を避けます。')}
async function generate(){const b=$('generate'),s=$('status');b.disabled=true;$('again').disabled=true;const theme=$('theme').value.trim();s.textContent=theme?'「'+theme+'」に関連する素材をWebで探し、朝礼を作っています…':'世界のWebから朝礼向きの話を探しています…';s.classList.remove('hidden');$('results').innerHTML='';try{const r=await fetch(U+'/functions/v1/generate-morning-talk',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({theme,category:$('category').value,tone:$('tone').value,used_titles:hist().map(x=>x.title)})});const d=await r.json();if(!r.ok)throw Error(d.error||'生成に失敗しました');if(!Array.isArray(d.topics)||d.topics.length!==3||d.topics.some(t=>!t.title||!t.speech3||!t.speech5||!Array.isArray(t.sources)||!t.sources.length))throw Error('原稿または出典を取得できませんでした。もう一度お試しください。');render(d.topics)}catch(e){$('results').innerHTML=`<div class="card"><b>生成できませんでした。</b><p>${esc(/no credits remaining|insufficient_quota|exceeded your current quota/i.test(e.message)?'OpenAI APIの利用残高が不足しています。API管理画面で残高を補充してから「今日の朝礼を作る」をもう一度押してください。ChatGPTの月額契約とは別の残高です。':e.message)}</p></div>`}finally{b.disabled=false;$('again').disabled=false;s.classList.add('hidden')}}
$('theme').addEventListener('input',()=>{$('generate').textContent=$('theme').value.trim()?'このテーマで朝礼を作る':'今日の朝礼を作る'});$('theme').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&!$('generate').disabled){e.preventDefault();generate()}});$('generate').onclick=generate;$('again').onclick=generate;renderHistory();
</script></body></html>
