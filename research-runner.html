<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI再調査</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;margin:0;padding:18px;color:#222}.card{max-width:720px;margin:auto;background:white;border-radius:16px;padding:20px}.bar{height:14px;background:#eee;border-radius:10px;overflow:hidden}.fill{height:100%;background:#111;width:0}.row{padding:10px 0;border-bottom:1px solid #eee}.ok{color:#087a2f}.ng{color:#b00020}.stats{margin:14px 0;padding:14px;background:#fafafa;border-radius:12px;line-height:1.7}.stats b{font-size:18px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#111;color:#fff;font-size:17px;font-weight:700}</style></head><body><div class="card"><h1>AI再調査</h1><p>再調査待ちの会社を順番に処理します。この画面を開いたままにしてください。</p><div class="bar"><div id="fill" class="fill"></div></div><div class="stats"><div>進捗：<b id="progress">0/0</b></div><div>残り：<b id="remaining">-</b> 社</div><div>推定残り時間：<b id="eta">計算中…</b></div><div>平均：<span id="avg">-</span></div><div>経過時間：<span id="elapsed">0分</span></div></div><p id="status">準備中…</p><div id="log"></div><button id="retry" style="display:none">失敗分をもう一度実行</button></div><script>
const U='https://emauqxftmauvsffdjvyh.supabase.co',K='sb_publishable_9rgwKLiJU9dGVkqttq0-fQ_hrhNqnfa',H={apikey:K,Authorization:`Bearer ${K}`},$=id=>document.getElementById(id);let failures=[],runStarted=0,durations=[];
const fmtSec=s=>{s=Math.max(0,Math.round(s));if(s<60)return `${s}秒`;let m=Math.floor(s/60),sec=s%60;if(m<60)return sec?`${m}分${sec}秒`:`${m}分`;let h=Math.floor(m/60),mm=m%60;return mm?`${h}時間${mm}分`:`${h}時間`};
async function load(){let r=await fetch(`${U}/rest/v1/companies?ai_review_status=eq.${encodeURIComponent('再調査待ち')}&select=id,company_name,address,relationship_type&order=id.asc`,{headers:H});if(!r.ok)throw Error('会社一覧の取得に失敗');return r.json()}
async function one(c){let r=await fetch(`${U}/functions/v1/research-company`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({company_id:c.id,company_name:c.company_name,address:c.address||'',relationship_type:c.relationship_type||'その他'})});let t=await r.text();if(!r.ok)throw Error(t.slice(0,160));return t}
function add(c,msg,ok){let d=document.createElement('div');d.className='row '+(ok?'ok':'ng');d.textContent=`${ok?'✓':'×'} ${c.company_name}：${msg}`;$('log').prepend(d)}
function updateStats(done,total){$('progress').textContent=`${done}/${total}`;$('remaining').textContent=Math.max(0,total-done);$('fill').style.width=total?`${Math.round(done/total*100)}%`:'100%';let elapsed=(Date.now()-runStarted)/1000;$('elapsed').textContent=fmtSec(elapsed);if(durations.length){let avg=durations.reduce((a,b)=>a+b,0)/durations.length;$('avg').textContent=`1社あたり約${fmtSec(avg)}`;$('eta').textContent=done>=total?'0分':`約${fmtSec(avg*(total-done))}`;}else{$('avg').textContent='計算中…';$('eta').textContent='計算中…'}}
async function run(list=null){failures=[];$('retry').style.display='none';let a=list||await load(),total=a.length;runStarted=Date.now();durations=[];updateStats(0,total);if(!total){$('status').textContent='再調査待ちはありません。すべて完了しています。';$('fill').style.width='100%';$('eta').textContent='0分';return}let done=0,ok=0;for(const c of a){$('status').textContent=`${done+1}/${total}　${c.company_name} を調査中…`;let started=Date.now();try{await one(c);ok++;add(c,'完了',true)}catch(e){failures.push(c);add(c,'失敗 '+e.message,false)}durations.push((Date.now()-started)/1000);done++;updateStats(done,total);await new Promise(r=>setTimeout(r,700))}$('status').textContent=`完了：${ok}/${total}社${failures.length?`　失敗：${failures.length}社`:''}`;if(failures.length)$('retry').style.display='block'}
setInterval(()=>{if(runStarted)updateStats(Number(($('progress').textContent||'0/0').split('/')[0])||0,Number(($('progress').textContent||'0/0').split('/')[1])||0)},1000);
$('retry').onclick=()=>run([...failures]);run().catch(e=>$('status').textContent='エラー：'+e.message);
</script></body></html>
