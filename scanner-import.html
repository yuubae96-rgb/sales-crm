<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>名刺スキャナー一括読込</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f5;color:#222}header{background:#fff;padding:18px 20px;font-size:22px;font-weight:700;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}main{padding:16px;max-width:850px;margin:auto}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0001}h2,h3{margin-top:0}label{display:block;margin-top:12px;margin-bottom:5px;font-weight:700}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#e9e9e9;color:#111}.muted{color:#666;font-size:14px;line-height:1.55}.hidden{display:none}.batch-card{border:1px solid #ddd;border-radius:14px;padding:14px;margin-top:14px;background:#fafafa}.progress{margin-top:12px;padding:12px;border-radius:10px;background:#f6f6f6}.ok{background:#edf9ef}.err{background:#fff0f0}.toplink{display:inline-block;margin-bottom:12px;color:#111;font-weight:700}.section-gap{margin-top:18px;padding-top:16px;border-top:1px solid #ddd}
</style></head><body><header>名刺スキャナー一括読込</header><main><a class="toplink" href="./index.html">← 営業管理へ戻る</a>
<div class="card"><h2>スキャンした名刺を一括読込</h2><p class="muted">スキャナーで作ったPDF、またはJPG・PNG画像を選択してください。PDFなら100ページ程度を1つのPDFにまとめても読み取れます。画像が大量の場合は20ファイルずつ自動で分けてAI処理します。</p><input type="file" id="scannerFiles" accept="application/pdf,image/jpeg,image/png" multiple><button class="primary" id="scannerImportButton">AIで名刺を一括読込</button><div id="scannerProgress" class="progress muted">ファイルを選択してください。</div></div>
<div class="card hidden" id="resultCard"><h2 id="resultTitle">読み取り結果</h2><button class="primary" id="saveTop">まとめて登録する</button><div id="cardList"></div><button class="primary" id="saveBottom">まとめて登録する</button></div>
</main><script>
const $=id=>document.getElementById(id),U='https://emauqxftmauvsffdjvyh.supabase.co',K='sb_publishable_9rgwKLiJU9dGVkqttq0-fQ_hrhNqnfa',A='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4',H={apikey:K,Authorization:`Bearer ${A}`},T=['顧客','材料メーカー','外注先','設備会社','その他'];
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const norm=s=>(s||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();
const companyNorm=s=>norm(s).replace(/株式会社|有限会社|合同会社|合資会社|合名会社|\(株\)|（株）|\(有\)|（有）/g,'');
const opts=s=>T.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('');
function editDistance(a,b){a=companyNorm(a);b=companyNorm(b);const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function similarity(a,b){const x=companyNorm(a),y=companyNorm(b),max=Math.max(x.length,y.length);return max?1-editDistance(x,y)/max:1}
function bestSimilarCompany(name,companies){let best=null,score=0;for(const c of companies){const s=similarity(name,c.company_name);if(s>score){score=s;best=c}}return score>=0.72?{company:best,score}:null}
async function get(path){const r=await fetch(U+path,{headers:H}),t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error(`データ取得エラー (${r.status})`)}if(!r.ok)throw Error(d?.message||`データ取得エラー (${r.status})`);return d}
function toDataUrl(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>reject(new Error(`${file.name}を読み込めませんでした`));rd.readAsDataURL(file)})}
let cards=[];
function render(){
 $('cardList').innerHTML=cards.map((c,i)=>`<div class="batch-card"><h3>名刺 ${i+1}</h3><label>取引先区分</label><select data-i="${i}" data-f="relationship_type">${opts(c.relationship_type||'顧客')}</select><label>会社名</label><input data-i="${i}" data-f="company_name" value="${esc(c.company_name)}"><label>氏名</label><input data-i="${i}" data-f="person_name" value="${esc(c.person_name)}"><label>部署</label><input data-i="${i}" data-f="department" value="${esc(c.department)}"><label>役職</label><input data-i="${i}" data-f="position" value="${esc(c.position)}"><label>電話</label><input data-i="${i}" data-f="phone" value="${esc(c.phone)}"><label>メール</label><input data-i="${i}" data-f="email" value="${esc(c.email)}"><label>住所</label><input data-i="${i}" data-f="address" value="${esc(c.address)}"></div>`).join('');
 document.querySelectorAll('[data-i]').forEach(e=>e.oninput=()=>cards[+e.dataset.i][e.dataset.f]=e.value);
 $('resultTitle').textContent=`${cards.length}枚の名刺を読み取りました`;$('resultCard').classList.remove('hidden');
}
$('scannerImportButton').onclick=async function(){
 const files=[...($('scannerFiles').files||[])];if(!files.length)return alert('PDF・JPG・PNGを選択してください');
 this.disabled=true;this.textContent='AIで一括読込中…';cards=[];let failed=0;
 try{
   const prepared=[];for(let i=0;i<files.length;i++){ $('scannerProgress').textContent=`ファイル準備中 ${i+1}/${files.length}`;prepared.push({data:await toDataUrl(files[i]),type:files[i].type||'',name:files[i].name}) }
   for(let start=0;start<prepared.length;start+=20){const chunk=prepared.slice(start,start+20);$('scannerProgress').textContent=`AI読み取り中 ${Math.min(start+chunk.length,prepared.length)}/${prepared.length}ファイル`;
     try{const r=await fetch(`${U}/functions/v1/read-business-card`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({files:chunk})});const d=await r.json();if(!r.ok)throw Error(d.error||'読み取り失敗');cards.push(...(d.cards||[]).map(x=>({...x,relationship_type:'顧客'})))}catch(e){failed+=chunk.length}
   }
   if(!cards.length)throw Error('名刺を読み取れませんでした。スキャン解像度やPDFを確認してください。');render();$('scannerProgress').className='progress muted ok';$('scannerProgress').textContent=`完了：${cards.length}枚読み取り${failed?`／読み取り失敗 ${failed}ファイル`:''}`;
 }catch(e){$('scannerProgress').className='progress muted err';$('scannerProgress').textContent=e.message;alert(e.message)}finally{this.disabled=false;this.textContent='AIで名刺を一括読込'}
};
async function saveAll(){if(!cards.length)return;const btn1=$('saveTop'),btn2=$('saveBottom');btn1.disabled=btn2.disabled=true;btn1.textContent=btn2.textContent='登録中…';let ok=0,merged=0,skipped=0;try{let companies=await get('/rest/v1/companies?select=id,company_name,address,phone');for(const c of cards){if(!c.company_name||!c.person_name){skipped++;continue}let co=companies.find(x=>companyNorm(x.company_name)===companyNorm(c.company_name)),id;if(co){id=co.id;merged++}else{const near=bestSimilarCompany(c.company_name,companies);if(near&&confirm(`会社名の読み取りミスの可能性があります。\n\n読み取り：${c.company_name}\n既存候補：${near.company.company_name}\n\nOK：既存会社にまとめる\nキャンセル：別会社として登録する`)){id=near.company.id;merged++}if(!id){const r=await fetch(`${U}/rest/v1/companies`,{method:'POST',headers:{...H,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({company_name:c.company_name,address:c.address||'',phone:c.phone||'',relationship_type:c.relationship_type||'顧客',ai_review_status:'未調査'})});const d=await r.json();if(!r.ok){if(r.status===409){const fresh=await get('/rest/v1/companies?select=id,company_name');const same=fresh.find(x=>companyNorm(x.company_name)===companyNorm(c.company_name));if(same){id=same.id;merged++}else throw Error('会社登録の重複エラー')}else throw Error(d?.message||'会社登録に失敗しました')}else{id=d[0]?.id;companies.push({id,company_name:c.company_name,address:c.address||'',phone:c.phone||''})}}}
 const people=await get(`/rest/v1/contacts?company_id=eq.${id}&select=name`);if(!people.some(p=>norm(p.name)===norm(c.person_name))){const pr=await fetch(`${U}/rest/v1/contacts`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({company_id:id,name:c.person_name,department:c.department||'',position:c.position||'',phone:c.phone||'',email:c.email||''})});if(pr.ok)ok++}}
 alert(`登録完了\n人物 ${ok}件\n既存会社へ統合 ${merged}件${skipped?`\n未登録 ${skipped}件`:''}`);$('scannerProgress').className='progress muted ok';$('scannerProgress').textContent='営業管理への登録が完了しました。';
 }catch(e){alert(e.message)}finally{btn1.disabled=btn2.disabled=false;btn1.textContent=btn2.textContent='まとめて登録する'}}
$('saveTop').onclick=saveAll;$('saveBottom').onclick=saveAll;
</script></body></html>
