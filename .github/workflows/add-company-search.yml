name: Add company search

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add company search UI and filtering
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_html = '<div class="card"><h2>会社・取引先</h2><button class="secondary" id="companyListButton">会社一覧</button><div class="filters">'
          new_html = '<div class="card"><h2>会社・取引先</h2><button class="secondary" id="companyListButton">会社一覧</button><label for="companySearch">会社を検索</label><input id="companySearch" type="search" placeholder="会社名・住所・電話番号で検索" autocomplete="off"><div class="filters">'
          if old_html not in s:
              raise SystemExit('company area marker not found')
          s = s.replace(old_html, new_html, 1)

          old_ctx = "function saveListContext(){const ctx={relationship:$('relationshipFilter')?.value||'すべて',salesStatus:$('salesStatusFilter')?.value||'すべて',region:$('regionFilter')?.value||'すべて',scrollY:window.scrollY};sessionStorage.setItem(LIST_CTX_KEY,JSON.stringify(ctx));return ctx}"
          new_ctx = "function saveListContext(){const ctx={relationship:$('relationshipFilter')?.value||'すべて',salesStatus:$('salesStatusFilter')?.value||'すべて',region:$('regionFilter')?.value||'すべて',query:$('companySearch')?.value||'',scrollY:window.scrollY};sessionStorage.setItem(LIST_CTX_KEY,JSON.stringify(ctx));return ctx}"
          if old_ctx not in s:
              raise SystemExit('saveListContext marker not found')
          s = s.replace(old_ctx, new_ctx, 1)

          old_restore = "function restoreListContext(ctx){if(!ctx)return;$('relationshipFilter').value=ctx.relationship||'すべて';$('salesStatusFilter').value=ctx.salesStatus||'すべて';$('regionFilter').value=ctx.region||'すべて'}"
          new_restore = "function restoreListContext(ctx){if(!ctx)return;$('relationshipFilter').value=ctx.relationship||'すべて';$('salesStatusFilter').value=ctx.salesStatus||'すべて';$('regionFilter').value=ctx.region||'すべて';if($('companySearch'))$('companySearch').value=ctx.query||''}"
          if old_restore not in s:
              raise SystemExit('restoreListContext marker not found')
          s = s.replace(old_restore, new_restore, 1)

          old_load = "let a=await getAll(url);if(rg!=='すべて')a=a.filter(c=>regionOfAddress(c.address)===rg);$('companyList').innerHTML=a.map(c=>"
          new_load = "let a=await getAll(url);if(rg!=='すべて')a=a.filter(c=>regionOfAddress(c.address)===rg);const q=norm($('companySearch')?.value||'');if(q)a=a.filter(c=>norm([c.company_name,c.address,c.phone].join(' ')).includes(q));$('companyList').innerHTML=a.map(c=>"
          if old_load not in s:
              raise SystemExit('loadCompanies marker not found')
          s = s.replace(old_load, new_load, 1)

          old_handlers = "$('companyListButton').onclick=()=>loadCompanies(true);$('relationshipFilter').onchange=()=>loadCompanies(false);$('salesStatusFilter').onchange=()=>loadCompanies(false);$('regionFilter').onchange=()=>loadCompanies(false);"
          new_handlers = "$('companyListButton').onclick=()=>loadCompanies(true);$('relationshipFilter').onchange=()=>loadCompanies(false);$('salesStatusFilter').onchange=()=>loadCompanies(false);$('regionFilter').onchange=()=>loadCompanies(false);let companySearchTimer;$('companySearch').oninput=()=>{clearTimeout(companySearchTimer);companySearchTimer=setTimeout(()=>loadCompanies(false),180)};"
          if old_handlers not in s:
              raise SystemExit('filter handlers marker not found')
          s = s.replace(old_handlers, new_handlers, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add live company search"
          git push
