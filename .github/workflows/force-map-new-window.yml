name: Force map link into separate window with company pin
on:
  push:
    paths:
      - '.github/workflows/force-map-new-window.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${c.company_name} ${c.address||''}`)}"
          new="https://www.google.com/maps?q=${encodeURIComponent(`${c.company_name} ${c.address||''}`)}"
          if old not in s:
              old="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.address)}"
          if old not in s:
              raise SystemExit('map url pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Open company location with Google Maps pin"
          git push