name: Force map link into separate window
on:
  push:
    paths:
      - '.github/workflows/force-map-new-window.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map link
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='target="_blank" rel="noopener noreferrer">Googleマップで場所を見る</a>'
          new='target="_blank" rel="noopener noreferrer" onclick="event.preventDefault();window.open(this.href, \'_blank\', \'noopener,noreferrer\');return false;">Googleマップで場所を見る</a>'
          if old not in s:
              raise SystemExit('map link pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Open Google Maps in separate window"
          git push