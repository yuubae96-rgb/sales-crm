name: Fix customer region detection
on:
  push:
    paths:
      - '.github/workflows/fix-region-detection.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix region detection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function regionOfAddress(address){const a=String(address||'').normalize('NFKC');if(!a)return 'その他';if(a.includes('福岡県')||NORTH_FUKUOKA.some(x=>a.includes(x))){return NORTH_FUKUOKA.some(x=>a.includes(x))?'北部九州':'南部九州'}const m=a.match(/(北海道|東京都|京都府|大阪府|.{2,3}県)/);return m?m[1]:'その他'}"
          new="""const PREF_HINTS={
          '佐賀県':['佐賀県','佐賀市','唐津市','鳥栖市','多久市','伊万里市','武雄市','鹿島市','小城市','嬉野市','神埼市','吉野ヶ里町','基山町','上峰町','みやき町','有田町','大町町','江北町','白石町','太良町'],
          '長崎県':['長崎県','長崎市','佐世保市','島原市','諫早市','大村市','平戸市','松浦市','対馬市','壱岐市','五島市','西海市','雲仙市','南島原市','長与町','時津町','東彼杵町','川棚町','波佐見町','小値賀町','佐々町','新上五島町'],
          '熊本県':['熊本県','熊本市','八代市','人吉市','荒尾市','水俣市','玉名市','山鹿市','菊池市','宇土市','上天草市','宇城市','阿蘇市','天草市','合志市','美里町','玉東町','南関町','長洲町','和水町','大津町','菊陽町','南小国町','小国町','産山村','高森町','西原村','南阿蘇村','御船町','嘉島町','益城町','甲佐町','山都町','氷川町','芦北町','津奈木町','錦町','多良木町','湯前町','水上村','相良村','五木村','山江村','球磨村','あさぎり町','苓北町'],
          '大分県':['大分県','大分市','別府市','中津市','日田市','佐伯市','臼杵市','津久見市','竹田市','豊後高田市','杵築市','宇佐市','豊後大野市','由布市','国東市','姫島村','日出町','九重町','玖珠町'],
          '宮崎県':['宮崎県','宮崎市','都城市','延岡市','日南市','小林市','日向市','串間市','西都市','えびの市','三股町','高原町','国富町','綾町','高鍋町','新富町','西米良村','木城町','川南町','都農町','門川町','諸塚村','椎葉村','美郷町','高千穂町','日之影町','五ヶ瀬町'],
          '鹿児島県':['鹿児島県','鹿児島市','鹿屋市','枕崎市','阿久根市','出水市','指宿市','西之表市','垂水市','薩摩川内市','日置市','曽於市','霧島市','いちき串木野市','南さつま市','志布志市','奄美市','南九州市','伊佐市','姶良市','三島村','十島村','さつま町','長島町','湧水町','大崎町','東串良町','錦江町','南大隅町','肝付町','中種子町','南種子町','屋久島町','大和村','宇検村','瀬戸内町','龍郷町','喜界町','徳之島町','天城町','伊仙町','和泊町','知名町','与論町'],
          '山口県':['山口県','下関市','宇部市','山口市','萩市','防府市','下松市','岩国市','光市','長門市','柳井市','美祢市','周南市','山陽小野田市','周防大島町','和木町','上関町','田布施町','平生町','阿武町']};
          function regionOfAddress(address){const a=String(address||'').normalize('NFKC');if(!a)return 'その他';if(a.includes('福岡県')||NORTH_FUKUOKA.some(x=>a.includes(x))||['福岡市','久留米市','大牟田市','筑後市','八女市','柳川市','みやま市','筑紫野市','春日市','大野城市','太宰府市','糸島市'].some(x=>a.includes(x))){return NORTH_FUKUOKA.some(x=>a.includes(x))?'北部九州':'南部九州'}for(const [pref,hints] of Object.entries(PREF_HINTS)){if(hints.some(x=>a.includes(x)))return pref}const prefs=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','徳島県','香川県','愛媛県','高知県','沖縄県'];for(const pref of prefs){if(a.includes(pref))return pref}return 'その他'}"""
          if old not in s:
              raise SystemExit('old region function not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix customer prefecture filtering"
          git push