name: Build NP Sales app icons
on:
  push:
    branches: [main]
    paths:
      - '.icon-source.b64'
      - '.github/workflows/build-app-icons.yml'
permissions:
  contents: write
jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode source icon
        run: base64 -d .icon-source.b64 > icon-source.png
      - name: Create icon sizes
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          im=Image.open('icon-source.png').convert('RGB')
          for n,name in [(180,'apple-touch-icon.png'),(192,'icon-192.png'),(512,'icon-512.png')]:
              im.resize((n,n),Image.Resampling.LANCZOS).save(name,optimize=True)
          PY
      - name: Create web app manifest
        run: |
          cat > manifest.json <<'EOF'
          {
            "name": "NP営業",
            "short_name": "NP営業",
            "start_url": "/sales-crm/",
            "scope": "/sales-crm/",
            "display": "standalone",
            "background_color": "#061a33",
            "theme_color": "#061a33",
            "icons": [
              {"src":"icon-192.png","sizes":"192x192","type":"image/png"},
              {"src":"icon-512.png","sizes":"512x512","type":"image/png"}
            ]
          }
          EOF
      - name: Add icon links to app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tags='<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="NP営業"><meta name="theme-color" content="#061a33">'
          if 'rel="manifest"' not in s:
              s=s.replace('</head>',tags+'</head>',1)
          else:
              import re
              s=re.sub(r'<link[^>]+rel=["\']manifest["\'][^>]*>','<link rel="manifest" href="manifest.json">',s,count=1)
              if 'apple-touch-icon' not in s:
                  s=s.replace('</head>','<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="NP営業"></head>',1)
          p.write_text(s)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.json apple-touch-icon.png icon-192.png icon-512.png
          git diff --cached --quiet || git commit -m "Use NP Sales app icon"
          git push
