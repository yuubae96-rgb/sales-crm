name: Add scanner batch import
on:
  push:
    paths:
      - '.github/workflows/add-scanner-batch-import.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scanner batch import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<input type="file" id="cardCamera" accept="image/*" capture="environment" class="hidden"><button class="primary" id="cameraButton">名刺を撮影</button><img id="cardPreview" class="hidden" style="width:100%;margin-top:15px;border-radius:12px"><button class="primary" id="readCardButton">名刺を読み取る</button>'
          new='''<input type="file" id="cardCamera" accept="image/*" capture="environment" class="hidden"><button class="primary" id="cameraButton">名刺を撮影</button><img id="cardPreview" class="hidden" style="width:100%;margin-top:15px;border-radius:12px"><button class="primary" id="readCardButton">名刺を読み取る</button><div class="section-gap"><h3>スキャナーから一括読込</h3><p class="muted">スキャナーで保存したPDF・JPG・PNGをまとめて選択できます。複数ファイルは順番にAIで読み取ります。</p><input type="file" id="scannerFiles" accept="application/pdf,image/jpeg,image/png,image/webp" multiple><button class="primary" id="readScannerButton">スキャンした名刺を一括読込</button><div id="scannerProgress" class="muted" style="margin-top:8px"></div></div>'''
          if 'id="scannerFiles"' not in s:
              if old not in s: raise SystemExit('target html not found')
              s=s.replace(old,new,1)
          marker="$('cameraButton').onclick=()=>$('cardCamera').click();"
          js=r'''
async function fileToDataUrl(file){return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('ファイルを読み込めませんでした'));r.readAsDataURL(file)})}
async function readScannerFiles(){
 const files=[...($('scannerFiles')?.files||[])];
 if(!files.length){alert('スキャンしたPDFまたは画像を選んでください');return}
 const btn=$('readScannerButton'),prog=$('scannerProgress');btn.disabled=true;let all=[];
 try{
  for(let i=0;i<files.length;i++){
   prog.textContent=`${i+1}/${files.length}ファイルをAIで読み取り中…`;
   const dataUrl=await fileToDataUrl(files[i]);
   const isPdf=files[i].type==='application/pdf'||files[i].name.toLowerCase().endsWith('.pdf');
   const payload=isPdf?{file:dataUrl,filename:files[i].name}:{image:dataUrl,filename:files[i].name};
   const r=await fetch(`${U}/functions/v1/read-business-card`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(payload)});
   const d=await r.json();if(!r.ok)throw new Error(d.error||`${files[i].name}の読み取りに失敗しました`);
   all.push(...(d.cards||[]));
  }
  cards=all.map(x=>({...x,relationship_type:'顧客'}));
  $('cardResultTitle').textContent=`${cards.length}枚の名刺を読み取りました`;
  $('cardResult').classList.remove('hidden');renderCards();
  prog.textContent=`完了：${cards.length}枚の名刺を読み取りました`;
  $('cardResult').scrollIntoView({behavior:'smooth',block:'start'});
 }catch(e){prog.textContent='';alert(e.message)}finally{btn.disabled=false}
}
$('readScannerButton').onclick=readScannerFiles;
'''
          if 'async function readScannerFiles()' not in s:
              if marker not in s: raise SystemExit('js marker not found')
              s=s.replace(marker,js+'\n'+marker,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add scanner PDF and image batch business card import" || exit 0
          git push