name: Add AI usage panel
on:
  push:
    paths:
      - '.github/workflows/add-ai-usage-panel.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AI usage counters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index("const AI_USAGE_KEY='salesCrmAiUsageV1';")
          end=s.index("$('cameraButton').onclick", start)
          new="""async function renderAiUsage(){try{const a=await get('/rest/v1/ai_usage_stats?id=eq.1&select=company_research_count,card_read_count,web_search_count,input_tokens,output_tokens,estimated_cost_usd,updated_at');const u=a[0]||{};if($('aiResearchCount'))$('aiResearchCount').textContent=Number(u.company_research_count||0).toLocaleString()+'回';if($('aiCardCount'))$('aiCardCount').textContent=Number(u.card_read_count||0).toLocaleString()+'回';if($('aiWebCount'))$('aiWebCount').textContent=Number(u.web_search_count||0).toLocaleString()+'回';if($('aiEstimatedCost'))$('aiEstimatedCost').textContent='$'+Number(u.estimated_cost_usd||0).toFixed(4)}catch(e){console.warn('AI利用状況の取得に失敗',e)}}
renderAiUsage();
"""
          s=s[:start]+new+s[end:]
          s=s.replace("cards=(d.cards||[]).map(x=>({...x,relationship_type:'顧客'}));addAiCardUsage();", "cards=(d.cards||[]).map(x=>({...x,relationship_type:'顧客'}));renderAiUsage();", 1)
          s=s.replace('Web検索の推定回数','Web検索の累計回数',1)
          s=s.replace('アプリで記録開始後の概算です。','この営業管理アプリが実際に呼び出したAI処理をSupabaseで累積しています。API利用額はOpenAIの使用トークン数とWeb検索回数から算出した推定額です。',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use Supabase-backed AI usage counters" || exit 0
          git push
# final-trigger
