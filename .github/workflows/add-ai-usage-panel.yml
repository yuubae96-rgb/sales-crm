name: Add AI usage panel
on:
  push:
    paths:
      - '.github/workflows/add-ai-usage-panel.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="aiUsageCard"' not in s:
              panel='''<div class="card" id="aiUsageCard"><h2>AI利用状況</h2><div class="row">AI会社調査の累計回数 <strong id="aiResearchCount">0回</strong></div><div class="row">名刺AI読取の累計回数 <strong id="aiCardCount">0回</strong></div><div class="row">Web検索の推定回数 <strong id="aiWebCount">0回</strong></div><div class="row">推定API利用額 <strong id="aiEstimatedCost">$0.00</strong></div><p class="muted">アプリで記録開始後の概算です。</p></div>'''
              s=s.replace('</main><script>',panel+'</main><script>',1)
          if "const AI_USAGE_KEY='salesCrmAiUsageV1'" not in s:
              js="""\nconst AI_USAGE_KEY='salesCrmAiUsageV1';\nfunction readAiUsage(){try{return JSON.parse(localStorage.getItem(AI_USAGE_KEY)||'{\"research\":0,\"cards\":0,\"web\":0,\"cost\":0}')}catch(e){return {research:0,cards:0,web:0,cost:0}}}\nfunction renderAiUsage(){const u=readAiUsage();if($('aiResearchCount'))$('aiResearchCount').textContent=(u.research||0)+'回';if($('aiCardCount'))$('aiCardCount').textContent=(u.cards||0)+'回';if($('aiWebCount'))$('aiWebCount').textContent=(u.web||0)+'回';if($('aiEstimatedCost'))$('aiEstimatedCost').textContent='$'+Number(u.cost||0).toFixed(2)}\nfunction addAiCardUsage(){const u=readAiUsage();u.cards=(u.cards||0)+1;u.cost=(u.cost||0)+0.003;localStorage.setItem(AI_USAGE_KEY,JSON.stringify(u));renderAiUsage()}\nrenderAiUsage();\n"""
              s=s.replace("$('cameraButton').onclick",js+"$('cameraButton').onclick",1)
          marker="cards=(d.cards||[]).map(x=>({...x,relationship_type:'顧客'}));"
          if marker in s and 'addAiCardUsage();' not in s.split(marker,1)[1][:80]:
              s=s.replace(marker,marker+'addAiCardUsage();',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show AI usage panel in app" || exit 0
          git push
