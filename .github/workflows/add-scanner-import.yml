name: Add scanner batch import
on:
  push:
    paths:
      - '.github/workflows/add-scanner-import.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scanner import UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='<button class="primary" id="readCardButton">名刺を読み取る</button>'
          new='''<button class="primary" id="readCardButton">名刺を読み取る</button><div class="section-gap"><h3>スキャナーから一括読込</h3><p class="muted">スキャナーで保存したPDF・JPG・PNGを複数選択できます。大量の場合は順番にAIで読み取ります。</p><input type="file" id="scannerFiles" accept="application/pdf,image/jpeg,image/png" multiple><button class="secondary" id="scannerImportButton">スキャンした名刺を一括読込</button><div id="scannerProgress" class="muted" style="margin-top:8px"></div></div>'''
          if 'id="scannerImportButton"' not in s:
              if old not in s: raise SystemExit('read button marker not found')
              s=s.replace(old,new,1)

          marker="$('saveAllCardsButton').onclick=async function()"
          if 'async function scannerFileToDataUrl' not in s:
              js=r'''
function renderScannedCards(){
  $('batchCardList').innerHTML=cards.map((c,i)=>`<div class="batch-card"><h4>名刺 ${i+1}</h4><label>取引先区分（顧客、材料、外注、設備、その他）</label><select data-i="${i}" data-f="relationship_type">${opts('顧客')}</select><label>会社名</label><input data-i="${i}" data-f="company_name" value="${esc(c.company_name)}"><label>氏名</label><input data-i="${i}" data-f="person_name" value="${esc(c.person_name)}"><label>部署</label><input data-i="${i}" data-f="department" value="${esc(c.department)}"><label>役職</label><input data-i="${i}" data-f="position" value="${esc(c.position)}"><label>電話</label><input data-i="${i}" data-f="phone" value="${esc(c.phone)}"><label>メール</label><input data-i="${i}" data-f="email" value="${esc(c.email)}"><label>住所</label><input data-i="${i}" data-f="address" value="${esc(c.address)}"></div>`).join('');
  document.querySelectorAll('[data-i]').forEach(e=>e.oninput=()=>cards[+e.dataset.i][e.dataset.f]=e.value);
  $('cardResultTitle').textContent=`${cards.length}枚の名刺を読み取りました`;
  $('cardResult').classList.remove('hidden');
}
function scannerFileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('ファイルを読み込めませんでした'));r.readAsDataURL(file)})}
$('scannerImportButton').onclick=async function(){
  const files=[...($('scannerFiles').files||[])];
  if(!files.length)return alert('PDF・JPG・PNGファイルを選択してください');
  this.disabled=true;this.textContent='AIで一括読取中…';
  cards=[];
  let failed=0;
  try{
    for(let i=0;i<files.length;i++){
      $('scannerProgress').textContent=`${i+1}/${files.length}ファイル処理中…`;
      try{
        const dataUrl=await scannerFileToDataUrl(files[i]);
        const r=await fetch(`${U}/functions/v1/read-business-card`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({image:dataUrl})});
        const d=await r.json();
        if(!r.ok)throw Error(d.error||'読み取り失敗');
        cards.push(...(d.cards||[]).map(x=>({...x,relationship_type:'顧客'})));
      }catch(e){failed++}
    }
    if(!cards.length)throw Error('名刺を読み取れませんでした');
    renderScannedCards();
    await renderAiUsage();
    $('scannerProgress').textContent=`完了：${cards.length}枚読み取り${failed?`（失敗 ${failed}ファイル）`:''}`;
  }catch(e){alert(e.message)}finally{this.disabled=false;this.textContent='スキャンした名刺を一括読込'}
};
'''
              if marker not in s: raise SystemExit('save marker not found')
              s=s.replace(marker,js+marker,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add scanner batch business-card import" || exit 0
          git push
# trigger
