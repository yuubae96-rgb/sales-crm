name: Fix person company search
on:
  push:
    paths:
      - '.github/workflows/fix-person-company-search.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch person search
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('contact-features.js')
          s=p.read_text()
          old='search.innerHTML=`<label for="contactSearchInput">人物を検索</label><input id="contactSearchInput" type="search" placeholder="氏名・会社名・部署・役職・電話・メールで検索" autocomplete="off">'
          new='search.innerHTML=`<label for="contactSearchInput">人物名・会社名で検索</label><input id="contactSearchInput" type="search" placeholder="人物名・会社名・部署・役職・電話・メールで検索" autocomplete="off">'
          if old in s:
              s=s.replace(old,new,1)
          old2="byId('contactSearchInput').oninput=()=>{if(allPeople.length)renderContacts()};"
          new2="byId('contactSearchInput').oninput=()=>{if(allPeople.length)renderContacts();else loadContacts()};"
          if old2 not in s:
              raise SystemExit('search handler not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contact-features.js
          git diff --cached --quiet && exit 0
          git commit -m "Enable person search by company name immediately"
          git push
