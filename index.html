function editDistance(a,b){a=companyNorm(a);b=companyNorm(b);const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function similarity(a,b){const x=companyNorm(a),y=companyNorm(b),max=Math.max(x.length,y.length);return max?1-editDistance(x,y)/max:1}

$('cameraButton').onclick=()=>$('cardCamera').click();$('cardCamera').onchange=function(){if(this.files[0]){$('cardPreview').src=URL.createObjectURL(this.files[0]);$('cardPreview').classList.remove('hidden')}};let cards=[];
$('readCardButton').onclick=async function(){let f=$('cardCamera').files[0];if(!f)return alert('先に名刺を撮影してください');this.disabled=true;this.textContent='AIで読み取り中…';let rd=new FileReader();rd.onload=async()=>{try{let r=await fetch(`${U}/functions/v1/read-business-card`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({image:rd.result})}),d=await r.json();if(!r.ok)throw Error(d.error||'読み取り失敗');cards=(d.cards||[]).map(x=>({...x,relationship_type:'顧客'}));$('batchCardList').innerHTML=cards.map((c,i)=>`<div class="batch-card"><h4>名刺 ${i+1}</h4><label>取引先区分（顧客、材料、外注、設備、その他）</label><select data-i="${i}" data-f="relationship_type">${opts('顧客')}</select><label>会社名</label><input data-i="${i}" data-f="company_name" value="${esc(c.company_name)}"><label>氏名</label><input data-i="${i}" data-f="person_name" value="${esc(c.person_name)}"><label>部署</label><input data-i="${i}" data-f="department" value="${esc(c.department)}"><label>役職</label><input data-i="${i}" data-f="position" value="${esc(c.position)}"><label>電話</label><input data-i="${i}" data-f="phone" value="${esc(c.phone)}"><label>メール</label><input data-i="${i}" data-f="email" value="${esc(c.email)}"><label>住所</label><input data-i="${i}" data-f="address" value="${esc(c.address)}"></div>`).join('');document.querySelectorAll('[data-i]').forEach(e=>e.oninput=()=>cards[+e.dataset.i][e.dataset.f]=e.value);$('cardResultTitle').textContent=`${cards.length}枚の名刺を読み取りました`;$('cardResult').classList.remove('hidden')}catch(e){alert(e.message)}finally{this.disabled=false;this.textContent='名刺を読み取る'}};rd.readAsDataURL(f)};
$('saveAllCardsButton').onclick=async function(){let ok=0,merged=0,skipped=0;let companies=await get('/rest/v1/companies?select=id,company_name,address,phone');for(const c of cards){if(!c.company_name||!c.person_name){skipped++;continue}let co=companies.find(x=>companyNorm(x.company_name)===companyNorm(c.company_name));let id;if(co){id=co.id;merged++}else{let near=bestSimilarCompany(c.company_name,companies);if(near){let useExisting=confirm(`会社名の読み取りミスの可能性があります。\n\n読み取り：${c.company_name}\n既存候補：${near.company.company_name}\n\nOK：既存会社にまとめる\nキャンセル：別会社として登録する`);if(useExisting){id=near.company.id;merged++}else{id=null}}if(!id){let r=await fetch(`${U}/rest/v1/companies`,{method:'POST',headers:{...H,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({company_name:c.company_name,address:c.address||'',phone:c.phone||'',relationship_type:c.relationship_type,ai_review_status:'未調査'})}),d=await r.json();if(!r.ok){if(r.status===409){let fresh=await get('/rest/v1/companies?select=id,company_name');let same=fresh.find(x=>companyNorm(x.company_name)===companyNorm(c.company_name));if(same){id=same.id;merged++}else throw Error('会社登録で重複エラーが発生しました')}else throw Error(d?.message||'会社登録に失敗しました')}else{id=d[0]?.id;companies.push({id,company_name:c.company_name,address:c.address||'',phone:c.phone||''})}}}let people=await get(`/rest/v1/contacts?company_id=eq.${id}&select=name`);if(!people.some(p=>norm(p.name)===norm(c.person_name))){let pr=await fetch(`${U}/rest/v1/contacts`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({company_id:id,name:c.person_name,department:c.department||'',position:c.position||'',phone:c.phone||'',email:c.email||''})});if(pr.ok)ok++}}alert(`人物 ${ok}件を登録しました。\n既存会社へ統合 ${merged}件${skipped?`\n未登録 ${skipped}件`:''}`)};
async function loadCompanies(pushState=true){try{let ty=$('relationshipFilter').value,st=$('salesStatusFilter').value,rg=$('regionFilter').value,url='/rest/v1/companies?select=id,company_name,short_description,address,phone,sales_status,ai_review_status,relationship_type&order=company_name.asc';if(rg!=='すべて')url+=`&relationship_type=eq.${encodeURIComponent('顧客')}`;else if(ty!=='すべて')url+=`&relationship_type=eq.${encodeURIComponent(ty)}`;if(st!=='すべて')url+=`&relationship_type=eq.${encodeURIComponent('顧客')}&sales_status=eq.${encodeURIComponent(st)}`;let a=await getAll(url);if(rg!=='すべて')a=a.filter(c=>regionOfAddress(c.address)===rg);$('companyList').innerHTML=a.map(c=>`<div class="row"><strong class="clickable" data-company="${c.id}">${esc(c.company_name)}</strong><div class="company-summary">${esc(c.short_description||'AI調査中…')}</div><span class="badge ${esc(c.relationship_type||'その他')}">${esc(c.relationship_type||'その他')}</span><span class="status">${esc(c.ai_review_status||'未調査')}</span><br>${esc(c.address||'')}<br>${esc(c.phone||'')}</div>`).join('')||'<p class="muted">この地域の顧客は登録されていません。</p>';$('companyList').classList.remove('hidden');$('companyProfile').classList.add('hidden');const ctx=saveListContext();const listState={view:'companies',filters:{relationship:ctx.relationship,salesStatus:ctx.salesStatus,region:ctx.region},scrollY:ctx.scrollY};if(pushState)history.pushState(listState,'','#companies');else if(history.state?.view==='companies')history.replaceState(listState,'','#companies');document.querySelectorAll('[data-company]').forEach(e=>e.onclick=()=>showCompany(e.dataset.company,true))}catch(e){alert('会社一覧エラー：'+e.message)}}$('companyListButton').onclick=()=>loadCompanies(true);$('relationshipFilter').onchange=()=>loadCompanies(false);$('salesStatusFilter').onchange=()=>loadCompanies(false);$('regionFilter').onchange=()=>loadCompanies(false);
function choices(id,vals,sel=[]){let s=new Set(sel||[]);return `<div id="${id}" class="choice-group">${vals.map(v=>`<label class="choice"><input type="checkbox" value="${v}" ${s.has(v)?'checked':''}>${v}</label>`).join('')}</div>`}const checked=id=>[...document.querySelectorAll(`#${id} input:checked`)].map(x=>x.value);
async function showCompany(id,pushState=true){if(pushState){companyListScrollY=window.scrollY;const ctx=saveListContext();const prev={view:'companies',filters:{relationship:ctx.relationship,salesStatus:ctx.salesStatus,region:ctx.region},scrollY:ctx.scrollY};history.replaceState(prev,'','#companies');history.pushState({view:'company',id:String(id)},'',`#company-${id}`);detailOpen=true}let [a,p]=await Promise.all([get(`/rest/v1/companies?id=eq.${id}&select=*`),get(`/rest/v1/contacts?company_id=eq.${id}&select=*`)]);if(!a.length)return;let c=a[0],is=c.relationship_type==='顧客',arts=Array.isArray(c.related_articles)?c.related_articles:[];$('companyProfile').innerHTML=`<h3>${esc(c.company_name)}</h3><div class="company-summary">${esc(c.short_description||'AI調査中…')}</div><span class="status">${esc(c.ai_review_status||'未調査')}</span><div style="margin-top:12px"><strong>住所</strong><div style="margin-top:5px;line-height:1.55">${esc(c.address||'住所未登録')}</div>${c.address?`<div style="margin-top:6px"><a href="https://www.google.com/maps?q=${encodeURIComponent(`${c.company_name} ${c.address||''}`)}" target="_blank" rel="noopener noreferrer">Googleマップで場所を見る</a></div>`:''}</div><div class="section-gap"><h3>この会社の人物</h3>${p.map(x=>`<div class="row">${esc(x.name)}<br>${esc(x.department||'')} ${esc(x.position||'')}</div>`).join('')||'<p>人物登録なし</p>'}</div>${is?salesTopicsFor(c):''}${is?`<div class="tendency-box"><h3>注文実績、銘板の傾向</h3><label>種類</label>${choices('nameplateTypes',['プラスチック銘板','金属銘板','アルマイト銘板','ラベル','未分類'],c.nameplate_types)}<label>金属銘板の材質</label>${choices('metalMaterials',['SUS','真鍮','アルミ','未分類'],c.order_metal_materials)}<label>サイズ</label>${choices('nameplateSizes',['大型','中型','小型','未分類'],c.nameplate_sizes)}<label>数量</label>${choices('orderQuantities',['大量','中量','少量','未分類'],c.order_quantities)}<label>傾向メモ</label><textarea id="tendencyNotes">${esc(c.nameplate_tendency_notes||'')}</textarea></div>`:''}<label>主力製品・事業</label><textarea id="profileMain">${esc(c.main_products||'')}</textarea><label>今後の方針・注力分野</label><textarea id="profileFuture">${esc(c.future_direction||'')}</textarea><label>品質・取引上の特徴</label><textarea id="profileQuality">${esc(c.quality_purchasing_traits||'')}</textarea>${!is?`<label>取引上の接点</label><textarea id="profileOpp">${esc(c.sales_opportunities||'')}</textarea>`:''}<label>社内メモ</label><textarea id="profileNotes">${esc(c.sales_notes||'')}</textarea><label>公式サイト</label><input id="profileWeb" value="${esc(c.website||'')}">${c.website?`<div style="margin-top:7px">${urlLink(c.website,'公式サイトを開く')}</div>`:''}<label>公式YouTubeチャンネル</label>${c.youtube_url?`<a class="youtube-link" href="${esc(c.youtube_url)}" target="_blank" rel="noopener">YouTubeチャンネルを開く</a>`:'<div class="muted">公式YouTubeチャンネルは確認できていません。</div>'}<button class="primary" id="saveProfile">保存する</button>${glossaryFor(c)}<div class="section-gap"><h3>関連記事・ニュース</h3>${arts.map(x=>`<div class="article"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title||'記事を見る')}</a>${x.source||x.date?`<div class="meta">${esc(x.source||'')}${x.date?'・'+esc(x.date):''}</div>`:''}${x.summary?`<div>${esc(x.summary)}</div>`:''}</div>`).join('')||'<p class="muted">関連記事なし</p>'}</div>`;$('saveProfile').onclick=async()=>{let body={relationship_type:c.relationship_type,website:$('profileWeb').value||null,main_products:$('profileMain').value||null,future_direction:$('profileFuture').value||null,quality_purchasing_traits:$('profileQuality').value||null,sales_notes:$('profileNotes').value||null};if(!is&&$('profileOpp'))body.sales_opportunities=$('profileOpp').value||null;if(is){body.nameplate_types=checked('nameplateTypes');body.order_metal_materials=checked('metalMaterials');body.nameplate_sizes=checked('nameplateSizes');body.order_quantities=checked('orderQuantities');body.nameplate_tendency_notes=$('tendencyNotes').value||null}try{await patch(`/rest/v1/companies?id=eq.${id}`,body);alert('保存しました');showCompany(id,false)}catch(e){alert(e.message)}};$('companyList').classList.add('hidden');$('companyProfile').classList.remove('hidden');setTimeout(()=>{const el=$('companyProfile');const y=el.getBoundingClientRect().top+window.scrollY-78;window.scrollTo({top:Math.max(0,y),behavior:'auto'})},0)}
window.addEventListener('popstate',async e=>{const hs=e.state||{},saved=readListContext();if(detailOpen){detailOpen=false;restoreListContext(saved);if(hs.view!=='companies')history.replaceState({view:'companies',filters:saved?{relationship:saved.relationship,salesStatus:saved.salesStatus,region:saved.region}:null,scrollY:saved?.scrollY||0},'','#companies');await loadCompanies(false);const y=saved&&Number.isFinite(saved.scrollY)?saved.scrollY:(companyListScrollY||0);setTimeout(()=>window.scrollTo(0,y),0);return}if(hs.view==='companies'){const ctx=hs.filters?{relationship:hs.filters.relationship,salesStatus:hs.filters.salesStatus,region:hs.filters.region,scrollY:hs.scrollY}:saved;restoreListContext(ctx);await loadCompanies(false);const y=ctx&&Number.isFinite(ctx.scrollY)?ctx.scrollY:(companyListScrollY||0);setTimeout(()=>window.scrollTo(0,y),0)}else if(hs.view==='company'&&hs.id){detailOpen=true;await showCompany(hs.id,false)}else{$('companyList').classList.add('hidden');$('companyProfile').classList.add('hidden')}});
$('contactListButton').onclick=async()=>{try{let a=await get('/rest/v1/contacts?select=*&order=name.asc');$('contactList').innerHTML=a.map(c=>`<div class="row"><strong>${esc(c.name)}</strong><br>${esc(c.department||'')} ${esc(c.position||'')}<br>${esc(c.phone||'')}<br>${esc(c.email||'')}</div>`).join('');$('contactList').classList.remove('hidden')}catch(e){alert(e.message)}};$('activityListButton').onclick=async()=>{try{let a=await get('/rest/v1/activities?select=*&order=activity_date.desc');$('activityList').innerHTML=a.map(x=>`<div class="row"><strong>${esc(x.activity_date||'')} ${esc(x.activity_type||'')}</strong><br>${esc(x.notes||'')}</div>`).join('')||'<p>営業活動なし</p>';$('activityList').classList.remove('hidden')}catch(e){alert(e.message)}};
</script></body></html>
