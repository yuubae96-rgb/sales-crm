<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>営業管理</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    main {
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #111;
      color: white;
    }

    .secondary {
      background: #e9e9e9;
      color: #111;
    }

    h2 {
      margin-top: 0;
    }
  </style>
</head>

<body>

<header>
  営業管理
</header>

<main>

  <div class="card">
    <h2>名刺登録</h2>
    <p>名刺を撮影して、会社・人物情報を登録します。</p>
    <input type="file" id="cardCamera" accept="image/*" capture="environment" style="display:none;">
<button class="primary" onclick="document.getElementById('cardCamera').click()">名刺を撮影</button>
  </div>

  <div class="card">
    <h2>会社</h2>
    <p>登録されている会社を確認します。</p>
    <button class="secondary">会社一覧</button>
  </div>

  <div class="card">
    <h2>人物</h2>
    <p>名刺交換した担当者を確認します。</p>
    <button class="secondary">人物一覧</button>
  </div>

  <div class="card">
    <h2>営業活動</h2>
    <p>訪問履歴やローラー営業の進捗を管理します。</p>
    <button class="secondary">営業活動を見る</button>
  </div>

</main>

</body>
</html>
