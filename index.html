nput{width:16px;height:16px;margin:0}.tendency-box{border:1px solid #e6e6e6;border-radius:14px;padding:14px;margin-top:16px;background:#fffdfd}.topic-box{margin-top:14px;padding:15px;border-radius:14px;background:#fff7e8;border:1px solid #f4d9a8}.topic-box h3{margin-bottom:10px}.topic-section{margin-top:12px;padding-top:10px;border-top:1px solid #f0d7ac}.topic-section:first-of-type{margin-top:0;padding-top:0;border-top:0}.topic-section h4{font-size:16px;margin:0 0 8px}.topic-item{background:#fff;border:1px solid #ead9bd;border-radius:12px;padding:11px 12px;margin:8px 0}.topic-title{font-size:13px;font-weight:800;color:#7a5a21;margin-bottom:4px}.topic-talk{font-size:15px;line-height:1.65}.topic-why{font-size:13px;color:#666;margin-top:5px;line-height:1.5}.glossary{margin-top:16px;padding:15px;border-radius:14px;background:#f4f8ff;border:1px solid #dbe8ff}.glossary h3{margin-bottom:5px}.glossary-intro{font-size:14px;color:#555;margin:0 0 10px}.term{padding:12px 0;border-bottom:1px solid #dbe3ef}.term:last-child{border-bottom:0}.term b{display:block;margin-bottom:3px}.term span{font-size:14px;line-height:1.55;color:#333}.term-image{width:100%;max-width:420px;max-height:280px;object-fit:contain;background:#fff;border:1px solid #dbe3ef;border-radius:12px;margin-top:10px}.image-caption{font-size:12px;color:#666;margin-top:4px}.image-source{font-size:12px;margin-top:3px;display:inline-block}
</style></head><body><header>営業管理〜顧客のニーズに応える</header><main>
<div class="card"><h2>名刺一括登録</h2><p>複数枚を1枚の写真で読み取り、名刺ごとに区分を選んでまとめて登録できます。</p><input type="file" id="cardCamera" accept="image/*" capture="environment" class="hidden"><button class="primary" id="cameraButton">名刺を撮影</button><img id="cardPreview" class="hidden" style="width:100%;margin-top:15px;border-radius:12px"><button class="primary" id="readCardButton">名刺を読み取る</button><div id="cardResult" class="hidden section-gap"><h3 id="cardResultTitle">読み取り結果</h3><div id="batchCardList"></div><button class="primary" id="saveAllCardsButton">まとめて登録する</button></div></div>
<div class="card"><h2>会社・取引先</h2><button class="secondary" id="companyListButton">会社一覧</button><div class="filters"><div><label>取引先区分（顧客、材料、外注、設備、その他）</label><select id="relationshipFilter"><option>すべて</option><option>顧客</option><option>材料メーカー</option><option>外注先</option><option>設備会社</option><option>その他</option></select></div><div><label>営業状況（顧客のみ）</label><select id="salesStatusFilter"><option>すべて</option><option>未訪問</option><option>訪問済み</option><option>継続フォロー</option><option>見積あり</option><option>受注</option></select></div></div><div id="companyList" class="hidden section-gap"></div><div id="companyProfile" class="hidden section-gap"></div></div>

const $=id=>document.getElementById(id),U='https://emauqxftmauvsffdjvyh.supabase.co',K='sb_publishable_9rgwKLiJU9dGVkqttq0-fQ_hrhNqnfa',A='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4',H={apikey:K,Authorization:`Bearer ${A}`},T=['顧客','材料メーカー','外注先','設備会社','その他'];
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const norm=s=>(s||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();
const companyNorm=s=>norm(s).replace(/株式会社|有限会社|合同会社|合資会社|合名会社|\(株\)|（株）|\(有\)|（有）/g,'');
const urlLink=(url,label='リンクを開く')=>{const v=String(url||'').trim();return /^https?:\/\//i.test(v)?`<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:''};
const opts=s=>T.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('');
let companyListScrollY=0;
if(!history.state)history.replaceState({view:'home'},'',location.pathname+location.search);
function editDistance(a,b){a=companyNorm(a);b=companyNorm(b);const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function similarity(a,b){const x=companyNorm(a),y=companyNorm(b),max=Math.max(x.length,y.length);return max?1-editDistance(x,y)/max:1}
function bestSimilarCompany(name,companies){let best=null,score=0;for(const c of companies){const s=similarity(name,c.company_name);if(s>score){score=s;best=c}}return score>=0.72?{company:best,score}:null}
function glossaryFor(c){let items=Array.isArray(c.main_product_glossary)?c.main_product_glossary:[],imgs=Array.isArray(c.main_product_glossary_images)?c.main_product_glossary_images:[];if(!items.length)return `<div class="glossary"><h3>主力製品の用語をやさしく解説</h3><p class="glossary-intro">主力製品に関する専門用語は、現在まだAIで整理されていません。</p></div>`;return `<div class="glossary"><h3>主力製品の用語をやさしく解説</h3><p class="glossary-intro">文章だけで分かりにくいものは、確認できた実物写真や図も表示します。</p>${items.map(x=>{let im=imgs.find(y=>norm(y.term)===norm(x.term));return `<div class="term"><b>${esc(x.term||'')}</b><span>${esc(x.explanation||'')}</span>${im?`<div><img class="term-image" src="${esc(im.image_url)}" alt="${esc(x.term||'主力製品')}の参考画像" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='none';"><div><div class="image-caption">${esc(im.caption||'参考画像')}</div><a class="image-source" href="${esc(im.source_page_url)}" target="_blank" rel="noopener">画像の出典を見る</a></div></div>`:''}</div>`}).join('')}</div>`}
function linkifyText(text){const raw=String(text||'');const re=/(https?:\/\/[^\s<>'"）)】]+)(?=[\s<>'"）)】]|$)/g;let out='',last=0,m;while((m=re.exec(raw))){out+=esc(raw.slice(last,m.index));const u=m[1];out+=`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`;last=m.index+u.length}return out+esc(raw.slice(last))}
function topicItems(items){if(!Array.isArray(items)||!items.length)return '<p class="muted">AIが現在の話題を整理中です。</p>';return items.map(x=>`<div class="topic-item"><div class="topic-title">${linkifyText(x.title||'')}</div><div class="topic-talk">${linkifyText(x.talk||'')}</div>${x.why?`<div class="topic-why">なぜ使いやすい？ ${linkifyText(x.why)}</div>`:''}${x.url&&/^https?:\/\//i.test(x.url)?`<div class="topic-why"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">この話題の出典を開く</a></div>`:''}</div>`).join('')}
function salesTopicsFor(c){return `<div class="topic-box"><h3>今日の営業の話題</h3><div class="topic-section"><h4>① 今日の雑談ネタ</h4>${topicItems(c.smalltalk_topics)}</div><div class="topic-section"><h4>② この会社・業界の話題</h4>${topicItems(c.professional_topics)}</div></div>`}
async function get(path){let r=await fetch(U+path,{headers:H}),t=await r.text(),d;try{d=JSON.parse(t)}catch{throw Error(`データ取得エラー (${r.status})`)}if(!r.ok)throw Error(d?.message||`データ取得エラー (${r.status})`);return d}
async function patch(path,b){let r=await fetch(U+path,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw Error('保存に失敗しました');return r}
$('cameraButton').onclick=()=>$('cardCamera').click();$('cardCamera').onchange=function(){if(this.files[0]){$('cardPreview').src=URL.createObjectURL(this.files[0]);$('cardPreview').classList.remove('hidden')}};let cards=[];
$('readCardButton').onclick=async function(){let f=$('cardCamera').files[0];if(!f)return alert('先に名刺を撮影してください');this.disabled=true;this.textContent='AIで読み取り中…';let rd=new FileReader();rd.onload=async()=>{try{let r=await fetch(`${U}/functions/v1/read-business-card`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({image:rd.result})}),d=await r.json();if(!r.ok)throw Error(d.error||'読み取り失敗');cards=(d.cards||[]).map(x=>({...x,relationship_type:'顧客'}));$('batchCardList').innerHTML=cards.map((c,i)=>`<div class="batch-card"><h4>名刺 ${i+1}</h4><label>取引先区分（顧客、材料、外注、設備、その他）</label><select data-i="${i}" data-f="relationship_type">${opts('顧客')}</select><label>会社名</label><input data-i="${i}" data-f="company_name" value="${esc(c.company_name)}"><label>氏名</label><input data-i="${i}" data-f="person_name" value="${esc(c.person_name)}"><label>部署</label><input data-i="${i}" data-f="department" value="${esc(c.department)}"><label>役職</label><input data-i="${i}" data-f="position" value="${esc(c.position)}"><label>電話</label><input data-i="${i}" data-f="phone" value="${esc(c.phone)}"><label>メール</label><input data-i="${i}" data-f="email" value="${esc(c.email)}"><label>住所</label><input data-i="${i}" data-f="address" value="${esc(c.address)}"></div>`).join('');document.querySelectorAll('[data-i]').forEach(e=>e.oninput=()=>cards[+e.dataset.i][e.dataset.f]=e.value);$('cardResultTitle').textContent=`${cards.length}枚の名刺を読み取りました`;$('cardResult').classList.remove('hidden')}catch(e){alert(e.message)}finally{this.disabled=false;this.textContent='名刺を読み取る'}};rd.readAsDataURL(f)};
$('saveAllCardsButton').onclick=async function(){let ok=0,merged=0,skipped=0;let companies=await get('/rest/v1/companies?select=id,company_name,address,phone');for(const c of cards){if(!c.company_name||!c.person_name){skipped++;continue}let co=companies.find(x=>companyNorm(x.company_name)===companyNorm(c.company_name));let id;if(co){id=co.id;merged++}else{let near=bestSimilarCompany(c.company_name,companies);if(near){let useExisting=confirm(`会社名の読み取りミスの可能性があります。\n\n読み取り：${c.company_name}\n既存候補：${near.company.company_name}\n\nOK：既存会社にまとめる\nキャンセル：別会社として登録する`);if(useExisting){id=near.company.id;merged++}else{id=null}}if(!id){let r=await fetch(`${U}/rest/v1/companies`,{method:'POST',headers:{...H,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({company_name:c.company_name,address:c.address||'',phone:c.phone||'',relationship_type:c.relationship_type,ai_review_status:'未調査'})}),d=await r.json();if(!r.ok){if(r.status===409){let fresh=await get('/rest/v1/companies?select=id,company_name');let same=fresh.find(x=>companyNorm(x.company_name)===companyNorm(c.company_name));if(same){id=same.id;merged++}else throw Error('会社登録で重複エラーが発生しました')}else throw Error(d?.message||'会社登録に失敗しました')}else{id=d[0]?.id;companies.push({id,company_name:c.company_name,address:c.address||'',phone:c.phone||''})}}}let people=await get(`/rest/v1/contacts?company_id=eq.${id}&select=name`);if(!people.some(p=>norm(p.name)===norm(c.person_name))){let pr=await fetch(`${U}/rest/v1/contacts`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({company_id:id,name:c.person_name,department:c.department||'',position:c.position||'',phone:c.phone||'',email:c.email||''})});if(pr.ok)ok++}}alert(`人物 ${ok}件を登録しました。\n既存会社へ統合 ${merged}件${skipped?`\n未登録 ${skipped}件`:''}`)};
async function loadCompanies(pushState=true){try{let ty=$('relationshipFilter').value,st=$('salesStatusFilter').value,url='/rest/v1/companies?select=id,company_name,short_description,address,phone,sales_status,ai_review_status,relationship_type&order=company_name.asc';if(ty!=='すべて')url+=`&relationship_type=eq.${encodeURIComponent(ty)}`;if(st!=='すべて')url+=`&relationship_type=eq.${encodeURIComponent('顧客')}&sales_status=eq.${encodeURIComponent(st)}`;let a=await get(url);$('companyList').innerHTML=a.map(c=>`<div class="row"><strong class="clickable" data-company="${c.id}">${esc(c.company_name)}</strong><div class="company-summary">${esc(c.short_description||'AI調査中…')}</div><span class="badge ${esc(c.relationship_type||'その他')}">${esc(c.relationship_type||'その他')}</span><span class="status">${esc(c.ai_review_status||'未調査')}</span><br>${esc(c.address||'')}<br>${esc(c.phone||'')}</div>`).join('');$('companyList').classList.remove('hidden');$('companyProfile').classList.add('hidden');if(pushState)history.pushState({view:'companies'},'','#companies');document.querySelectorAll('[data-company]').forEach(e=>e.onclick=()=>showCompany(e.dataset.company,true))}catch(e){alert('会社一覧エラー：'+e.message)}}$('companyListButton').onclick=()=>loadCompanies(true);$('relationshipFilter').onchange=()=>loadCompanies(false);$('salesStatusFilter').onchange=()=>loadCompanies(false);
function choices(id,vals,sel=[]){let s=new Set(sel||[]);return `<div id="${id}" class="choice-group">${vals.map(v=>`<label class="choice"><input type="checkbox" value="${v}" ${s.has(v)?'checked':''}>${v}</label>`).join('')}</div>`}const checked=id=>[...document.querySelectorAll(`#${id} input:checked`)].map(x=>x.value);
async function showCompany(id,pushState=true){if(pushState){companyListScrollY=window.scrollY;history.pushState({view:'company',id:String(id)},'',`#company-${id}`)}let [a,p]=await Promise.all([get(`/rest/v1/companies?id=eq.${id}&select=*`),get(`/rest/v1/contacts?company_id=eq.${id}&select=*`)]);if(!a.length)return;let c=a[0],is=c.relationship_type==='顧客',arts=Array.isArray(c.related_articles)?c.related_articles:[];$('companyProfile').innerHTML=`<h3>${esc(c.company_name)}</h3><div class="company-summary">${esc(c.short_description||'AI調査中…')}</div><span class="status">${esc(c.ai_review_status||'未調査')}</span><div style="margin-top:12px"><strong>住所</strong><div style="margin-top:5px;line-height:1.55">${esc(c.address||'住所未登録')}</div>${c.address?`<div style="margin-top:6px"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${c.company_name} ${c.address||''}`)}" target="_blank" rel="noopener noreferrer" onclick="event.preventDefault();window.open(this.href, '_blank', 'noopener,noreferrer');return false;">Googleマップで場所を見る</a></div>`:''}</div><div class="section-gap"><h3>この会社の人物</h3>${p.map(x=>`<div class="row">${esc(x.name)}<br>${esc(x.department||'')} ${esc(x.position||'')}</div>`).join('')||'<p>人物登録なし</p>'}</div>${is?salesTopicsFor(c):''}${is?`<div class="tendency-box"><h3>注文実績、銘板の傾向</h3><label>種類</label>${choices('nameplateTypes',['プラスチック銘板','金属銘板','アルマイト銘板','ラベル','未分類'],c.nameplate_types)}<label>金属銘板の材質</label>${choices('metalMaterials',['SUS','真鍮','アルミ','未分類'],c.order_metal_materials)}<label>サイズ</label>${choices('nameplateSizes',['大型','中型','小型','未分類'],c.nameplate_sizes)}<label>数量</label>${choices('orderQuantities',['大量','中量','少量','未分類'],c.order_quantities)}<label>傾向メモ</label><textarea id="tendencyNotes">${esc(c.nameplate_tendency_notes||'')}</textarea></div>`:''}<label>主力製品・事業</label><textarea id="profileMain">${esc(c.main_products||'')}</textarea><label>今後の方針・注力分野</label><textarea id="profileFuture">${esc(c.future_direction||'')}</textarea><label>品質・取引上の特徴</label><textarea id="profileQuality">${esc(c.quality_purchasing_traits||'')}</textarea>${!is?`<label>取引上の接点</label><textarea id="profileOpp">${esc(c.sales_opportunities||'')}</textarea>`:''}<label>社内メモ</label><textarea id="profileNotes">${esc(c.sales_notes||'')}</textarea><label>公式サイト</label><input id="profileWeb" value="${esc(c.website||'')}">${c.website?`<div style="margin-top:7px">${urlLink(c.website,'公式サイトを開く')}</div>`:''}<label>公式YouTubeチャンネル</label>${c.youtube_url?`<a class="youtube-link" href="${esc(c.youtube_url)}" target="_blank" rel="noopener">YouTubeチャンネルを開く</a>`:'<div class="muted">公式YouTubeチャンネルは確認できていません。</div>'}<button class="primary" id="saveProfile">保存する</button>${glossaryFor(c)}<div class="section-gap"><h3>関連記事・ニュース</h3>${arts.map(x=>`<div class="article"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title||'記事を見る')}</a>${x.source||x.date?`<div class="meta">${esc(x.source||'')}${x.date?'・'+esc(x.date):''}</div>`:''}${x.summary?`<div>${esc(x.summary)}</div>`:''}</div>`).join('')||'<p class="muted">関連記事なし</p>'}</div>`;$('saveProfile').onclick=async()=>{let body={relationship_type:c.relationship_type,website:$('profileWeb').value||null,main_products:$('profileMain').value||null,future_direction:$('profileFuture').value||null,quality_purchasing_traits:$('profileQuality').value||null,sales_notes:$('profileNotes').value||null};if(!is&&$('profileOpp'))body.sales_opportunities=$('profileOpp').value||null;if(is){body.nameplate_types=checked('nameplateTypes');body.order_metal_materials=checked('metalMaterials');body.nameplate_sizes=checked('nameplateSizes');body.order_quantities=checked('orderQuantities');body.nameplate_tendency_notes=$('tendencyNotes').value||null}try{await patch(`/rest/v1/companies?id=eq.${id}`,body);alert('保存しました');showCompany(id,false)}catch(e){alert(e.message)}};$('companyList').classList.add('hidden');$('companyProfile').classList.remove('hidden');setTimeout(()=>{const el=$('companyProfile');const y=el
