<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>営業管理</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    main {
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #111;
      color: white;
    }

    .secondary {
      background: #e9e9e9;
      color: #111;
    }

    h2 {
      margin-top: 0;
    }
  </style>
</head>

<body>

<header>
  営業管理
</header>

<main>

  <div class="card">
    <h2>名刺登録</h2>
    <p>名刺を撮影して、会社・人物情報を登録します。</p>
    <input type="file" id="cardCamera" accept="image/*" capture="environment" style="display:none;">
<button class="primary" onclick="document.getElementById('cardCamera').click()">名刺を撮影</button>
<img id="cardPreview" style="display:none; width:100%; margin-top:15px; border-radius:12px;">
 <button class="primary" id="readCardButton">名刺を読み取る</button>
  </div>

  <div class="card">
    <h2>会社</h2>
    <p>登録されている会社を確認します。</p>
    <button class="secondary">会社一覧</button>
  </div>

  <div class="card">
    <h2>人物</h2>
    <p>名刺交換した担当者を確認します。</p>
    <button class="secondary">人物一覧</button>
  </div>

  <div class="card">
    <h2>営業活動</h2>
    <p>訪問履歴やローラー営業の進捗を管理します。</p>
    <button class="secondary">営業活動を見る</button>
  </div>

</main>
<script>
document.getElementById('cardCamera').addEventListener('change', function () {
  const file = this.files[0];
  if (!file) return;

  const preview = document.getElementById('cardPreview');
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
});
  alert("読み取り機能の準備OK");
 document.getElementById('readCardButton').addEventListener('click', async function () {
   alert("読み取りボタン押した！");
   alert("画像あり: " + (document.getElementById('cardCamera').files.length > 0));
  const fileInput = document.getElementById('readCardButton');
  const file = fileInput.files[0];

  if (!file) {
    alert('先に名刺を撮影してください');
    return;
  }

  const reader = new FileReader();

  reader.onload = async function () {
    const imageBase64 = reader.result;
alert("Supabaseに送信します");
    const response = await fetch(
      `${SUPABASE_URL}/functions/v1/read-business-card`,
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        },
        body: JSON.stringify({
          image: imageBase64
        })
      }
    );

    const data = await response.json();

    console.log(data);
    alert('名刺を読み取りました。次に内容を表示する画面を作ります。');
  };

  reader.readAsDataURL(file);
}); 
</script>
  const SUPABASE_URL = "https://emauqxftmauvsffdjvyh.supabase.co/rest/v1/";
  const SUPABASE_KEY = "sb_publishable_9rgwKLiJU9dGVkqttq0-fQ_hrhNqnfa";
</body>
</html>
