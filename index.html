<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>営業管理</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#fff;padding:18px 20px;font-size:24px;font-weight:700;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
main{padding:16px;max-width:850px;margin:auto}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0001}
h2,h3,h4{margin-top:0}label{display:block;margin-top:12px;margin-bottom:5px;font-weight:700}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}
button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#e9e9e9;color:#111}
.row{padding:13px 0;border-bottom:1px solid #e5e5e5}.clickable{cursor:pointer;text-decoration:underline;text-underline-offset:3px}.muted{color:#666;font-size:14px}.hidden{display:none}.section-gap{margin-top:18px;padding-top:16px;border-top:1px solid #ddd}
.badge{display:inline-block;font-size:13px;font-weight:800;padding:5px 9px;border-radius:999px;margin:5px 6px 4px 0}.顧客{background:#ff4fa3;color:#fff}.材料メーカー{background:#a9ef61}.外注先{background:#66d9ff}.設備会社{background:#ffe45e}.その他{background:#ddd}
.status{display:inline-block;font-size:12px;padding:4px 8px;border-radius:999px;background:#eee}.batch-card,.article{border:1px solid #ddd;border-radius:14px;padding:14px;margin-top:14px;background:#fafafa}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.filters{grid-template-columns:1fr}}
.article a{font-weight:700}.article .meta{font-size:13px;color:#666}.remove-card{width:auto;padding:8px 12px;font-size:14px}
</style>
</head>
<body>
<header>営業管理</header>
<main>

<div class="card">
<h2>名刺一括登録</h2>
<p>複数枚を1枚の写真で読み取り、名刺ごとに区分を選んでまとめて登録できます。</p>
<input type="file" id="cardCamera" accept="image/*" capture="environment" class="hidden">
<button class="primary" id="cameraButton">名刺を撮影</button>
<img id="cardPreview" class="hidden" style="width:100%;margin-top:15px;border-radius:12px">
<button class="primary" id="readCardButton">名刺を読み取る</button>
<div id="cardResult" class="hidden section-gap">
<h3 id="cardResultTitle">読み取り結果</h3>
<p class="muted">顧客・材料メーカー・外注先・設備会社・その他のどれでも、会社情報と関連記事をAI調査します。</p>
<div id="batchCardList"></div>
<button class="primary" id="saveAllCardsButton">まとめて登録する</button>
</div>
</div>

<div class="card">
<h2>会社・取引先</h2>
<button class="secondary" id="companyListButton">会社一覧</button>
<div class="filters">
<div><label>取引先区分</label><select id="relationshipFilter"><option>すべて</option><option>顧客</option><option>材料メーカー</option><option>外注先</option><option>設備会社</option><option>その他</option></select></div>
<div><label>営業状況（顧客のみ）</label><select id="salesStatusFilter"><option>すべて</option><option>未訪問</option><option>訪問済み</option><option>継続フォロー</option><option>見積あり</option><option>受注</option></select></div>
</div>
<div id="companyList" class="hidden section-gap"></div>
<div id="companyProfile" class="hidden section-gap"></div>
</div>

<div class="card">
<h2>人物</h2>
<button class="secondary" id="contactListButton">人物一覧</button>
<div id="contactList" class="hidden section-gap"></div>
<div id="contactProfile" class="hidden section-gap"></div>
</div>

<div class="card">
<h2>営業活動</h2>
<button class="secondary" id="activityListButton">営業活動を見る</button>
<div id="activityList" class="hidden section-gap"></div>
</div>

<div id="activityForm" class="card hidden">
<h3>営業活動を登録</h3><div id="activityTarget" class="muted"></div>
<label>活動日</label><input type="date" id="activityDate">
<label>活動種類</label><select id="activityType"><option>引き合い</option><option>訪問</option><option>電話</option><option>メール</option><option>見積提出</option><option>打ち合わせ</option><option>受注</option><option>失注</option><option>その他</option></select>
<label>内容</label><textarea id="activityNotes" rows="4"></textarea>
<label>次回フォロー日</label><input type="date" id="nextFollowupDate">
<button class="primary" id="saveActivityButton">登録する</button>
</div>

</main>
<script>
const U="https://emauqxftmauvsffdjvyh.supabase.co";
const K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4";
const H={'apikey':K,'Authorization':`Bearer ${K}`},T=['顧客','材料メーカー','外注先','設備会社','その他'];
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
const norm=s=>(s||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();
const opts=s=>T.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('');
const dateJP=v=>{if(!v)return'';let d=new Date(v+(v.length===10?'T00:00:00':''));return isNaN(d)?v:`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`};
const get=async path=>{let r=await fetch(U+path,{headers:H});return r.json()};
const patch=async(path,body)=>fetch(U+path,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(body)});

cameraButton.onclick=()=>cardCamera.click();
cardCamera.onchange=function(){if(!this.files[0])return;cardPreview.src=URL.createObjectURL(this.files[0]);cardPreview.classList.remove('hidden')};
let cards=[];
function renderCards(a){cards=a.map(x=>({...x,relationship_type:'顧客'}));batchCardList.innerHTML='';cardResultTitle.textContent=`${cards.length}枚の名刺を読み取りました`;
cards.forEach((c,i)=>{let d=document.createElement('div');d.className='batch-card';d.innerHTML=`<h4>名刺 ${i+1}</h4><label>取引先区分</label><select data-f="relationship_type">${opts(c.relationship_type)}</select><label>会社名</label><input data-f="company_name" value="${esc(c.company_name)}"><label>氏名</label><input data-f="person_name" value="${esc(c.person_name)}"><label>部署</label><input data-f="department" value="${esc(c.department)}"><label>役職</label><input data-f="position" value="${esc(c.position)}"><label>電話</label><input data-f="phone" value="${esc(c.phone)}"><label>メール</label><input data-f="email" value="${esc(c.email)}"><label>住所</label><input data-f="address" value="${esc(c.address)}"><button class="remove-card">除外</button>`;
d.querySelectorAll('[data-f]').forEach(e=>e.oninput=()=>cards[i][e.dataset.f]=e.value);d.querySelector('.remove-card').onclick=()=>{cards[i]._removed=true;d.remove()};batchCardList.appendChild(d)});
cardResult.classList.remove('hidden')}

readCardButton.onclick=async function(){let f=cardCamera.files[0];if(!f)return alert('先に名刺を撮影してください');this.disabled=true;this.textContent='AIで読み取り中…';let rd=new FileReader();rd.onload=async()=>{try{let r=await fetch(`${U}/functions/v1/read-business-card`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({image:rd.result})});let d=await r.json();if(!r.ok)throw Error(d.error||'読み取り失敗');if(!d.cards?.length)throw Error('名刺を認識できませんでした');renderCards(d.cards)}catch(e){alert(e.message)}finally{this.disabled=false;this.textContent='名刺を読み取る'}};rd.readAsDataURL(f)};

async function companyByName(n){let rows=await get('/rest/v1/companies?select=id,company_name,relationship_type');return rows.find(x=>norm(x.company_name)===norm(n))}
async function ensureCompany(c,cache){let n=(c.company_name||'').trim(),key=norm(n),type=c.relationship_type||'顧客';if(cache.has(key))return cache.get(key);let x=await companyByName(n);
if(x){if(x.relationship_type!==type)await patch(`/rest/v1/companies?id=eq.${x.id}`,{relationship_type:type,ai_review_status:'未調査'});cache.set(key,x.id);return x.id}
let r=await fetch(`${U}/rest/v1/companies`,{method:'POST',headers:{...H,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({company_name:n,address:c.address||'',phone:c.phone||'',relationship_type:type,ai_review_status:'未調査'})});let d=await r.json();if(!r.ok)throw Error(`${n}の会社登録に失敗`);cache.set(key,d[0].id);return d[0].id}
async function regCard(c,cache){let id=await ensureCompany(c,cache),p=(c.person_name||'').trim();let cs=await get(`/rest/v1/contacts?company_id=eq.${id}&select=id,name`);if(cs.some(x=>norm(x.name)===norm(p)))return'dup';
let r=await fetch(`${U}/rest/v1/contacts`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({company_id:id,name:p,department:c.department||'',position:c.position||'',phone:c.phone||'',email:c.email||''})});if(!r.ok)throw Error(`${p}の人物登録に失敗`);return'ok'}
saveAllCardsButton.onclick=async function(){let a=cards.filter(x=>!x._removed);if(a.some(x=>!x.company_name?.trim()||!x.person_name?.trim()))return alert('会社名または氏名が空欄です');this.disabled=true;let cache=new Map(),ok=0,dup=0,err=[];for(let c of a){try{(await regCard(c,cache))==='ok'?ok++:dup++}catch(e){err.push(e.message)}}alert(`${ok}件登録しました${dup?`\n${dup}件は重複`:''}${err.length?`\n${err.join('\n')}`:''}`);this.disabled=false;if(!err.length){cards=[];cardResult.classList.add('hidden');cardPreview.classList.add('hidden');cardCamera.value=''}};

async function loadCompanies(){let ty=relationshipFilter.value,st=salesStatusFilter.value,url='/rest/v1/companies?select=id,company_name,address,phone,sales_status,ai_review_status,relationship_type&order=company_name.asc';if(ty!=='すべて')url+=`&relationship_type=eq.${encodeURIComponent(ty)}`;if(st!=='すべて')url+=`&relationship_type=eq.${encodeURIComponent('顧客')}&sales_status=eq.${encodeURIComponent(st)}`;let a=await get(url);companyList.innerHTML='';companyList.classList.remove('hidden');companyProfile.classList.add('hidden');
a.forEach(c=>{let d=document.createElement('div'),is=c.relationship_type==='顧客';d.className='row';d.innerHTML=`<strong class="clickable">${esc(c.company_name)}</strong><br><span class="badge ${esc(c.relationship_type||'その他')}">${esc(c.relationship_type||'その他')}</span><span class="status">${esc(c.ai_review_status||'未調査')}</span><br>${esc(c.address||'')}<br>${esc(c.phone||'')}${is?`<label>営業状況</label><select class="ss">${['未訪問','訪問済み','継続フォロー','見積あり','受注'].map(x=>`<option ${x===c.sales_status?'selected':''}>${x}</option>`).join('')}</select>`:''}`;d.querySelector('strong').onclick=()=>showCompany(c.id);let s=d.querySelector('.ss');if(s)s.onchange=e=>patch(`/rest/v1/companies?id=eq.${c.id}`,{sales_status:e.target.value});companyList.appendChild(d)})}
companyListButton.onclick=loadCompanies;relationshipFilter.onchange=loadCompanies;salesStatusFilter.onchange=loadCompanies;

function articleHtml(a){return `<div class="article"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title||'記事を見る')}</a><div class="meta">${esc(a.source||'')}${a.date?' ／ '+esc(a.date):''}</div>${a.summary?`<div>${esc(a.summary)}</div>`:''}</div>`}
async function showCompany(id){let [cs,people]=await Promise.all([get(`/rest/v1/companies?id=eq.${id}&select=*`),get(`/rest/v1/contacts?company_id=eq.${id}&select=id,name,department,position,phone,email&order=name.asc`)]);if(!cs.length)return;let c=cs[0],arts=Array.isArray(c.related_articles)?c.related_articles:[],is=c.relationship_type==='顧客';
companyProfile.dataset.id=id;companyProfile.innerHTML=`<h3>${esc(c.company_name)}</h3><span class="badge ${esc(c.relationship_type||'その他')}">${esc(c.relationship_type||'その他')}</span><span class="status">${esc(c.ai_review_status||'未調査')}</span>${c.ai_researched_at?`<div class="muted">AI調査日：${dateJP(c.ai_researched_at.slice(0,10))}</div>`:''}<label>取引先区分</label><select id="profileType">${opts(c.relationship_type||'その他')}</select><label>公式サイト</label><input id="profileWeb" value="${esc(c.website||'')}"><label>主力製品・事業</label><textarea id="profileMain" rows="4">${esc(c.main_products||'')}</textarea><label>今後の方針・注力分野</label><textarea id="profileFuture" rows="4">${esc(c.future_direction||'')}</textarea><label>品質・取引上の特徴</label><textarea id="profileQuality" rows="4">${esc(c.quality_purchasing_traits||'')}</textarea><label>${is?'営業チャンス':'取引上の接点'}</label><textarea id="profileOpp" rows="4">${esc(c.sales_opportunities||'')}</textarea><label>社内メモ</label><textarea id="profileNotes" rows="4">${esc(c.sales_notes||'')}</textarea><button class="primary" id="saveProfile">保存する</button><div class="section-gap"><h3>関連記事・ニュース</h3>${arts.length?arts.map(articleHtml).join(''):'<p class="muted">関連記事は見つかっていません。</p>'}</div><div class="section-gap"><h3>この会社の人物</h3><div id="people"></div></div>`;
let pb=companyProfile.querySelector('#people');people.forEach(p=>{let d=document.createElement('div');d.className='row';d.innerHTML=`<strong class="clickable">${esc(p.name)}</strong><br>${esc(p.department||'')} ${esc(p.position||'')}<br>${esc(p.phone||'')}<br>${esc(p.email||'')}`;d.querySelector('strong').onclick=()=>showContact(p.id);pb.appendChild(d)});if(!people.length)pb.innerHTML='<p>人物登録なし</p>';
saveProfile.onclick=async()=>{let type=profileType.value;await patch(`/rest/v1/companies?id=eq.${id}`,{relationship_type:type,website:profileWeb.value.trim()||null,main_products:profileMain.value.trim()||null,future_direction:profileFuture.value.trim()||null,quality_purchasing_traits:profileQuality.value.trim()||null,sales_opportunities:profileOpp.value.trim()||null,sales_notes:profileNotes.value.trim()||null,ai_review_status:type!==c.relationship_type?'未調査':c.ai_review_status});alert('保存しました');showCompany(id)};
companyList.classList.add('hidden');companyProfile.classList.remove('hidden');companyProfile.scrollIntoView({behavior:'smooth'})}

contactListButton.onclick=async()=>{let a=await get('/rest/v1/contacts?select=id,name,department,position,phone,email&order=name.asc');contactList.innerHTML='';contactList.classList.remove('hidden');a.forEach(c=>{let d=document.createElement('div');d.className='row';d.innerHTML=`<strong class="clickable">${esc(c.name)}</strong><br>${esc(c.department||'')} ${esc(c.position||'')}<br>${esc(c.phone||'')}<br>${esc(c.email||'')}`;d.querySelector('strong').onclick=()=>showContact(c.id);contactList.appendChild(d)})};
async function showContact(id){let [cs,acts]=await Promise.all([get(`/rest/v1/contacts?id=eq.${id}&select=*`),get(`/rest/v1/activities?contact_id=eq.${id}&select=*&order=activity_date.desc`)]);if(!cs.length)return;let c=cs[0];contactProfile.dataset.id=id;contactProfile.innerHTML=`<h3>${esc(c.name)}</h3><div>${esc(c.department||'')} ${esc(c.position||'')}</div><label>趣味・好きな話題</label><textarea id="hobby">${esc(c.hobbies_topics||'')}</textarea><label>家族に関する会話メモ</label><textarea id="family">${esc(c.family_notes||'')}</textarea><label>好み・関心事項</label><textarea id="pref">${esc(c.preferences||'')}</textarea><label>人物・商談メモ</label><textarea id="personnote">${esc(c.person_notes||'')}</textarea><button class="primary" id="savePerson">人物メモを保存</button><div class="section-gap"><h3>営業活動履歴</h3>${acts.map(a=>`<div class="row"><strong>${dateJP(a.activity_date)} ${esc(a.activity_type||'')}</strong><br>${esc(a.notes||'')}</div>`).join('')||'<p>なし</p>'}<button class="secondary" id="addAct">営業活動を登録</button></div>`;
savePerson.onclick=async()=>{await patch(`/rest/v1/contacts?id=eq.${id}`,{hobbies_topics:hobby.value||null,family_notes:family.value||null,preferences:pref.value||null,person_notes:personnote.value||null,last_updated_at:new Date().toISOString()});alert('保存しました')};addAct.onclick=()=>openActivity(id,c.name);contactList.classList.add('hidden');contactProfile.classList.remove('hidden')}
function openActivity(id,name){activityForm.dataset.id=id;activityTarget.textContent=`対象：${name}`;activityDate.value=new Date().toISOString().slice(0,10);activityForm.classList.remove('hidden');activityForm.scrollIntoView({behavior:'smooth'})}
saveActivityButton.onclick=async()=>{let r=await fetch(`${U}/rest/v1/activities`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({contact_id:Number(activityForm.dataset.id),activity_date:activityDate.value,activity_type:activityType.value,notes:activityNotes.value,next_followup_date:nextFollowupDate.value||null})});alert(r.ok?'登録しました':'登録失敗');if(r.ok)activityForm.classList.add('hidden')};
activityListButton.onclick=async()=>{let a=await get('/rest/v1/activities?select=*&order=activity_date.desc');activityList.innerHTML=a.map(x=>`<div class="row"><strong>${dateJP(x.activity_date)} ${esc(x.activity_type||'')}</strong><br>${esc(x.notes||'')}</div>`).join('')||'<p>営業活動なし</p>';activityList.classList.remove('hidden')};
</script>
</body></html>
