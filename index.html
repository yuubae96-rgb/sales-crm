<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業管理</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#fff;padding:18px 20px;font-size:24px;font-weight:700;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}
main{padding:16px;max-width:820px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h2,h3,h4{margin-top:0}
label{display:block;margin-top:12px;margin-bottom:5px;font-weight:700}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}
textarea{resize:vertical}
button{width:100%;padding:16px;margin-top:10px;border:0;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer}
.primary{background:#111;color:#fff}.secondary{background:#e9e9e9;color:#111}
.row{padding:12px 0;border-bottom:1px solid #e5e5e5}
.clickable{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.muted{color:#666;font-size:14px}.status,.type-badge{display:inline-block;font-size:13px;padding:4px 8px;border-radius:999px;background:#f0f0f0;margin:5px 5px 0 0;font-weight:800;border:1px solid rgba(0,0,0,.08)}.type-customer{background:#ff5ca8;color:#fff}.type-material{background:#b8ef6b;color:#1f3a00}.type-subcontract{background:#76d7ff;color:#00354a}.type-equipment{background:#ffd166;color:#4a3300}.type-other{background:#d9d9d9;color:#333}
.hidden{display:none}.section-gap{margin-top:18px;padding-top:16px;border-top:1px solid #ddd}
.batch-card{border:1px solid #ddd;border-radius:14px;padding:14px;margin-top:14px;background:#fafafa}
.remove-card{width:auto;padding:8px 12px;font-size:14px;background:#eee;color:#333}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>営業管理</header>
<main>

<div class="card">
  <h2>名刺一括登録</h2>
  <p>名刺を複数枚並べて1枚の写真に撮れます。読み取り後、名刺ごとに取引先区分を選んでまとめて登録できます。</p>
  <input type="file" id="cardCamera" accept="image/*" capture="environment" class="hidden">
  <button class="primary" id="cameraButton">名刺を撮影</button>
  <img id="cardPreview" class="hidden" style="width:100%;margin-top:15px;border-radius:12px">
  <button class="primary" id="readCardButton">名刺を読み取る</button>
  <div id="cardResult" class="hidden section-gap">
    <h3 id="cardResultTitle">読み取り結果</h3>
    <p class="muted">「顧客」だけが営業カルテ・AI会社調査の対象です。材料メーカー、外注先、設備会社などは取引先名刺帳として管理します。</p>
    <div id="batchCardList"></div>
    <button class="primary" id="saveAllCardsButton">まとめて登録する</button>
  </div>
</div>

<div class="card">
  <h2>会社・取引先</h2>
  <p>顧客、材料メーカー、外注先、設備会社などを分類して確認します。</p>
  <button class="secondary" id="companyListButton">会社一覧</button>
  <div class="filters">
    <div>
      <label>取引先区分</label>
      <select id="relationshipFilter">
        <option value="すべて">すべて</option>
        <option value="顧客">顧客</option>
        <option value="材料メーカー">材料メーカー</option>
        <option value="外注先">外注先</option>
        <option value="設備会社">設備会社</option>
        <option value="その他">その他</option>
      </select>
    </div>
    <div>
      <label>営業状況（顧客のみ）</label>
      <select id="salesStatusFilter">
        <option value="すべて">すべて</option>
        <option value="未訪問">未訪問</option>
        <option value="訪問済み">訪問済み</option>
        <option value="継続フォロー">継続フォロー</option>
        <option value="見積あり">見積あり</option>
        <option value="受注">受注</option>
      </select>
    </div>
  </div>
  <div id="companyList" class="hidden section-gap"></div>
  <div id="companyProfile" class="hidden section-gap"></div>
</div>

<div class="card">
  <h2>人物</h2>
  <p>担当者の情報、趣味・話題、家族に関する会話メモなどを管理します。</p>
  <button class="secondary" id="contactListButton">人物一覧</button>
  <div id="contactList" class="hidden section-gap"></div>
  <div id="contactProfile" class="hidden section-gap"></div>
</div>

<div class="card">
  <h2>営業活動</h2>
  <p>顧客への訪問・引き合い・見積などの履歴を確認します。</p>
  <button class="secondary" id="activityListButton">営業活動を見る</button>
  <div id="activityList" class="hidden section-gap"></div>
</div>

<div id="activityForm" class="card hidden">
  <h3>営業活動を登録</h3>
  <div id="activityTarget" class="muted"></div>
  <label>活動日</label><input type="date" id="activityDate">
  <label>活動種類</label>
  <select id="activityType">
    <option>引き合い</option><option>訪問</option><option>電話</option><option>メール</option>
    <option>見積提出</option><option>打ち合わせ</option><option>受注</option><option>失注</option><option>その他</option>
  </select>
  <label>内容</label><textarea id="activityNotes" rows="4"></textarea>
  <label>次回フォロー日</label><input type="date" id="nextFollowupDate">
  <button class="primary" id="saveActivityButton">登録する</button>
</div>

</main>
<script>
const SUPABASE_URL="https://emauqxftmauvsffdjvyh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4";
const apiHeaders={'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`};
const TYPES=['顧客','材料メーカー','外注先','設備会社','その他'];
const normalizeText=s=>(s||'').normalize('NFKC').replace(/\s+/g,'').replace(/[‐‑–—―ー－]/g,'-').toLowerCase();
const escapeHtml=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
function formatDateJP(v){if(!v)return'';const d=new Date(v+(v.length===10?'T00:00:00':''));return Number.isNaN(d.getTime())?v:`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function typeOptions(selected){return TYPES.map(t=>`<option value="${t}" ${selected===t?'selected':''}>${t}</option>`).join('')}
function typeClass(t){return t==='顧客'?'type-customer':t==='材料メーカー'?'type-material':t==='外注先'?'type-subcontract':t==='設備会社'?'type-equipment':'type-other'}

document.getElementById('cameraButton').onclick=()=>document.getElementById('cardCamera').click();
document.getElementById('cardCamera').addEventListener('change',function(){const f=this.files[0];if(!f)return;const p=document.getElementById('cardPreview');p.src=URL.createObjectURL(f);p.classList.remove('hidden')});

let currentCards=[];
function renderBatchCards(cards){
  const box=document.getElementById('batchCardList');box.innerHTML='';
  currentCards=cards.map((c,i)=>({...c,company_name:c.company_name||'',person_name:c.person_name||'',department:c.department||'',position:c.position||'',phone:c.phone||'',email:c.email||'',address:c.address||'',relationship_type:'顧客',_index:i}));
  document.getElementById('cardResultTitle').textContent=`${currentCards.length}枚の名刺を読み取りました`;
  currentCards.forEach((card,index)=>{
    const b=document.createElement('div');b.className='batch-card';b.innerHTML=`
      <h4>名刺 ${index+1}</h4>
      <label>取引先区分</label><select data-field="relationship_type">${typeOptions(card.relationship_type)}</select>
      <label>会社名</label><input data-field="company_name" value="${escapeHtml(card.company_name)}">
      <label>氏名</label><input data-field="person_name" value="${escapeHtml(card.person_name)}">
      <label>部署</label><input data-field="department" value="${escapeHtml(card.department)}">
      <label>役職</label><input data-field="position" value="${escapeHtml(card.position)}">
      <label>電話番号</label><input data-field="phone" value="${escapeHtml(card.phone)}">
      <label>メールアドレス</label><input data-field="email" value="${escapeHtml(card.email)}">
      <label>住所</label><input data-field="address" value="${escapeHtml(card.address)}">
      <button type="button" class="remove-card">この名刺を除外</button>`;
    b.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>currentCards[index][el.dataset.field]=el.value));
    b.querySelector('.remove-card').onclick=()=>{currentCards[index]._removed=true;b.remove();const n=currentCards.filter(c=>!c._removed).length;document.getElementById('cardResultTitle').textContent=`${n}枚の名刺を登録対象にしています`};
    box.appendChild(b);
  });
  document.getElementById('cardResult').classList.remove('hidden');
}

document.getElementById('readCardButton').addEventListener('click',async function(){
  const f=document.getElementById('cardCamera').files[0];if(!f){alert('先に名刺を撮影してください');return}
  this.disabled=true;const old=this.textContent;this.textContent='AIで読み取り中…';
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const r=await fetch(`${SUPABASE_URL}/functions/v1/read-business-card`,{method:'POST',headers:{'Content-Type':'application/json',...apiHeaders},body:JSON.stringify({image:reader.result})});
      const d=await r.json();if(!r.ok)throw new Error(d?.error||'名刺読み取りに失敗しました');
      const cards=Array.isArray(d.cards)?d.cards:[];if(!cards.length)throw new Error('名刺を認識できませんでした。名刺を大きく、重ならないように撮影してください。');
      renderBatchCards(cards);
    }catch(e){alert('読み取りエラー：'+e.message)}
    finally{this.disabled=false;this.textContent=old}
  };reader.readAsDataURL(f);
});

async function findCompanyByName(name){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/companies?select=id,company_name,relationship_type`,{headers:apiHeaders});
  const rows=await r.json();return rows.find(c=>normalizeText(c.company_name)===normalizeText(name));
}
async function getOrCreateCompany(card,cache){
  const name=(card.company_name||'').trim();if(!name)throw new Error('会社名が空欄の名刺があります');
  const key=normalizeText(name);
  if(cache.has(key))return cache.get(key);
  let company=await findCompanyByName(name);
  const type=card.relationship_type||'顧客';
  if(company){
    if(company.relationship_type!==type){
      const body={relationship_type:type};
      if(type==='顧客' && company.relationship_type!=='顧客')body.ai_review_status='未調査';
      if(type!=='顧客')body.ai_review_status='対象外';
      await fetch(`${SUPABASE_URL}/rest/v1/companies?id=eq.${company.id}`,{method:'PATCH',headers:{'Content-Type':'application/json',...apiHeaders},body:JSON.stringify(body)});
    }
    cache.set(key,company.id);return company.id;
  }
  const r=await fetch(`${SUPABASE_URL}/rest/v1/companies`,{method:'POST',headers:{'Content-Type':'application/json',...apiHeaders,'Prefer':'return=representation'},body:JSON.stringify({company_name:name,address:(card.address||'').trim(),phone:(card.phone||'').trim(),relationship_type:type,ai_review_status:type==='顧客'?'未調査':'対象外'})});
  const d=await r.json();if(!r.ok)throw new Error(`会社「${name}」の登録に失敗しました`);
  cache.set(key,d[0].id);return d[0].id;
}
async function registerOneCard(card,cache){
  const person=(card.person_name||'').trim();if(!person)throw new Error(`「${card.company_name||'会社名不明'}」の氏名が空欄です`);
  const companyId=await getOrCreateCompany(card,cache);
  const rr=await fetch(`${SUPABASE_URL}/rest/v1/contacts?company_id=eq.${companyId}&select=id,name`,{headers:apiHeaders});
  const contacts=await rr.json();if(contacts.some(c=>normalizeText(c.name)===normalizeText(person)))return{result:'duplicate'};
  const r=await fetch(`${SUPABASE_URL}/rest/v1/contacts`,{method:'POST',headers:{'Content-Type':'application/json',...apiHeaders},body:JSON.stringify({company_id:companyId,name:person,department:(card.department||'').trim(),position:(card.position||'').trim(),phone:(card.phone||'').trim(),email:(card.email||'').trim()})});
  if(!r.ok)throw new Error(`「${person}」の人物登録に失敗しました`);return{result:'registered'};
}
document.getElementById('saveAllCardsButton').addEventListener('click',async function(){
  const cards=currentCards.filter(c=>!c._removed);if(!cards.length){alert('登録する名刺がありません');return}
  if(cards.some(c=>!(c.company_name||'').trim()||!(c.person_name||'').trim())){alert('会社名または氏名が空欄の名刺があります。');return}
  this.disabled=true;const old=this.textContent;this.textContent=`${cards.length}枚を登録中…`;
  const cache=new Map(),results=[],errors=[];for(const c of cards){try{results.push(await registerOneCard(c,cache))}catch(e){errors.push(e.message)}}
  const n=results.filter(x=>x.result==='registered').length,d=results.filter(x=>x.result==='duplicate').length;
  alert(`${n}件を登録しました。${d?`\n${d}件は重複のため登録しませんでした。`:''}${errors.length?`\n\nエラー:\n${errors.join('\n')}`:''}`);
  this.disabled=false;this.textContent=old;
  if(!errors.length){currentCards=[];document.getElementById('batchCardList').innerHTML='';document.getElementById('cardResult').classList.add('hidden');document.getElementById('cardPreview').classList.add('hidden');document.getElementById('cardCamera').value=''}
});

async function loadCompanies(){
  const type=document.getElementById('relationshipFilter').value,status=document.getElementById('salesStatusFilter').value;
  let url=`${SUPABASE_URL}/rest/v1/companies?select=id,company_name,address,phone,website,sales_status,ai_review_status,relationship_type&order=company_name.asc`;
  if(type!=='すべて')url+=`&relationship_type=eq.${encodeURIComponent(type)}`;
  if(status!=='すべて'){url+=`&relationship_type=eq.${encodeURIComponent('顧客')}&sales_status=eq.${encodeURIComponent(status)}`}
  const r=await fetch(url,{headers:apiHeaders}),companies=await r.json();
  const list=document.getElementById('companyList');list.innerHTML='';list.classList.remove('hidden');document.getElementById('companyProfile').classList.add('hidden');
  if(!companies.length){list.innerHTML='<p>該当する会社はありません。</p>';return}
  companies.forEach(c=>{
    const row=document.createElement('div');row.className='row';const isCustomer=(c.relationship_type||'顧客')==='顧客';
    row.innerHTML=`<strong class="clickable">${escapeHtml(c.company_name)}</strong><br><span class="type-badge ${typeClass(c.relationship_type||'顧客')}">${escapeHtml(c.relationship_type||'顧客')}</span>${isCustomer?`<span class="status">${escapeHtml(c.ai_review_status||'未調査')}</span>`:''}<br>${escapeHtml(c.address||'')}<br>${escapeHtml(c.phone||'')}${isCustomer?`<label>営業状況</label><select class="sales-status">${['未訪問','訪問済み','継続フォロー','見積あり','受注'].map(s=>`<option ${c.sales_status===s?'selected':''}>${s}</option>`).join('')}</select>`:''}`;
    row.querySelector('strong').onclick=()=>showCompanyProfile(c.id);const ss=row.querySelector('.sales-status');if(ss)ss.onchange=e=>updateSalesStatus(c.id,e.target.value);list.appendChild(row);
  });
}
document.getElementById('companyListButton').onclick=loadCompanies;
document.getElementById('relationshipFilter').onchange=()=>{if(document.getElementById('relationshipFilter').value!=='顧客')document.getElementById('salesStatusFilter').value='すべて';loadCompanies()};
document.getElementById('salesStatusFilter').onchange=()=>{if(document.getElementById('salesStatusFilter').value!=='すべて')document.getElementById('relationshipFilter').value='顧客';loadCompanies()};
async function updateSalesStatus(id,status){const r=await fetch(`${SUPABASE_URL}/rest/v1/companies?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json',...apiHeaders},body:JSON.stringify({sales_status:status})});alert(r.ok?'営業状況を更新しました！':'営業状況の更新に失敗しました')}

async function showCompanyProfile(id){
  const [cr,rr]=await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/companies?id=eq.${id}&select=*`,{headers:apiHeaders}),
    fetch(`${SUPABASE_URL}/rest/v1/contacts?company_id=eq.${id}&select=id,name,department,position,phone,email&order=name.asc`,{headers:apiHeaders})
  ]);
  const cs=await cr.json(),contacts=await rr.json();if(!cs.length)return;const c=cs[0],isCustomer=(c.relationship_type||'顧客')==='顧客';
  const p=document.getElementById('companyProfile');p.dataset.companyId=id;
  p.innerHTML=`<h3>${escapeHtml(c.company_name)}</h3>
    <label>取引先区分</label><select id="profileRelationship">${typeOptions(c.relationship_type||'顧客')}</select>
    ${isCustomer?`<div class="muted">AI状態：${escapeHtml(c.ai_review_status||'未調査')}${c.ai_researched_at?' ／ '+formatDateJP(c.ai_researched_at.slice(0,10)):''}</div>`:''}
    <label>公式サイト</label><input id="profileWebsite" value="${escapeHtml(c.website||'')}">
    ${isCustomer?`
      <label>主力製品・事業</label><textarea id="profileMainProducts" rows="4">${escapeHtml(c.main_products||'')}</textarea>
      <label>今後の方針・注力分野</label><textarea id="profileFutureDirection" rows="4">${escapeHtml(c.future_direction||'')}</textarea>
      <label>品質・発注の特徴</label><textarea id="profileQualityTraits" rows="4">${escapeHtml(c.quality_purchasing_traits||'')}</textarea>
      <label>営業チャンス</label><textarea id="profileSalesOpportunities" rows="4">${escapeHtml(c.sales_opportunities||'')}</textarea>
      <label>社内営業メモ</label><textarea id="profileSalesNotes" rows="4">${escapeHtml(c.sales_notes||'')}</textarea>
    `:`
      <label>取引先メモ</label><textarea id="profileSalesNotes" rows="6">${escapeHtml(c.sales_notes||'')}</textarea>
      <p class="muted">材料メーカー・外注先・設備会社などは営業カルテではなく、取引先情報として管理します。</p>
    `}
    <button class="primary" id="saveCompanyProfileButton">保存する</button>
    <div class="section-gap"><h3>この会社の人物</h3><div id="companyContacts"></div></div>`;
  const cc=p.querySelector('#companyContacts');contacts.forEach(x=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<strong class="clickable">${escapeHtml(x.name)}</strong><br>${escapeHtml(x.department||'')} ${escapeHtml(x.position||'')}<br>${escapeHtml(x.phone||'')}<br>${escapeHtml(x.email||'')}`;row.querySelector('strong').onclick=()=>showContactDetail(x.id);cc.appendChild(row)});
  if(!contacts.length)cc.innerHTML='<p>登録されている人物はいません。</p>';
  p.querySelector('#saveCompanyProfileButton').onclick=saveCompanyProfile;
  document.getElementById('companyList').classList.add('hidden');p.classList.remove('hidden');p.scrollIntoView({behavior:'smooth',block:'start'});
}
async function saveCompanyProfile(){
  const p=document.getElementById('companyProfile'),id=p.dataset.companyId,type=document.getElementById('profileRelationship').value;
  const body={relationship_type:type,website:document.getElementById('profileWebsite').value.trim()||null,sales_notes:document.getElementById('profileSalesNotes').value.trim()||null};
  if(type==='顧客'){
    body.main_products=document.getElementById('profileMainProducts')?.value.trim()||null;
    body.future_direction=document.getElementById('profileFutureDirection')?.value.trim()||null;
    body.quality_purchasing_traits=document.getElementById('profileQualityTraits')?.value.trim()||null;
    body.sales_opportunities=document.getElementById('profileSalesOpportunities')?.value.trim()||null;
    const currentText=p.querySelector('.muted')?.textContent||'';if(currentText.includes('対象外'))body.ai_review_status='未調査';
  }else body.ai_review_status='対象外';
  const r=await fetch(`${SUPABASE_URL}/rest/v1/companies?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json',...apiHeaders},body:JSON.stringify(body)});
  alert(r.ok?'保存しました！':'保存に失敗しました');
  if(r.ok)showCompanyProfile(id);
}

document.getElementById('contactListButton').addEventListener('click',async()=>{
  const r=await fetch(`${SUPABASE_URL}/rest/v1/contacts?select=id,name,department,position,phone,email,company_id&order=name.asc`,{headers:apiHeaders});
  const contacts=await r.json(),list=document.getElementById('contactList');list.innerHTML='';list.classList.remove('hidden');document.getElementById('contactProfile').classList.add('hidden');
  contacts.forEach(c=>{const d=document.createElement('div');d.className='row';d.innerHTML=`<strong class="clickable">${escapeHtml(c.name)}</strong><br>${escapeHtml(c.department||'')} ${escapeHtml(c.position||'')}<br>${escapeHtml(c.phone||'')}<br>${escapeHtml(c.email||'')}`;d.querySelector('strong').onclick=()=>showContactDetail(c.id);list.appendChild(d)})
});
async function showContactDetail(id){
  const [cr,ar]=await Promise.all([fetch(`${SUPABASE_URL}/rest/v1/contacts?id=eq.${id}&select=*`,{headers:apiHeaders}),fetch(`${SUPABASE_URL}/rest/v1/activities?contact_id=eq.${id}&select=id,activity_date,activity_type,notes,next_followup_date&order=activity_date.desc`,{headers:apiHeaders})]);
  const cs=await cr.json(),acts=await ar.json();if(!cs.length)return;const c=cs[0],p=document.getElementById('contactProfile');p.dataset.contactId=id;
  p.innerHTML=`<h3>${escapeHtml(c.name||'')}</h3><div>${escapeHtml(c.department||'')} ${escapeHtml(c.position||'')}</div><div>${escapeHtml(c.phone||'')}</div><div>${escapeHtml(c.email||'')}</div>
    <label>趣味・好きな話題</label><textarea id="contactHobbies" rows="3">${escapeHtml(c.hobbies_topics||'')}</textarea>
    <label>家族に関する会話メモ</label><textarea id="contactFamilyNotes" rows="3">${escapeHtml(c.family_notes||'')}</textarea>
    <label>好み・関心事項</label><textarea id="contactPreferences" rows="3">${escapeHtml(c.preferences||'')}</textarea>
    <label>人物・商談メモ</label><textarea id="contactPersonNotes" rows="4">${escapeHtml(c.person_notes||'')}</textarea>
    <button class="primary" id="saveContactProfileButton">人物メモを保存</button>
    <div class="section-gap"><h3>営業活動履歴</h3><div id="personActivityHistory"></div><button class="secondary" id="addActivityForPerson">この人物の営業活動を登録</button></div>`;
  const h=p.querySelector('#personActivityHistory');if(!acts.length)h.innerHTML='<p>まだ登録されていません。</p>';acts.forEach(a=>{const d=document.createElement('div');d.className='row';d.innerHTML=`<strong>${escapeHtml(formatDateJP(a.activity_date))}　${escapeHtml(a.activity_type||'')}</strong><br>${escapeHtml(a.notes||'')}<br><span class="muted">次回：${escapeHtml(a.next_followup_date?formatDateJP(a.next_followup_date):'なし')}</span>`;h.appendChild(d)});
  p.querySelector('#saveContactProfileButton').onclick=saveContactProfile;p.querySelector('#addActivityForPerson').onclick=()=>openActivityForm(id,c.name);
  document.getElementById('contactList').classList.add('hidden');p.classList.remove('hidden');p.scrollIntoView({behavior:'smooth',block:'start'});
}
async function saveContactProfile(){
  const p=document.getElementById('contactProfile'),id=p.dataset.contactId,body={hobbies_topics:document.getElementById('contactHobbies').value.trim()||null,family_notes:document.getElementById('contactFamilyNotes').value.trim()||null,preferences:document.getElementById('contactPreferences').value.trim()||null,person_notes:document.getElementById('contactPersonNotes').value.trim()||null,last_updated_at:new Date().toISOString()};
  const r=await fetch(`${SUPABASE_URL}/rest/v1/contacts?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json',...apiHeaders},body:JSON.stringify(body)});alert(r.ok?'人物メモを保存しました！':'人物メモの保存に失敗しました');
}
function openActivityForm(id,name){const f=document.getElementById('activityForm');f.dataset.contactId=id;document.getElementById('activityTarget').textContent=`対象：${name||''}`;document.getElementById('activityDate').value=new Date().toISOString().split('T')[0];f.classList.remove('hidden');f.scrollIntoView({behavior:'smooth',block:'start'})}
document.getElementById('saveActivityButton').addEventListener('click',async()=>{
  const f=document.getElementById('activityForm'),id=f.dataset.contactId,date=document.getElementById('activityDate').value;if(!id||!date){alert('人物と活動日を確認してください');return}
  const r=await fetch(`${SUPABASE_URL}/rest/v1/activities`,{method:'POST',headers:{'Content-Type':'application/json',...apiHeaders},body:JSON.stringify({contact_id:Number(id),activity_date:date,activity_type:document.getElementById('activityType').value,notes:document.getElementById('activityNotes').value.trim(),next_followup_date:document.getElementById('nextFollowupDate').value||null})});
  alert(r.ok?'営業活動を登録しました！':'営業活動の登録に失敗しました');if(r.ok)f.classList.add('hidden');
});
document.getElementById('activityListButton').addEventListener('click',async()=>{
  const r=await fetch(`${SUPABASE_URL}/rest/v1/activities?select=id,activity_date,activity_type,notes,next_followup_date,contact_id&order=activity_date.desc`,{headers:apiHeaders}),acts=await r.json(),list=document.getElementById('activityList');list.innerHTML='';list.classList.remove('hidden');
  if(!acts.length){list.innerHTML='<p>営業活動はまだ登録されていません。</p>';return}
  acts.forEach(a=>{const d=document.createElement('div');d.className='row';d.innerHTML=`<strong>${escapeHtml(formatDateJP(a.activity_date))}　${escapeHtml(a.activity_type||'')}</strong><br>${escapeHtml(a.notes||'')}<br><span class="muted">次回：${escapeHtml(a.next_followup_date?formatDateJP(a.next_followup_date):'なし')}</span>`;list.appendChild(d)})
});
</script>
</body>
</html>
