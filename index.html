<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>営業管理</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }
    header {
      background: white;
      padding: 18px 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    main { padding: 16px; max-width: 820px; margin: 0 auto; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h2, h3 { margin-top: 0; }
    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: 700;
    }
    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }
    textarea { resize: vertical; }
    button {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    .primary { background: #111; color: white; }
    .secondary { background: #e9e9e9; color: #111; }
    .mini {
      width: auto;
      display: inline-block;
      padding: 8px 12px;
      font-size: 14px;
      margin-top: 8px;
    }
    .row {
      padding: 12px 0;
      border-bottom: 1px solid #e5e5e5;
    }
    .clickable { cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .muted { color: #666; font-size: 14px; }
    .status {
      display: inline-block;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #f0f0f0;
      margin-top: 6px;
    }
    .hidden { display: none; }
    .section-gap { margin-top: 18px; padding-top: 16px; border-top: 1px solid #ddd; }
    a { color: inherit; }
  </style>
</head>
<body>
<header>営業管理</header>
<main>

  <div class="card">
    <h2>名刺登録</h2>
    <p>名刺を撮影して、会社・人物情報を登録します。新しい会社は登録後にAIが自動調査します。</p>
    <input type="file" id="cardCamera" accept="image/*" capture="environment" class="hidden">
    <button class="primary" id="cameraButton">名刺を撮影</button>
    <img id="cardPreview" class="hidden" style="width:100%; margin-top:15px; border-radius:12px;">
    <button class="primary" id="readCardButton">名刺を読み取る</button>

    <div id="cardResult" class="hidden section-gap">
      <h3>読み取り結果</h3>
      <label>会社名</label><input type="text" id="companyName">
      <label>氏名</label><input type="text" id="personName">
      <label>部署</label><input type="text" id="department">
      <label>役職</label><input type="text" id="position">
      <label>電話番号</label><input type="text" id="phone">
      <label>メールアドレス</label><input type="text" id="email">
      <label>住所</label><input type="text" id="address">
      <button class="primary" id="saveCardButton">登録する</button>
    </div>
  </div>

  <div class="card">
    <h2>会社</h2>
    <p>会社カルテと営業状況を確認します。</p>
    <button class="secondary" id="companyListButton">会社一覧</button>
    <label>営業状況で絞り込み</label>
    <select id="salesStatusFilter">
      <option value="すべて">すべて</option>
      <option value="未訪問">未訪問</option>
      <option value="訪問済み">訪問済み</option>
      <option value="継続フォロー">継続フォロー</option>
      <option value="見積あり">見積あり</option>
      <option value="受注">受注</option>
    </select>
    <div id="companyList" class="hidden section-gap"></div>
    <div id="companyProfile" class="hidden section-gap"></div>
  </div>

  <div class="card">
    <h2>人物</h2>
    <p>担当者の情報、趣味・話題、家族に関する会話メモなどを管理します。</p>
    <button class="secondary" id="contactListButton">人物一覧</button>
    <div id="contactList" class="hidden section-gap"></div>
    <div id="contactProfile" class="hidden section-gap"></div>
  </div>

  <div class="card">
    <h2>営業活動</h2>
    <p>訪問・引き合い・見積などの履歴を確認します。</p>
    <button class="secondary" id="activityListButton">営業活動を見る</button>
    <div id="activityList" class="hidden section-gap"></div>
  </div>

  <div id="activityForm" class="card hidden">
    <h3>営業活動を登録</h3>
    <div id="activityTarget" class="muted"></div>
    <label>活動日</label>
    <input type="date" id="activityDate">
    <label>活動種類</label>
    <select id="activityType">
      <option value="引き合い">引き合い</option>
      <option value="訪問">訪問</option>
      <option value="電話">電話</option>
      <option value="メール">メール</option>
      <option value="見積提出">見積提出</option>
      <option value="打ち合わせ">打ち合わせ</option>
      <option value="受注">受注</option>
      <option value="失注">失注</option>
      <option value="その他">その他</option>
    </select>
    <label>内容</label>
    <textarea id="activityNotes" rows="4"></textarea>
    <label>次回フォロー日</label>
    <input type="date" id="nextFollowupDate">
    <button class="primary" id="saveActivityButton">登録する</button>
  </div>

</main>

<script>
const SUPABASE_URL = "https://emauqxftmauvsffdjvyh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4";

const apiHeaders = {
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`
};

const normalizeText = (s) => (s || '')
  .normalize('NFKC')
  .replace(/\s+/g, '')
  .replace(/[‐‑–—―ー－]/g, '-')
  .toLowerCase();

const escapeHtml = (s) => String(s ?? '')
  .replaceAll('&', '&amp;')
  .replaceAll('<', '&lt;')
  .replaceAll('>', '&gt;')
  .replaceAll('"', '&quot;')
  .replaceAll("'", '&#039;');

function formatDateJP(value) {
  if (!value) return '';
  const d = new Date(value + (value.length === 10 ? 'T00:00:00' : ''));
  if (Number.isNaN(d.getTime())) return value;
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

document.getElementById('cameraButton').addEventListener('click', () => {
  document.getElementById('cardCamera').click();
});

document.getElementById('cardCamera').addEventListener('change', function () {
  const file = this.files[0];
  if (!file) return;
  const preview = document.getElementById('cardPreview');
  preview.src = URL.createObjectURL(file);
  preview.classList.remove('hidden');
});

document.getElementById('readCardButton').addEventListener('click', async function () {
  const file = document.getElementById('cardCamera').files[0];
  if (!file) {
    alert('先に名刺を撮影してください');
    return;
  }

  const reader = new FileReader();
  reader.onload = async function () {
    try {
      const response = await fetch(`${SUPABASE_URL}/functions/v1/read-business-card`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...apiHeaders
        },
        body: JSON.stringify({ image: reader.result })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data?.error || '名刺読み取りに失敗しました');

      const text = data.output?.[0]?.content?.find?.(x => x.type === 'output_text')?.text
        || data.output?.[0]?.content?.[0]?.text
        || '';

      const getValue = (label) => {
        const match = text.match(new RegExp(label + '\\s*[：:]\\s*([^\\n]+)'));
        return match ? match[1].trim().replace(/^[-・]\s*/, '') : '';
      };

      document.getElementById('companyName').value = getValue('会社名');
      document.getElementById('personName').value = getValue('氏名');
      document.getElementById('department').value = getValue('部署').replace('記載なし','');
      document.getElementById('position').value = getValue('役職').replace('記載なし','');
      document.getElementById('phone').value = getValue('電話番号');
      document.getElementById('email').value = getValue('メールアドレス');
      document.getElementById('address').value = getValue('住所');

      document.getElementById('cardResult').classList.remove('hidden');
    } catch (e) {
      alert('読み取りエラー：' + e.message);
    }
  };
  reader.readAsDataURL(file);
});

document.getElementById('saveCardButton').addEventListener('click', async function () {
  const companyName = document.getElementById('companyName').value.trim();
  const personName = document.getElementById('personName').value.trim();
  const department = document.getElementById('department').value.trim();
  const position = document.getElementById('position').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const address = document.getElementById('address').value.trim();

  if (!companyName || !personName) {
    alert('会社名と氏名は入力してください');
    return;
  }

  try {
    const companiesResp = await fetch(
      `${SUPABASE_URL}/rest/v1/companies?select=id,company_name,address`,
      { headers: apiHeaders }
    );
    const companies = await companiesResp.json();
    const existingCompany = companies.find(c =>
      normalizeText(c.company_name) === normalizeText(companyName)
    );

    let companyId;

    if (existingCompany) {
      companyId = existingCompany.id;
    } else {
      const companyResp = await fetch(`${SUPABASE_URL}/rest/v1/companies`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...apiHeaders,
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({
          company_name: companyName,
          address,
          phone,
          ai_review_status: '未調査'
        })
      });
      const companyData = await companyResp.json();
      if (!companyResp.ok) throw new Error('会社の登録に失敗しました');
      companyId = companyData[0].id;
    }

    const contactsResp = await fetch(
      `${SUPABASE_URL}/rest/v1/contacts?company_id=eq.${companyId}&select=id,name`,
      { headers: apiHeaders }
    );
    const contacts = await contactsResp.json();

    const duplicate = contacts.find(c =>
      normalizeText(c.name) === normalizeText(personName)
    );
    if (duplicate) {
      alert('この人物はすでに登録されています');
      return;
    }

    const contactResp = await fetch(`${SUPABASE_URL}/rest/v1/contacts`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...apiHeaders
      },
      body: JSON.stringify({
        company_id: companyId,
        name: personName,
        department,
        position,
        phone,
        email
      })
    });

    if (!contactResp.ok) throw new Error('人物の登録に失敗しました');

    alert(existingCompany
      ? '人物を登録しました！'
      : '登録できました！会社情報はAIが自動調査します。');

    document.getElementById('cardResult').classList.add('hidden');
    document.getElementById('cardPreview').classList.add('hidden');
    document.getElementById('cardCamera').value = '';
  } catch (e) {
    alert(e.message);
  }
});

async function loadCompanies(status = 'すべて') {
  let url = `${SUPABASE_URL}/rest/v1/companies?select=id,company_name,address,phone,website,sales_status,ai_review_status&order=company_name.asc`;
  if (status !== 'すべて') {
    url += `&sales_status=eq.${encodeURIComponent(status)}`;
  }

  const response = await fetch(url, { headers: apiHeaders });
  const companies = await response.json();

  const list = document.getElementById('companyList');
  list.innerHTML = '';
  list.classList.remove('hidden');
  document.getElementById('companyProfile').classList.add('hidden');

  if (!companies.length) {
    list.innerHTML = '<p>該当する会社はありません。</p>';
    return;
  }

  companies.forEach(company => {
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `
      <strong class="clickable">${escapeHtml(company.company_name)}</strong><br>
      <span>${escapeHtml(company.address || '')}</span><br>
      <span>${escapeHtml(company.phone || '')}</span><br>
      <span class="status">${escapeHtml(company.ai_review_status || '未調査')}</span>
      <label>営業状況</label>
      <select class="sales-status">
        <option value="未訪問" ${company.sales_status === '未訪問' ? 'selected' : ''}>未訪問</option>
        <option value="訪問済み" ${company.sales_status === '訪問済み' ? 'selected' : ''}>訪問済み</option>
        <option value="継続フォロー" ${company.sales_status === '継続フォロー' ? 'selected' : ''}>継続フォロー</option>
        <option value="見積あり" ${company.sales_status === '見積あり' ? 'selected' : ''}>見積あり</option>
        <option value="受注" ${company.sales_status === '受注' ? 'selected' : ''}>受注</option>
      </select>
    `;
    div.querySelector('strong').addEventListener('click', () => showCompanyProfile(company.id));
    div.querySelector('.sales-status').addEventListener('change', (e) => updateSalesStatus(company.id, e.target.value));
    list.appendChild(div);
  });
}

document.getElementById('companyListButton').addEventListener('click', () => {
  loadCompanies(document.getElementById('salesStatusFilter').value);
});

document.getElementById('salesStatusFilter').addEventListener('change', function () {
  loadCompanies(this.value);
});

async function updateSalesStatus(companyId, status) {
  const response = await fetch(`${SUPABASE_URL}/rest/v1/companies?id=eq.${companyId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', ...apiHeaders },
    body: JSON.stringify({ sales_status: status })
  });
  if (!response.ok) {
    alert('営業状況の更新に失敗しました');
    return;
  }
  alert('営業状況を更新しました！');
}

async function showCompanyProfile(companyId) {
  const [companyResp, contactsResp] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/companies?id=eq.${companyId}&select=*`, { headers: apiHeaders }),
    fetch(`${SUPABASE_URL}/rest/v1/contacts?company_id=eq.${companyId}&select=id,name,department,position,phone,email&order=name.asc`, { headers: apiHeaders })
  ]);

  const companies = await companyResp.json();
  const contacts = await contactsResp.json();
  if (!companies.length) return;

  const c = companies[0];
  const profile = document.getElementById('companyProfile');
  profile.dataset.companyId = companyId;
  profile.innerHTML = `
    <h3>${escapeHtml(c.company_name)}</h3>
    <div class="muted">AI状態：${escapeHtml(c.ai_review_status || '未調査')}${c.ai_researched_at ? ' ／ ' + formatDateJP(c.ai_researched_at.slice(0,10)) : ''}</div>

    <label>公式サイト</label>
    <input id="profileWebsite" value="${escapeHtml(c.website || '')}">

    <label>主力製品・事業</label>
    <textarea id="profileMainProducts" rows="4">${escapeHtml(c.main_products || '')}</textarea>

    <label>今後の方針・注力分野</label>
    <textarea id="profileFutureDirection" rows="4">${escapeHtml(c.future_direction || '')}</textarea>

    <label>品質・発注の特徴</label>
    <textarea id="profileQualityTraits" rows="4">${escapeHtml(c.quality_purchasing_traits || '')}</textarea>

    <label>営業チャンス</label>
    <textarea id="profileSalesOpportunities" rows="4">${escapeHtml(c.sales_opportunities || '')}</textarea>

    <label>社内営業メモ</label>
    <textarea id="profileSalesNotes" rows="4">${escapeHtml(c.sales_notes || '')}</textarea>

    <button class="primary" id="saveCompanyProfileButton">会社カルテを保存</button>

    <div class="section-gap">
      <h3>この会社の人物</h3>
      <div id="companyContacts"></div>
    </div>
  `;

  const companyContacts = profile.querySelector('#companyContacts');
  if (!contacts.length) {
    companyContacts.innerHTML = '<p>登録されている人物はいません。</p>';
  } else {
    contacts.forEach(contact => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <strong class="clickable">${escapeHtml(contact.name)}</strong><br>
        ${escapeHtml(contact.department || '')} ${escapeHtml(contact.position || '')}<br>
        ${escapeHtml(contact.phone || '')}<br>
        ${escapeHtml(contact.email || '')}
      `;
      row.querySelector('strong').addEventListener('click', () => showContactDetail(contact.id));
      companyContacts.appendChild(row);
    });
  }

  profile.querySelector('#saveCompanyProfileButton').addEventListener('click', saveCompanyProfile);
  document.getElementById('companyList').classList.add('hidden');
  profile.classList.remove('hidden');
  profile.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function saveCompanyProfile() {
  const profile = document.getElementById('companyProfile');
  const companyId = profile.dataset.companyId;

  const body = {
    website: document.getElementById('profileWebsite').value.trim() || null,
    main_products: document.getElementById('profileMainProducts').value.trim() || null,
    future_direction: document.getElementById('profileFutureDirection').value.trim() || null,
    quality_purchasing_traits: document.getElementById('profileQualityTraits').value.trim() || null,
    sales_opportunities: document.getElementById('profileSalesOpportunities').value.trim() || null,
    sales_notes: document.getElementById('profileSalesNotes').value.trim() || null
  };

  const response = await fetch(`${SUPABASE_URL}/rest/v1/companies?id=eq.${companyId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', ...apiHeaders },
    body: JSON.stringify(body)
  });

  if (!response.ok) {
    alert('会社カルテの保存に失敗しました');
    return;
  }
  alert('会社カルテを保存しました！');
}

document.getElementById('contactListButton').addEventListener('click', async function () {
  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/contacts?select=id,name,department,position,phone,email,company_id&order=name.asc`,
    { headers: apiHeaders }
  );

  list.innerHTML = '';
  list.classList.remove('hidden');
  document.getElementById('contactProfile').classList.add('hidden');

    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `
      <strong class="clickable">${escapeHtml(contact.name)}</strong><br>
      ${escapeHtml(contact.department || '')} ${escapeHtml(contact.position || '')}<br>
      ${escapeHtml(contact.phone || '')}<br>
      ${escapeHtml(contact.email || '')}
    `;
    div.querySelector('strong').addEventListener('click', () => showContactDetail(contact.id));
    list.appendChild(div);
  });

async function showContactDetail(contactId) {
  const [contactResp, activityResp] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/contacts?id=eq.${contactId}&select=*`, { headers: apiHeaders }),
    fetch(`${SUPABASE_URL}/rest/v1/activities?contact_id=eq.${contactId}&select=id,activity_date,activity_type,notes,next_followup_date&order=activity_date.desc`, { headers: apiHeaders })
  ]);

  const contacts = await contactResp.json();
  const activities = await activityResp.json();
  if (!contacts.length) {
    alert('人物情報が見つかりません');
    return;
  }

  const c = contacts[0];
  const profile = document.getElementById('contactProfile');
  profile.dataset.contactId = contactId;
  profile.dataset.contactName = c.name || '';

  profile.innerHTML = `
    <h3>${escapeHtml(c.name || '')}</h3>
    <div>${escapeHtml(c.department || '')} ${escapeHtml(c.position || '')}</div>
    <div>${escapeHtml(c.phone || '')}</div>
    <div>${escapeHtml(c.email || '')}</div>

    <label>趣味・好きな話題</label>
    <textarea id="contactHobbies" rows="3">${escapeHtml(c.hobbies_topics || '')}</textarea>

    <label>家族に関する会話メモ</label>
    <textarea id="contactFamilyNotes" rows="3">${escapeHtml(c.family_notes || '')}</textarea>

    <label>好み・関心事項</label>
    <textarea id="contactPreferences" rows="3">${escapeHtml(c.preferences || '')}</textarea>

    <label>人物・商談メモ</label>
    <textarea id="contactPersonNotes" rows="4">${escapeHtml(c.person_notes || '')}</textarea>

    <button class="primary" id="saveContactProfileButton">人物メモを保存</button>

    <div class="section-gap">
      <h3>営業活動履歴</h3>
      <div id="personActivityHistory"></div>
      <button class="secondary" id="addActivityForPerson">この人物の営業活動を登録</button>
    </div>
  `;

  const history = profile.querySelector('#personActivityHistory');
  if (!activities.length) {
    history.innerHTML = '<p>まだ登録されていません。</p>';
  } else {
    activities.forEach(a => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <strong>${escapeHtml(formatDateJP(a.activity_date))}　${escapeHtml(a.activity_type || '')}</strong><br>
        ${escapeHtml(a.notes || '')}<br>
        <span class="muted">次回：${escapeHtml(a.next_followup_date ? formatDateJP(a.next_followup_date) : 'なし')}</span>
      `;
      history.appendChild(row);
    });
  }

  profile.querySelector('#saveContactProfileButton').addEventListener('click', saveContactProfile);
  profile.querySelector('#addActivityForPerson').addEventListener('click', () => openActivityForm(contactId, c.name));

  document.getElementById('contactList').classList.add('hidden');
  profile.classList.remove('hidden');
  profile.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function saveContactProfile() {
  const profile = document.getElementById('contactProfile');
  const contactId = profile.dataset.contactId;

  const body = {
    hobbies_topics: document.getElementById('contactHobbies').value.trim() || null,
    family_notes: document.getElementById('contactFamilyNotes').value.trim() || null,
    preferences: document.getElementById('contactPreferences').value.trim() || null,
    person_notes: document.getElementById('contactPersonNotes').value.trim() || null,
    last_updated_at: new Date().toISOString()
  };

  const response = await fetch(`${SUPABASE_URL}/rest/v1/contacts?id=eq.${contactId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', ...apiHeaders },
    body: JSON.stringify(body)
  });

  if (!response.ok) {
    alert('人物メモの保存に失敗しました');
    return;
  }
  alert('人物メモを保存しました！');
}

function openActivityForm(contactId, contactName) {
  const form = document.getElementById('activityForm');
  form.dataset.contactId = contactId;
  document.getElementById('activityTarget').textContent = `対象：${contactName || ''}`;
  document.getElementById('activityDate').value = new Date().toISOString().split('T')[0];
  form.classList.remove('hidden');
  form.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('saveActivityButton').addEventListener('click', async function () {
  const contactId = document.getElementById('activityForm').dataset.contactId;
  const activityDate = document.getElementById('activityDate').value;
  const activityType = document.getElementById('activityType').value;
  const notes = document.getElementById('activityNotes').value.trim();
  const nextFollowupDate = document.getElementById('nextFollowupDate').value;

  if (!contactId) {
    alert('人物が選択されていません');
    return;
  }
  if (!activityDate) {
    alert('活動日を選んでください');
    return;
  }

  const response = await fetch(`${SUPABASE_URL}/rest/v1/activities`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...apiHeaders },
    body: JSON.stringify({
      contact_id: Number(contactId),
      activity_date: activityDate,
      activity_type: activityType,
      notes,
      next_followup_date: nextFollowupDate || null
    })
  });

  if (!response.ok) {
    const errorText = await response.text();
    alert('登録エラー：' + response.status + '\n' + errorText);
    return;
  }

  alert('営業活動を登録しました！');
  document.getElementById('activityNotes').value = '';
  document.getElementById('nextFollowupDate').value = '';
  document.getElementById('activityForm').classList.add('hidden');
});

document.getElementById('activityListButton').addEventListener('click', async function () {
  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/activities?select=id,activity_date,activity_type,notes,next_followup_date,contact_id&order=activity_date.desc`,
    { headers: apiHeaders }
  );
  const activities = await response.json();
  const list = document.getElementById('activityList');
  list.innerHTML = '';
  list.classList.remove('hidden');

  if (!activities.length) {
    list.innerHTML = '<p>営業活動はまだ登録されていません。</p>';
    return;
  }

  activities.forEach(activity => {
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `
      <strong>${escapeHtml(formatDateJP(activity.activity_date))}　${escapeHtml(activity.activity_type || '')}</strong><br>
      ${escapeHtml(activity.notes || '')}<br>
      <span class="muted">次回：${escapeHtml(activity.next_followup_date ? formatDateJP(activity.next_followup_date) : 'なし')}</span>
    `;
    list.appendChild(div);
  });
});
</script>
</body>
</html>
