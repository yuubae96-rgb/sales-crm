<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>営業管理</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: white;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    main {
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #111;
      color: white;
    }

    .secondary {
      background: #e9e9e9;
      color: #111;
    }

    h2 {
      margin-top: 0;
    }
    #cardResult label {
  display: block;
  margin-top: 12px;
  margin-bottom: 4px;
  font-weight: bold;
}

#cardResult input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

#cardResult h3 {
  margin-top: 0;
}

#saveCardButton {
  margin-top: 20px;
}
  </style>
</head>

<body>

<header>
  営業管理
</header>

<main>

  <div class="card">
    <h2>名刺登録</h2>
    <p>名刺を撮影して、会社・人物情報を登録します。</p>
    <input type="file" id="cardCamera" accept="image/*" capture="environment" style="display:none;">
<button class="primary" onclick="document.getElementById('cardCamera').click()">名刺を撮影</button>
<img id="cardPreview" style="display:none; width:100%; margin-top:15px; border-radius:12px;">
 <button class="primary" id="readCardButton">名刺を読み取る</button>
    <div id="cardResult" style="display:none; margin-top:20px;">
  <h3>読み取り結果</h3>

  <label>会社名</label>
  <input type="text" id="companyName">

  <label>氏名</label>
  <input type="text" id="personName">

  <label>部署</label>
  <input type="text" id="department">

  <label>役職</label>
  <input type="text" id="position">

  <label>電話番号</label>
  <input type="text" id="phone">

  <label>メールアドレス</label>
  <input type="text" id="email">

  <label>住所</label>
  <input type="text" id="address">

  <button class="primary" id="saveCardButton">登録する</button>
</div>
  </div>

  <div class="card">
    <h2>会社</h2>
    <p>登録されている会社を確認します。</p>
    <button class="secondary" id="companyListButton">会社一覧</button>
    <div id="companyList" style="display:none; margin-top:20px;"></div>
  </div>

  <div class="card">
    <h2>人物</h2>
    <p>名刺交換した担当者を確認します。</p>
    <button class="secondary">人物一覧</button>
  </div>

  <div class="card">
    <h2>営業活動</h2>
    <p>訪問履歴やローラー営業の進捗を管理します。</p>
    <button class="secondary">営業活動を見る</button>
  </div>

</main>
<script>

 document.getElementById('readCardButton').addEventListener('click', async function () {

  document.getElementById('saveCardButton').addEventListener('click', async function () {
  const companyName = document.getElementById('companyName').value.trim();
  const personName = document.getElementById('personName').value.trim();
  const department = document.getElementById('department').value.trim();
  const position = document.getElementById('position').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const address = document.getElementById('address').value.trim();

  if (!companyName || !personName) {
    alert('会社名と氏名は入力してください');
    return;
  }
const existingCompanyResponse = await fetch(
  `${SUPABASE_URL}/rest/v1/companies?company_name=eq.${encodeURIComponent(companyName)}&select=id`,
  {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`
    }
  }
);

const existingCompanies = await existingCompanyResponse.json();

let companyId = null;

if (existingCompanies.length > 0) {
  companyId = existingCompanies[0].id;
}
  const companyResponse = await fetch(
  `${SUPABASE_URL}/rest/v1/companies`,
  {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Prefer': 'return=representation'
    },
    body: JSON.stringify({
      company_name: companyName,
      address: address,
      phone: phone
    })
  }
);

const companyData = await companyResponse.json();

if (!companyResponse.ok) {
  alert('会社の登録に失敗しました');
  console.log(companyData);
  return;
}

companyId = companyData[0].id;
const existingContactResponse = await fetch(
  `${SUPABASE_URL}/rest/v1/contacts?company_id=eq.${companyId}&name=eq.${encodeURIComponent(personName)}&select=id`,
  {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`
    }
  }
);

const existingContacts = await existingContactResponse.json();

if (existingContacts.length > 0) {
  alert('この人物はすでに登録されています');
  return;
}
const contactResponse = await fetch(
  `${SUPABASE_URL}/rest/v1/contacts`,
  {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`
    },
    body: JSON.stringify({
      company_id: companyId,
      name: personName,
      department: department,
      position: position,
      phone: phone,
      email: email
    })
  }
);

if (!contactResponse.ok) {
  alert('人物の登録に失敗しました');
  return;
}

alert('登録できました！');
});

});
  document.getElementById('companyListButton').addEventListener('click', async function () {
  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/companies?select=id,company_name,address,phone&order=company_name.asc`,
    {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    }
  );

  const companies = await response.json();

  const list = document.getElementById('companyList');
  list.innerHTML = '';
  list.style.display = 'block';

  companies.forEach(company => {
    const div = document.createElement('div');
    div.style.padding = '12px';
    div.style.borderBottom = '1px solid #ddd';
   div.innerHTML = `
  <strong style="cursor:pointer;" onclick="showCompanyContacts(${company.id}, '${company.company_name.replace(/'/g, "\\'")}')">
    ${company.company_name}
  </strong><br>
  <span>${company.address || ''}</span><br>
  <span>${company.phone || ''}</span>
`;
    list.appendChild(div);
  });
});
async function showCompanyContacts(companyId, companyName) {
  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/contacts?company_id=eq.${companyId}&select=name,department,position,phone,email`,
    {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    }
  );

  const contacts = await response.json();

  const list = document.getElementById('companyList');

  let html = `<h3>${companyName}</h3>`;

  if (contacts.length === 0) {
    html += `<p>登録されている人物はいません。</p>`;
  } else {
    contacts.forEach(contact => {
      html += `
        <div style="padding:12px; border-bottom:1px solid #ddd;">
          <strong>${contact.name}</strong><br>
          <span>${contact.department || ''} ${contact.position || ''}</span><br>
          <span>${contact.phone || ''}</span><br>
          <span>${contact.email || ''}</span>
        </div>
      `;
    });
  }

  list.innerHTML = html;
}
</script>

</body>
</html>
