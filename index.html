<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>営業管理</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f5;color:#222}header{background:#fff;padding:18px 20px;font-size:24px;font-weight:700;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}main{padding:16px;max-width:850px;margin:auto}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0001}h2,h3,h4{margin-top:0}label{display:block;margin-top:12px;margin-bottom:5px;font-weight:700}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#e9e9e9;color:#111}.row{padding:13px 0;border-bottom:1px solid #e5e5e5}.clickable{cursor:pointer;text-decoration:underline;text-underline-offset:3px}.muted{color:#666;font-size:14px}.company-summary{font-size:14px;color:#444;margin:4px 0 2px;line-height:1.45}.hidden{display:none}.section-gap{margin-top:18px;padding-top:16px;border-top:1px solid #ddd}.badge{display:inline-block;font-size:13px;font-weight:800;padding:5px 9px;border-radius:999px;margin:5px 6px 4px 0}.顧客{background:#ff4fa3;color:#fff}.材料メーカー{background:#a9ef61}.外注先{background:#66d9ff}.設備会社{background:#ffe45e}.その他{background:#ddd}.status{display:inline-block;font-size:12px;padding:4px 8px;border-radius:999px;background:#eee}.batch-card,.article{border:1px solid #ddd;border-radius:14px;padding:14px;margin-top:14px;background:#fafafa}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.filters{grid-template-columns:1fr}}.article a,.youtube-link{font-weight:700}.article .meta{font-size:13px;color:#666}.choice-group{display:flex;flex-wrap:wrap;gap:6px 16px;margin:5px 0 10px}.choice{display:inline-flex;align-items:center;gap:5px;margin:0;padding:2px 0;font-size:15px;font-weight:400}.choice input{width:16px;height:16px;margin:0}.tendency-box{border:1px solid #e6e6e6;border-radius:14px;padding:14px;margin-top:16px;background:#fffdfd}.glossary{margin-top:16px;padding:15px;border-radius:14px;background:#f4f8ff;border:1px solid #dbe8ff}.glossary h3{margin-bottom:5px}.glossary-intro{font-size:14px;color:#555;margin:0 0 10px}.term{padding:10px 0;border-bottom:1px solid #dbe3ef}.term:last-child{border-bottom:0}.term b{display:block;margin-bottom:3px}.term span{font-size:14px;line-height:1.55;color:#333}
</style></head><body><header>営業管理</header><main>
<div class="card"><h2>名刺一括登録</h2><p>複数枚を1枚の写真で読み取り、名刺ごとに区分を選んでまとめて登録できます。</p><input type="file" id="cardCamera" accept="image/*" capture="environment" class="hidden"><button class="primary" id="cameraButton">名刺を撮影</button><img id="cardPreview" class="hidden" style="width:100%;margin-top:15px;border-radius:12px"><button class="primary" id="readCardButton">名刺を読み取る</button><div id="cardResult" class="hidden section-gap"><h3 id="cardResultTitle">読み取り結果</h3><div id="batchCardList"></div><button class="primary" id="saveAllCardsButton">まとめて登録する</button></div></div>
<div class="card"><h2>会社・取引先</h2><button class="secondary" id="companyListButton">会社一覧</button><div class="filters"><div><label>取引先区分</label><select id="relationshipFilter"><option>すべて</option><option>顧客</option><option>材料メーカー</option><option>外注先</option><option>設備会社</option><option>その他</option></select></div><div><label>営業状況（顧客のみ）</label><select id="salesStatusFilter"><option>すべて</option><option>未訪問</option><option>訪問済み</option><option>継続フォロー</option><option>見積あり</option><option>受注</option></select></div></div><div id="companyList" class="hidden section-gap"></div><div id="companyProfile" class="hidden section-gap"></div></div>
<div class="card"><h2>人物</h2><button class="secondary" id="contactListButton">人物一覧</button><div id="contactList" class="hidden section-gap"></div></div><div class="card"><h2>営業活動</h2><button class="secondary" id="activityListButton">営業活動を見る</button><div id="activityList" class="hidden section-gap"></div></div>
</main><script>
const $=id=>document.getElementById(id),U='https://emauqxftmauvsffdjvyh.supabase.co',K='sb_publishable_9rgwKLiJU9dGVkqttq0-fQ_hrhNqnfa',A='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4',H={apikey:K,Authorization:`Bearer ${A}`},T=['顧客','材料メーカー','外注先','設備会社','その他'];
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'),norm=s=>(s||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase(),opts=s=>T.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('');
const GLOSSARY={
'電磁開閉器':'電気の力でモーターなどの電源を自動で入れたり切ったりするスイッチです。工場設備のモーター制御などでよく使われます。',
'電磁開閉機':'一般には「電磁開閉器」と呼ばれます。電気の力でモーターなどの電源を自動で入れたり切ったりする装置です。',
'配電盤':'工場や建物に入ってきた電気を、機械・照明・設備などへ安全に振り分けるための箱・設備です。',
'分電盤':'配電された電気を、照明やコンセントなど細かな回路に分けるための箱です。ブレーカーが並んでいるものが代表例です。',
'制御盤':'機械や設備を決められた順番・条件で動かすための電気機器をまとめた箱です。機械の頭脳に近い役割です。',
'受変電設備':'電力会社から受け取った高い電圧の電気を、工場や建物で使える電圧に変える設備です。',
'遮断器':'異常な大電流などが流れたときに、自動で電気を止めて機械や配線を守る装置です。',
'ブレーカー':'電気が流れすぎたときなどに自動で電気を切り、火災や機器の故障を防ぐ安全装置です。',
'インバータ':'モーターへ送る電気を調整し、回転する速さを自由に変えるための装置です。省エネにも使われます。',
'PLC':'工場の機械を自動で動かすための小型コンピューターです。センサーの情報を受け、モーターなどに動作命令を出します。',
'シーケンサ':'PLCのことです。工場設備を決められた手順どおりに自動運転させるための制御装置です。',
'リレー':'小さな電気信号を使って、別の電気回路を入れたり切ったりする部品です。',
'コンタクタ':'大きな電流を扱える電磁式のスイッチです。モーターなどを頻繁にON・OFFするときに使います。',
'サーボモーター':'位置や速度を細かく正確に制御できるモーターです。ロボットや精密機械によく使われます。',
'変圧器':'電気の電圧を高くしたり低くしたりする装置です。トランスとも呼ばれます。',
'トランス':'変圧器のことです。用途に合わせて電気の電圧を変える装置です。',
'開閉器':'電気回路をつないだり切ったりするためのスイッチ装置の総称です。',
'高圧受電':'工場などが電力会社から高い電圧のまま電気を受け取り、自社設備で使いやすい電圧に変えて利用する方式です。',
'キュービクル':'高圧の電気を安全に受けて低い電圧へ変える機器を、金属製の箱にまとめた受変電設備です。',
'ハーネス':'複数の電線や端子をまとめ、機械の中で電気や信号をつなぐ配線部品です。',
'端子台':'複数の電線を安全につないだり分岐したりするための接続部品です。',
'センサー':'温度・位置・圧力・光などの状態を検知して、機械に情報を送る部品です。',
'アクチュエータ':'電気などのエネルギーを、押す・回す・動かすといった実際の動きに変える装置です。',
'板金':'金属の板を切る・曲げる・穴をあける・溶接するなどして製品の形に加工する仕事です。',
'切削加工':'刃物で金属などを削り、必要な寸法や形に仕上げる加工方法です。',
'マシニングセンタ':'工具を自動で交換しながら、金属の穴あけや削り加工を自動で行う工作機械です。',
'NC旋盤':'コンピューターの指示で材料を回転させ、刃物で自動的に削る工作機械です。',
'アルマイト':'アルミの表面に人工的な酸化皮膜を作り、腐食や傷に強くしたり色を付けたりする表面処理です。',
'陽極酸化':'アルマイト処理の正式な呼び方です。アルミ表面を電気化学的に酸化させ、丈夫な皮膜を作ります。',
'めっき':'金属などの表面に別の金属の薄い膜を付け、さび防止や見た目、電気的性能を良くする処理です。',
'粉体塗装':'粉状の塗料を静電気で金属に付着させ、加熱して焼き付ける塗装方法です。丈夫な塗膜を作れます。',
'スクリーン印刷':'版の細かな網目からインクを押し出して印刷する方法です。金属・樹脂など紙以外にも印刷できます。',
'銘板':'機械や設備に付ける、名称・型式・注意事項・操作表示などを記したプレートやラベルです。',
'SUS':'ステンレス鋼を表す呼び方です。さびに強く、耐久性が必要な部品や銘板によく使われます。'
};
function glossaryFor(c){let text=[c.short_description,c.main_products,c.future_direction,c.quality_purchasing_traits,c.sales_opportunities,c.sales_notes].filter(Boolean).join(' '),hits=[];for(const [term,desc] of Object.entries(GLOSSARY)){if(text.includes(term)&&!hits.some(x=>x[0]===term))hits.push([term,desc])}if(!hits.length)return `<div class="glossary"><h3>用語のやさしい説明</h3><p class="glossary-intro">この会社の説明で、現在登録されている専門用語の解説はありません。</p></div>`;return `<div class="glossary"><h3>用語のやさしい説明</h3><p class="glossary-intro">訪問前に知っておきたい専門用語を、できるだけ簡単に説明しています。</p>${hits.map(([t,d])=>`<div class="term"><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join('')}</div>`}
async function get(path){let r=await fetch(U+path,{headers:H}),t=await r.text(),d;try{d=JSON.parse(t)}catch{throw Error(`データ取得エラー (${r.status})`)}if(!r.ok)throw Error(d?.message||`データ取得エラー (${r.status})`);return d}async function patch(path,b){let r=await fetch(U+path,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw Error('保存に失敗しました');return r}
$('cameraButton').onclick=()=>$('cardCamera').click();$('cardCamera').onchange=function(){if(this.files[0]){$('cardPreview').src=URL.createObjectURL(this.files[0]);$('cardPreview').classList.remove('hidden')}};let cards=[];
$('readCardButton').onclick=async function(){let f=$('cardCamera').files[0];if(!f)return alert('先に名刺を撮影してください');this.disabled=true;this.textContent='AIで読み取り中…';let rd=new FileReader();rd.onload=async()=>{try{let r=await fetch(`${U}/functions/v1/read-business-card`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({image:rd.result})}),d=await r.json();if(!r.ok)throw Error(d.error||'読み取り失敗');cards=(d.cards||[]).map(x=>({...x,relationship_type:'顧客'}));$('batchCardList').innerHTML=cards.map((c,i)=>`<div class="batch-card"><h4>名刺 ${i+1}</h4><label>取引先区分</label><select data-i="${i}" data-f="relationship_type">${opts('顧客')}</select><label>会社名</label><input data-i="${i}" data-f="company_name" value="${esc(c.company_name)}"><label>氏名</label><input data-i="${i}" data-f="person_name" value="${esc(c.person_name)}"><label>部署</label><input data-i="${i}" data-f="department" value="${esc(c.department)}"><label>役職</label><input data-i="${i}" data-f="position" value="${esc(c.position)}"><label>電話</label><input data-i="${i}" data-f="phone" value="${esc(c.phone)}"><label>メール</label><input data-i="${i}" data-f="email" value="${esc(c.email)}"><label>住所</label><input data-i="${i}" data-f="address" value="${esc(c.address)}"></div>`).join('');document.querySelectorAll('[data-i]').forEach(e=>e.oninput=()=>cards[+e.dataset.i][e.dataset.f]=e.value);$('cardResultTitle').textContent=`${cards.length}枚の名刺を読み取りました`;$('cardResult').classList.remove('hidden')}catch(e){alert(e.message)}finally{this.disabled=false;this.textContent='名刺を読み取る'}};rd.readAsDataURL(f)};
$('saveAllCardsButton').onclick=async function(){let ok=0;for(const c of cards){if(!c.company_name||!c.person_name)continue;let companies=await get('/rest/v1/companies?select=id,company_name'),co=companies.find(x=>norm(x.company_name)===norm(c.company_name)),id;if(!co){let r=await fetch(`${U}/rest/v1/companies`,{method:'POST',headers:{...H,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({company_name:c.company_name,address:c.address||'',phone:c.phone||'',relationship_type:c.relationship_type,ai_review_status:'未調査'})}),d=await r.json();id=d[0]?.id}else{id=co.id}let people=await get(`/rest/v1/contacts?company_id=eq.${id}&select=name`);if(!people.some(p=>norm(p.name)===norm(c.person_name))){await fetch(`${U}/rest/v1/contacts`,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({company_id:id,name:c.person_name,department:c.department||'',position:c.position||'',phone:c.phone||'',email:c.email||''})});ok++}}alert(`${ok}件登録しました`)};
async function loadCompanies(){try{let ty=$('relationshipFilter').value,st=$('salesStatusFilter').value,url='/rest/v1/companies?select=id,company_name,short_description,address,phone,sales_status,ai_review_status,relationship_type&order=company_name.asc';if(ty!=='すべて')url+=`&relationship_type=eq.${encodeURIComponent(ty)}`;if(st!=='すべて')url+=`&relationship_type=eq.${encodeURIComponent('顧客')}&sales_status=eq.${encodeURIComponent(st)}`;let a=await get(url);$('companyList').innerHTML=a.map(c=>`<div class="row"><strong class="clickable" data-company="${c.id}">${esc(c.company_name)}</strong><div class="company-summary">${esc(c.short_description||'AI調査中…')}</div><span class="badge ${esc(c.relationship_type||'その他')}">${esc(c.relationship_type||'その他')}</span><span class="status">${esc(c.ai_review_status||'未調査')}</span><br>${esc(c.address||'')}<br>${esc(c.phone||'')}</div>`).join('');$('companyList').classList.remove('hidden');$('companyProfile').classList.add('hidden');document.querySelectorAll('[data-company]').forEach(e=>e.onclick=()=>showCompany(e.dataset.company))}catch(e){alert('会社一覧エラー：'+e.message)}}$('companyListButton').onclick=loadCompanies;$('relationshipFilter').onchange=loadCompanies;$('salesStatusFilter').onchange=loadCompanies;
function choices(id,vals,sel=[]){let s=new Set(sel||[]);return `<div id="${id}" class="choice-group">${vals.map(v=>`<label class="choice"><input type="checkbox" value="${v}" ${s.has(v)?'checked':''}>${v}</label>`).join('')}</div>`}const checked=id=>[...document.querySelectorAll(`#${id} input:checked`)].map(x=>x.value);
async function showCompany(id){let [a,p]=await Promise.all([get(`/rest/v1/companies?id=eq.${id}&select=*`),get(`/rest/v1/contacts?company_id=eq.${id}&select=*`)]);if(!a.length)return;let c=a[0],is=c.relationship_type==='顧客',arts=Array.isArray(c.related_articles)?c.related_articles:[];$('companyProfile').innerHTML=`<h3>${esc(c.company_name)}</h3><div class="company-summary">${esc(c.short_description||'AI調査中…')}</div><span class="badge ${esc(c.relationship_type||'その他')}">${esc(c.relationship_type||'その他')}</span><span class="status">${esc(c.ai_review_status||'未調査')}</span><label>取引先区分</label><select id="profileType">${opts(c.relationship_type)}</select><div class="section-gap"><h3>この会社の人物</h3>${p.map(x=>`<div class="row">${esc(x.name)}<br>${esc(x.department||'')} ${esc(x.position||'')}</div>`).join('')||'<p>人物登録なし</p>'}</div>${is?`<div class="tendency-box"><h3>注文実績、銘板の傾向</h3><label>種類</label>${choices('nameplateTypes',['プラスチック銘板','金属銘板','アルマイト銘板','ラベル','未分類'],c.nameplate_types)}<label>金属銘板の材質</label>${choices('metalMaterials',['SUS','真鍮','アルミ','未分類'],c.order_metal_materials)}<label>サイズ</label>${choices('nameplateSizes',['大型','中型','小型','未分類'],c.nameplate_sizes)}<label>数量</label>${choices('orderQuantities',['大量','中量','少量','未分類'],c.order_quantities)}<label>傾向メモ</label><textarea id="tendencyNotes">${esc(c.nameplate_tendency_notes||'')}</textarea></div>`:''}<label>主力製品・事業</label><textarea id="profileMain">${esc(c.main_products||'')}</textarea><label>今後の方針・注力分野</label><textarea id="profileFuture">${esc(c.future_direction||'')}</textarea><label>品質・取引上の特徴</label><textarea id="profileQuality">${esc(c.quality_purchasing_traits||'')}</textarea><label>${is?'営業チャンス':'取引上の接点'}</label><textarea id="profileOpp">${esc(c.sales_opportunities||'')}</textarea><label>社内メモ</label><textarea id="profileNotes">${esc(c.sales_notes||'')}</textarea><label>公式サイト</label><input id="profileWeb" value="${esc(c.website||'')}"><label>公式YouTubeチャンネル</label>${c.youtube_url?`<a class="youtube-link" href="${esc(c.youtube_url)}" target="_blank" rel="noopener">YouTubeチャンネルを開く</a>`:'<div class="muted">公式YouTubeチャンネルは確認できていません。</div>'}<button class="primary" id="saveProfile">保存する</button>${glossaryFor(c)}<div class="section-gap"><h3>関連記事・ニュース</h3>${arts.map(x=>`<div class="article"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title||'記事を見る')}</a>${x.source||x.date?`<div class="meta">${esc(x.source||'')}${x.date?'・'+esc(x.date):''}</div>`:''}${x.summary?`<div>${esc(x.summary)}</div>`:''}</div>`).join('')||'<p class="muted">関連記事なし</p>'}</div>`;$('saveProfile').onclick=async()=>{let body={relationship_type:$('profileType').value,website:$('profileWeb').value||null,main_products:$('profileMain').value||null,future_direction:$('profileFuture').value||null,quality_purchasing_traits:$('profileQuality').value||null,sales_opportunities:$('profileOpp').value||null,sales_notes:$('profileNotes').value||null};if(is){body.nameplate_types=checked('nameplateTypes');body.order_metal_materials=checked('metalMaterials');body.nameplate_sizes=checked('nameplateSizes');body.order_quantities=checked('orderQuantities');body.nameplate_tendency_notes=$('tendencyNotes').value||null}try{await patch(`/rest/v1/companies?id=eq.${id}`,body);alert('保存しました');showCompany(id)}catch(e){alert(e.message)}};$('companyList').classList.add('hidden');$('companyProfile').classList.remove('hidden')}
$('contactListButton').onclick=async()=>{try{let a=await get('/rest/v1/contacts?select=*&order=name.asc');$('contactList').innerHTML=a.map(c=>`<div class="row"><strong>${esc(c.name)}</strong><br>${esc(c.department||'')} ${esc(c.position||'')}<br>${esc(c.phone||'')}<br>${esc(c.email||'')}</div>`).join('');$('contactList').classList.remove('hidden')}catch(e){alert(e.message)}};$('activityListButton').onclick=async()=>{try{let a=await get('/rest/v1/activities?select=*&order=activity_date.desc');$('activityList').innerHTML=a.map(x=>`<div class="row"><strong>${esc(x.activity_date||'')} ${esc(x.activity_type||'')}</strong><br>${esc(x.notes||'')}</div>`).join('')||'<p>営業活動なし</p>';$('activityList').classList.remove('hidden')}catch(e){alert(e.message)}};
</script></body></html>
