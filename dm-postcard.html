const product='ネームプレート(NP)、銘板、ラベル、表示物等';const seasonal={spring:{label:'春・桜',title:'春のご挨拶申し上げます',text:`春暖の候、貴社ますますご清栄のこととお慶び申し上げます。\n平素は格別のお引き立てを賜り、厚く御礼申し上げます。\n\n${product}のご用命がございましたら、小ロットからでもお気軽にお申し付けください。\n今後とも変わらぬご愛顧のほど、よろしくお願い申し上げます。`},summer:{label:'夏・朝顔と風鈴',title:'暑中お見舞い申し上げます',text:`暑中お見舞い申し上げます。\n平素は格別のお引き立てを賜り、厚く御礼申し上げます。\n\n${product}のご用命がございましたら、小ロットからでもお気軽にお申し付けください。\n暑さ厳しき折、皆様のご健勝を心よりお祈り申し上げます。`},lateSummer:{label:'晩夏・うちわ',title:'残暑お見舞い申し上げます',text:`残暑お見舞い申し上げます。\n平素は格別のお引き立てを賜り、厚く御礼申し上げます。\n\n${product}のご用命がございましたら、ぜひお気軽にご相談ください。\n残暑厳しき折、皆様のご健勝を心よりお祈り申し上げます。`},autumn:{label:'秋・紅葉',title:'秋のご挨拶申し上げます',text:`秋涼の候、貴社ますますご清栄のこととお慶び申し上げます。\n平素は格別のお引き立てを賜り、厚く御礼申し上げます。\n\n${product}のご予定がございましたら、ぜひ弊社へお声掛けください。\n今後ともよろしくお願い申し上げます。`},winter:{label:'冬・椿と雪',title:'寒中お見舞い申し上げます',text:`寒中お見舞い申し上げます。\n厳しい寒さが続いておりますが、皆様いかがお過ごしでしょうか。\n\n${product}のご用命がございましたら、小ロットからでもお気軽にお申し付けください。\n本年も変わらぬご愛顧のほど、よろしくお願い申し上げます。`},newyear:{label:'新年・松と梅',title:'謹んで新年のご挨拶を申し上げます',text:`旧年中は格別のご厚情を賜り、誠にありがとうございました。\n本年もより一層お役に立てるよう努めてまいります。\n\n${product}のご用命がございましたら、どうぞお気軽にお申し付けください。\n本年も何卒よろしくお願い申し上げます。`}};function petal(ctx,x,y,r,color,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,-r*.7,r*.52,r,0,0,Math.PI*2);ctx.fill();ctx.restore()}function flower(ctx,x,y,r,color,n=5){for(let i=0;i<n;i++)petal(ctx,x,y,r,color,i*Math.PI*2/n);ctx.fillStyle='#d9a83e';ctx.beginPath();ctx.arc(x,y,r*.22,0,Math.PI*2);ctx.fill()}function drawSeasonArt(ctx,key){ctx.save();ctx.translate(300,820);ctx.scale(.62,.62);ctx.lineCap='round';ctx.lineJoin='round';if(key==='spring'){ctx.strokeStyle='#7d5d47';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(720,60);ctx.quadraticCurveTo(820,160,970,230);ctx.stroke();[[760,90],[820,135],[875,160],[930,205],[705,82]].forEach(p=>flower(ctx,p[0],p[1],24,'#ef9eb5'))}else if(key==='summer'){ctx.strokeStyle='#777';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(825,35);ctx.lineTo(825,95);ctx.stroke();ctx.fillStyle='#d7eef4';ctx.begin lue;ctx.fillStyle='#fffdf9';ctx.fillRect(0,0,1000,1480);ctx.fillStyle='#242424';ctx.textBaseline='top';ctx.font='700 58px "Yu Mincho",serif';const titleLines=wrapText(ctx,s.title,820);titleLines.forEach((line,i)=>ctx.fillText(line,90,125+i*72));ctx.font='400 34px "Yu Mincho",serif';let y=125+titleLines.length*72+85;for(const line of wrapText(ctx,body,820)){if(!line){y+=28;continue}ctx.fillText(line,90,y);y+=58}drawSeasonArt(ctx,key);ctx.strokeStyle='#d8d0c5';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(90,1265);ctx.lineTo(910,1265);ctx.stroke();ctx.font='600 28px sans-serif';ctx.fillStyle='#555';ctx.fillText('ネームプレート(NP)・銘板・ラベル・表示物等のご用命を承ります',90,1305);return canvas}function updateBackPreview(){const s=seasonal[$('season').value];$('seasonChip').textContent=`イラスト：${s.label}`;drawBackCanvas($('backPreview'))}function setSeasonText(){$('backText').value=seasonal[$('season').value].text;updateBackPreview()}async function makeBackPdf(){await document.fonts.ready;const{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:[100,148],compress:true});pdf.addImage(drawBackCanvas().toDataURL('image/png'),'PNG',0,0,100,148,undefined,'FAST');window.open(URL.createObjectURL(pdf.output('blob')),'_blank')}$('search').oninput=render;$('selectAll').onclick=()=>{visible().filter(c=>effectiveCompany(c).address).forEach(c=>selected.add(String(c.id)));render()};$('clearAll').onclick=()=>{selected.clear();render()};$('pdfButton').onclick=makePdf;$('season').onchange=setSeasonText;$('resetText').onclick=setSeasonText;$('backText').oninput=updateBackPreview;$('backPdfButton').onclick=makeBackPdf;setSeasonText();(async()=>{try{[companies,contacts]=await Promise.all([apiGetAll('/rest/v1/companies?select=id,company_name,address,relationship_type&order=company_name.asc'),apiGetAll('/rest/v1/contacts?select=id,company_id,name,department,position,employment_status&order=name.asc')]);render()}catch(e){$('companyList').textContent='読み込みに失敗しました。'}})();
</script></body></html>
