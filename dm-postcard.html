<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DM・はがき印刷</title>
<link rel="stylesheet" href="./dm-print-fix.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#f5f5f5;color:#222}header{background:#fff;border-bottom:1px solid #ddd;padding:16px 18px;font-size:22px;font-weight:800}.wrap{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0001}h2{margin:0 0 12px}.muted{font-size:13px;color:#666;line-height:1.6}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1;min-width:150px}label{display:block;font-weight:700;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}button{border:0;border-radius:11px;padding:12px 14px;font-size:16px;font-weight:800}.primary{background:#111;color:#fff}.secondary{background:#e9e9e9}.company-row{display:grid;grid-template-columns:30px 1.2fr 1.5fr 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.company-row input{width:20px;height:20px}.company-name{font-weight:800}.address{font-size:14px;color:#444}.print-note{background:#fff8df;border:1px solid #ead48a;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px;font-weight:700;line-height:1.6}.print-area{position:fixed;left:-200vw;top:0;width:100mm}.postcard{width:100mm;height:148mm;position:relative;overflow:hidden;background:#fff}.postal{position:absolute;top:22.2mm;left:0;width:100mm;height:8mm;transform:translateY(-21.2mm);font-family:"Yu Gothic",sans-serif}.postal-digit{position:absolute;top:0;width:7mm;height:8mm;display:flex;align-items:center;justify-content:center;font-size:4.7mm;line-height:1}.postal-digit:nth-child(1){left:43.5mm}.postal-digit:nth-child(2){left:51mm}.postal-digit:nth-child(3){left:58.5mm}.postal-digit:nth-child(4){left:66.3mm}.postal-digit:nth-child(5){left:73.8mm}.postal-digit:nth-child(6){left:81.3mm}.postal-digit:nth-child(7){left:88.8mm}.v-address,.v-company,.v-recipient{position:absolute;writing-mode:vertical-rl;text-orientation:mixed;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}.v-address{top:27mm;right:13mm;height:101mm;font-size:4.8mm;line-height:1.5}.v-company{top:32mm;right:44mm;height:96mm;font-size:6.4mm;font-weight:700;line-height:1.45}.v-recipient{top:38mm;right:57mm;height:91mm;font-size:5.2mm;font-weight:600;line-height:1.45}.status{font-size:13px;font-weight:700;margin-top:10px}@media(max-width:700px){.company-row{grid-template-columns:30px 1fr}.company-row>.address,.company-row>.recipient-box{grid-column:2}}</style></head><body>
<header>DM・はがき印刷</header><div class="wrap"><a href="./index.html">← 営業管理へ戻る</a><div class="card"><h2>送付する会社を選ぶ</h2><label>会社を検索</label><input id="search" type="search" placeholder="会社名・住所で検索"><div class="toolbar" style="margin-top:12px"><button class="secondary" id="selectAll">表示中をすべて選択</button><button class="secondary" id="clearAll">選択解除</button></div><p id="count" class="muted"></p><div id="companyList">読み込み中…</div></div>
<div class="card"><h2>宛名面の印刷</h2><div class="print-note">iPhoneでは直接Webページを印刷せず、まず100×148mmの印刷用PDFを作成します。PDFから印刷することでSafariのURL・日時・ページ番号を避けます。</div><button class="primary" id="pdfButton">印刷用PDFを作る</button><div id="status" class="status"></div></div></div><div id="printArea" class="print-area"></div>
<script>
const U='https://emauqxftmauvsffdjvyh.supabase.co',K='sb_publishable_9rgwKLiJU9dGVkqttq0-fQ_hrhNqnfa',A='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4',H={apikey:K,Authorization:`Bearer ${A}`};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');let companies=[],contacts=[],selected=new Set(),recipientChoice=new Map();
async function apiGetAll(path){let all=[],offset=0;while(true){const r=await fetch(U+path+`&limit=100&offset=${offset}`,{headers:H}),d=await r.json();if(!r.ok)throw Error('取得エラー');all.push(...d);if(d.length<100)break;offset+=100}return all}
function postalParts(raw){const text=String(raw||'').trim(),m=text.match(/(?:〒\s*)?(\d{3})[-ー‐‑‒–—−]?\s*(\d{4})/);return{postal:m?m[1]+m[2]:'',address:m?text.replace(m[0],'').trim():text}}
function activeContacts(id){return contacts.filter(c=>String(c.company_id)===String(id)&&!['退職','異動'].includes(c.employment_status||'在籍'))}
function recipientFor(c){const choice=recipientChoice.get(String(c.id))||'company';if(choice==='company')return{company:c.company_name,recipient:'資材・調達・購買部 御中'};const p=contacts.find(x=>String(x.id)===choice);return p?{company:c.company_name+([p.department,p.position].filter(Boolean).length?'　'+[p.department,p.position].filter(Boolean).join('　'):''),recipient:p.name+' 様'}:{company:c.company_name,recipient:'資材・調達・購買部 御中'}}
function visible(){const q=$('search').value.trim().toLowerCase();return companies.filter(c=>!q||(`${c.company_name} ${c.address||''}`).toLowerCase().includes(q))}
function render(){const a=visible();$('count').textContent=`${a.length}社 ／ ${selected.size}社選択`;$('companyList').innerHTML=a.map(c=>{const people=activeContacts(c.id),opts=[`<option value="company">会社宛</option>`,...people.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} 様</option>`)].join('');return `<div class="company-row"><input type="checkbox" data-id="${esc(c.id)}" ${selected.has(String(c.id))?'checked':''} ${c.address?'':'disabled'}><div class="company-name">${esc(c.company_name)}</div><div class="address">${esc(c.address||'住所未登録')}</div><div class="recipient-box"><select data-rec="${esc(c.id)}">${opts}</select></div></div>`}).join('');document.querySelectorAll('[data-id]').forEach(e=>e.onchange=()=>{e.checked?selected.add(String(e.dataset.id)):selected.delete(String(e.dataset.id));render()});document.querySelectorAll('[data-rec]').forEach(e=>{e.value=recipientChoice.get(String(e.dataset.rec))||'company';e.onchange=()=>recipientChoice.set(String(e.dataset.rec),e.value)})}
function card(c){const p=postalParts(c.address),r=recipientFor(c),digits=p.postal.slice(0,7).split('').map(d=>`<span class="postal-digit">${esc(d)}</span>`).join('');return `<section class="postcard"><div class="postal">${digits}</div><div class="v-address">${esc(p.address)}</div><div class="v-company">${esc(r.company)}</div><div class="v-recipient">${esc(r.recipient)}</div></section>`}
async function makePdf(){const a=companies.filter(c=>selected.has(String(c.id))&&c.address);if(!a.length)return alert('印刷する会社を選択してください。');if(!window.html2canvas||!window.jspdf)return alert('PDF機能の読み込みに失敗しました。再読み込みしてください。');$('status').textContent='PDFを作成中…';const area=$('printArea');area.innerHTML=a.map(card).join('');await document.fonts.ready;const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:[100,148],compress:true});const pages=[...area.querySelectorAll('.postcard')];for(let i=0;i<pages.length;i++){if(i)pdf.addPage([100,148],'portrait');const canvas=await html2canvas(pages[i],{scale:3,backgroundColor:'#ffffff',logging:false});pdf.addImage(canvas.toDataURL('image/jpeg',0.96),'JPEG',0,0,100,148,undefined,'FAST')}const blob=pdf.output('blob'),url=URL.createObjectURL(blob);$('status').textContent=`${a.length}枚のPDFを作成しました。PDFを開いて共有 → プリントしてください。`;window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),120000)}
$('search').oninput=render;$('selectAll').onclick=()=>{visible().filter(c=>c.address).forEach(c=>selected.add(String(c.id)));render()};$('clearAll').onclick=()=>{selected.clear();render()};$('pdfButton').onclick=makePdf;(async()=>{try{[companies,contacts]=await Promise.all([apiGetAll('/rest/v1/companies?select=id,company_name,address,relationship_type&order=company_name.asc'),apiGetAll('/rest/v1/contacts?select=id,company_id,name,department,position,employment_status&order=name.asc')]);render()}catch(e){$('companyList').textContent='読み込みに失敗しました。'}})();
</script></body></html>
