<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DM・はがき印刷</title>
<link rel="stylesheet" href="./dm-print-fix.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#f5f5f5;color:#222}header{background:#fff;border-bottom:1px solid #ddd;padding:16px 18px;font-size:22px;font-weight:800}.wrap{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0001}h2{margin:0 0 12px}.muted{font-size:13px;color:#666;line-height:1.6}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1;min-width:150px}label{display:block;font-weight:700;margin:10px 0 5px}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}button{border:0;border-radius:11px;padding:12px 14px;font-size:16px;font-weight:800}.primary{background:#111;color:#fff}.secondary{background:#e9e9e9}.company-row{display:grid;grid-template-columns:30px 1.2fr 1.5fr 1.3fr;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.company-row input{width:20px;height:20px}.company-name{font-weight:800}.address{font-size:14px;color:#444}.recipient-actions{display:flex;gap:8px;align-items:center}.recipient-actions select{flex:1;min-width:0}.single-pdf{flex:0 0 auto;background:#111;color:#fff;white-space:nowrap;padding:11px 12px}.single-pdf:disabled{background:#bbb;color:#fff}.print-note{background:#fff8df;border:1px solid #ead48a;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px;font-weight:700;line-height:1.6}.status{font-size:13px;font-weight:700;margin-top:10px}@media(max-width:700px){.company-row{grid-template-columns:30px 1fr}.company-row>.address,.company-row>.recipient-box{grid-column:2}.recipient-actions{width:100%}}</style></head><body>
<header>DM・はがき印刷</header><div class="wrap"><a href="./index.html">← 営業管理へ戻る</a><div class="card"><h2>送付する会社を選ぶ</h2><label>会社を検索</label><input id="search" type="search" placeholder="会社名・住所で検索"><div class="toolbar" style="margin-top:12px"><button class="secondary" id="selectAll">表示中をすべて選択</button><button class="secondary" id="clearAll">選択解除</button></div><p id="count" class="muted"></p><div id="companyList">読み込み中…</div></div>
<div class="card"><h2>宛名面の印刷</h2><div class="print-note">100×148mmの印刷用PDFを作成します。縦書きはPDF用に直接描画するため、iPhoneのSafariで文字が分断されにくい方式です。</div><button class="primary" id="pdfButton">印刷用PDFを作る</button><div id="status" class="status"></div></div></div>
<script>
const U='https://emauqxftmauvsffdjvyh.supabase.co',K='sb_publishable_9rgwKLiJU9dGVkqttq0-fQ_hrhNqnfa',A='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4',H={apikey:K,Authorization:`Bearer ${A}`};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');let companies=[],contacts=[],selected=new Set(),recipientChoice=new Map();
async function apiGetAll(path){let all=[],offset=0;while(true){const r=await fetch(U+path+`&limit=100&offset=${offset}`,{headers:H}),d=await r.json();if(!r.ok)throw Error('取得エラー');all.push(...d);if(d.length<100)break;offset+=100}return all}
function postalParts(raw){const text=String(raw||'').trim(),m=text.match(/(?:〒\s*)?(\d{3})[-ー‐‑‒–—−]?\s*(\d{4})/);return{postal:m?m[1]+m[2]:'',address:m?text.replace(m[0],'').trim():text}}
function activeContacts(id){return contacts.filter(c=>String(c.company_id)===String(id)&&!['退職','異動'].includes(c.employment_status||'在籍'))}
function recipientFor(c){const choice=recipientChoice.get(String(c.id))||'company';if(choice==='company')return{company:c.company_name,recipient:'資材・調達・購買部 御中'};const p=contacts.find(x=>String(x.id)===choice);return p?{company:c.company_name+([p.department,p.position].filter(Boolean).length?'　'+[p.department,p.position].filter(Boolean).join('　'):''),recipient:p.name+' 様'}:{company:c.company_name,recipient:'資材・調達・購買部 御中'}}
function visible(){const q=$('search').value.trim().toLowerCase();return companies.filter(c=>!q||(`${c.company_name} ${c.address||''}`).toLowerCase().includes(q))}
function render(){const a=visible();$('count').textContent=`${a.length}社 ／ ${selected.size}社選択`;$('companyList').innerHTML=a.map(c=>{const people=activeContacts(c.id),opts=[`<option value="company">会社宛</option>`,...people.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} 様</option>`)].join('');return `<div class="company-row"><input type="checkbox" data-id="${esc(c.id)}" ${selected.has(String(c.id))?'checked':''} ${c.address?'':'disabled'}><div class="company-name">${esc(c.company_name)}</div><div class="address">${esc(c.address||'住所未登録')}</div><div class="recipient-box"><div class="recipient-actions"><select data-rec="${esc(c.id)}">${opts}</select><button class="single-pdf" data-pdf="${esc(c.id)}" ${c.address?'':'disabled'}>印刷用PDF</button></div></div></div>`}).join('');document.querySelectorAll('[data-id]').forEach(e=>e.onchange=()=>{e.checked?selected.add(String(e.dataset.id)):selected.delete(String(e.dataset.id));render()});document.querySelectorAll('[data-rec]').forEach(e=>{e.value=recipientChoice.get(String(e.dataset.rec))||'company';e.onchange=()=>recipientChoice.set(String(e.dataset.rec),e.value)});document.querySelectorAll('[data-pdf]').forEach(e=>e.onclick=()=>makeSinglePdf(e.dataset.pdf))}
const PX=10,mm=v=>v*PX;
function normalizeVerticalText(text,isAddress=false){let s=String(text||'').replace(/\s+/g,'').replace(/\(/g,'（').replace(/\)/g,'）');if(isAddress)s=s.replace(/[0-9]/g,d=>'０１２３４５６７８９'[Number(d)]).replace(/[-‐‑‒–—−]/g,'｜');return s}
function drawVertical(ctx,text,xMm,yMm,fontMm,maxHeightMm,weight='400',lineGap=1.45,isAddress=false){const chars=[...normalizeVerticalText(text,isAddress)],fontPx=mm(fontMm),startY=mm(yMm),available=mm(maxHeightMm),baseStep=fontPx*lineGap,minStep=fontPx*0.9,fitStep=chars.length>1?(available-fontPx)/(chars.length-1):baseStep,step=Math.max(minStep,Math.min(baseStep,fitStep));ctx.save();ctx.fillStyle='#111';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${weight} ${fontPx}px "Yu Mincho","Hiragino Mincho ProN","Hiragino Mincho Pro",serif`;const x=mm(xMm);let y=startY+fontPx/2;for(const ch of chars){if(ch==='ー'||ch==='（'||ch==='）'){ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/2);ctx.fillText(ch,0,0);ctx.restore()}else{ctx.fillText(ch,x,y)}y+=step}ctx.restore()}
function drawPostcardCanvas(c){const canvas=document.createElement('canvas');canvas.width=100*PX;canvas.height=148*PX;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#111';const p=postalParts(c.address),r=recipientFor(c),centers=[47,54.5,62,68.8,76.3,82.8,89.8];ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`400 ${mm(4.7)}px "Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif`;[...p.postal.slice(0,7)].forEach((d,i)=>ctx.fillText(d,mm(centers[i]),mm(15.0)));drawVertical(ctx,p.address,88,35,4.6,96,'400',1.18,true);drawVertical(ctx,r.company,56,40,6.2,88,'700',1.12,false);drawVertical(ctx,r.recipient,38,46,5.0,82,'600',1.15,false);return canvas}
async function openPdfFor(a){if(!a.length)return;if(!window.jspdf)return alert('PDF機能の読み込みに失敗しました。再読み込みしてください。');try{$('status').textContent='PDFを作成中…';await document.fonts.ready;const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:[100,148],compress:true});for(let i=0;i<a.length;i++){if(i)pdf.addPage([100,148],'portrait');const canvas=drawPostcardCanvas(a[i]);pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,100,148,undefined,'FAST')}const blob=pdf.output('blob'),url=URL.createObjectURL(blob);$('status').textContent=`${a.length}枚のPDFを作成しました。PDFを開いて共有 → プリントしてください。`;window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),180000)}catch(e){console.error(e);$('status').textContent='PDF作成に失敗しました。もう一度お試しください。'}}
async function makeSinglePdf(id){const c=companies.find(x=>String(x.id)===String(id));if(!c||!c.address)return alert('住所が登録されていません。');await openPdfFor([c])}
async function makePdf(){const a=companies.filter(c=>selected.has(String(c.id))&&c.address);if(!a.length)return alert('印刷する会社を選択してください。');await openPdfFor(a)}
$('search').oninput=render;$('selectAll').onclick=()=>{visible().filter(c=>c.address).forEach(c=>selected.add(String(c.id)));render()};$('clearAll').onclick=()=>{selected.clear();render()};$('pdfButton').onclick=makePdf;(async()=>{try{[companies,contacts]=await Promise.all([apiGetAll('/rest/v1/companies?select=id,company_name,address,relationship_type&order=company_name.asc'),apiGetAll('/rest/v1/contacts?select=id,company_id,name,department,position,employment_status&order=name.asc')]);render()}catch(e){$('companyList').textContent='読み込みに失敗しました。'}})();
</script></body></html>
