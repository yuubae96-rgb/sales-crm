<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#f5f5f5;color:#222}header{background:#fff;border-bottom:1px solid #ddd;padding:16px 18px;font-size:22px;font-weight:800}.wrap{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0001}h2{margin:0 0 12px}.muted{font-size:13px;color:#666;line-height:1.6}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1;min-width:150px}label{display:block;font-weight:700;margin:8px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}textarea{min-height:150px;line-height:1.8;resize:vertical}button{border:0;border-radius:11px;padding:12px 14px;font-size:16px;font-weight:800}.primary{background:#111;color:#fff}.secondary{background:#e9e9e9}.print-note{background:#fff8df;border:1px solid #ead48a;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px;font-weight:700;line-height:1.6}.status{font-size:13px;font-weight:700;margin-top:10px}.quick-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}.quick-nav a{display:flex;align-items:center;justify-content:center;min-height:48px;padding:11px 12px;border-radius:11px;text-decoration:none;font-size:16px;font-weight:800}.quick-front{background:#e9e9e9;color:#222}.quick-back{background:#111;color:#fff}.company-row{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:16px 0;border-bottom:1px solid #e8e8e8}.select-cell{padding-top:4px}.select-cell input{width:24px;height:24px}.company-main{min-width:0}.company-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}.company-head strong{font-size:18px}.address{font-size:14px;color:#555;line-height:1.45;margin-bottom:8px}.summary-actions{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}.edit-btn,.secondary{background:#e9e <header>DM・はがき印刷</header><div class="wrap"><a href="./index.html">← 営業管理へ戻る</a><div class="quick-nav"><a class="quick-front" href="#addressSide">宛名面へ</a><a class="quick-back" href="#backSide">DM裏面へ</a></div><div class="card"><h2>送付する会社を選ぶ</h2><label>会社を検索</label><input id="search" type="search" placeholder="会社名・住所で検索"><div class="toolbar" style="margin-top:12px"><button class="secondary" id="selectAll">表示中をすべて選択</button><button class="secondary" id="clearAll">選択解除</button></div><p id="count" class="muted"></p><div id="companyList">読み込み中…</div></div><div class="card" id="addressSide"><h2>宛名面の印刷</h2><button class="primary" id="pdfButton">選択した会社の宛名面PDFを作る</button></div><div class="card" id="backSide"><h2>DM裏面（季節の挨拶）</h2><div class="print-note">季節の文面とイラストを別々に選べます。イラストは10種類から選択できます。</div><div class="back-grid"><div><label>季節・用途</label><select id="season"><option value="spring">春のご挨拶</option><option value="summer">暑中見舞い</option><option value="lateSummer">残暑見舞い</option><option value="autumn">秋のご挨拶</option><option value="winter">寒中見舞い</option><option value="newyear">年始のご挨拶</option></select><label>イラスト</label><select id="illustration"><option value="sakura">桜</option><option value="ume">梅</option><option value="asagao">朝顔</option><option value="furin">風鈴</option><option value="kingyo">金魚</option><option value="uchiwa">うちわ</option><option value="momiji">紅葉</option><option value="susuki">すすき</option><option value="tsubaki">椿</option><option value="yuki">雪・松</option></select><div id="seasonChip" class="season-chip"></div><label>裏面の文面</label><textarea id="backText"></textarea><div class="toolbar" style="margin-top:12px"><button class="secondary" id="resetText">この季節の定型文に戻す</button><button class="primary" id="backPdfButton">裏面PDFを作る</button></div></div><div class="preview-wrap"><canvas id="backPreview" class="back-preview" width="1000" height="1480"></canvas></div></div></div></div>
<script>
const U='https://emauqxftmauvsffdjvyh.supabase.co',K='sb_publishable_9rgwKLiJU9dGVkqttq0-fQ_hrhNqnfa',A='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4',H={apikey:K,Authorization:`Bearer ${A}`},$=id=>document.getElementById(id);let companies=[],contacts=[],selected=new Set(),recipientChoice=new Map(),printOverrides=new Map(),editOpen=new Set();async function apiGetAll(path){let all=[],offset=0;while(1){const r=await fetch(U+path+`&limit=100&offset=${offset}`,{headers:H}),d=await r.json();if(!r.ok)throw Error();all.push(...d);if(d.length<100)break;offset+=100}return all}function postalParts(raw){const t=String(raw||'').trim(),m=t.match(/(?:〒\s*)?(\d{3})[-ー‐‑‒–—−]?\s*(\d{4})/);return{postal:m?m[1]+m[2]:'',address:m?t.replace(m[0],'').trim():t}}function activeContacts(id){return contacts.filter(c=>String(c.company_id)===String(id)&&!['退職','異動'].includes(c.employment_status||'在籍'))}function effectiveCompany(c){const o=printOverrides.get(String(c.id));return o?{...c,...o}:c}function recipientFor(c){const ec=effectiveCompany(c),o=printOverrides.get(String(c.id)),choice=recipientChoice.get(String(c.id))||'company';if(choice==='company')return{company:ec.company_name,recipient:o?.recipient||'資材・調達・購買部 御中'};const p=contacts.find(x=>String(x.id)===choice);return p?{company:ec.company_name,recipient:o?.recipient||p.name+' 様'}:{company:ec.company_name,recipient:'資材・調達・購買部 御中'}}function visible(){const q=$('search').value.trim().toLowerCase();return companies.filter(c=>!q||(`${c.company_name} ${c.address||''}`).toLowerCase().includes(q))}function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function render(){const a=visible();$('count').textContent=`${a.length}社 ／ ${selected.size}社選択`;$('companyList').innerHTML=a.map(c=>{const id=String(c.id),ec=effectiveCompany(c),people=activeContacts(c.id),open=editOpen.has(id),opts=['<option value="company">会社宛</option>',...people.map(p=>`<option value="${p.id}">${esc(p.name)} 様</option>`)].join('');return `<div class="company-row"><div class="select-cell"><input type="checkbox" data-id="${id}" ${selected.has(id)?'checked':''}></div><div class="company-main"><div class="company-head"><strong>${esc(ec.company_name)}</strong></div><div class="address">${esc(ec.address||'住所未登録')}</div><div class="summary-actions"><select data-rec="${id}">${opts}</select><button class="edit-btn" data-edit="${id}">${open?'閉じる':'編集'}</button><button class="single-pdf" data-pdf="${id}">DM印刷用PDF</button></div>${open?`<div class="edit-panel"><div class="fields"><input data-cn="${id}" value="${esc(ec.company_name)}"><input data-ad="${id}" value="${esc(ec.address||'')}"><input data-rp="${id}" value="${esc(recipientFor(c).recipient)}"></div><div class="edit-actions"><button data-temp="${id}">PDFに反映</button><button class="save-db" data-db="${id}">会社情報を保存</button></div></div>`:''}</div></div>`}).join('');document.querySelectorAll('[data-id]').forEach(e=>e.onchange=()=>{e.checked?selected.add(e.dataset.id):selected.delete(e.dataset.id);render()});document.querySelectorAll('[data-rec]').forEach(e=>{e.value=recipientChoice.get(e.dataset.rec)||'company';e.onchange=()=>recipientChoice.set(e.dataset.rec,e.value)});document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>{const id=e.dataset.edit;editOpen.has(id)?editOpen.delete(id):editOpen.add(id);render()});document.querySelectorAll('[data-temp]').forEach(e=>e.onclick=()=>saveEdit(e.dataset.temp,false));document.querySelectorAll('[data-db]').forEach(e=>e.onclick=()=>saveEdit(e.dataset.db,true));document.querySelectorAll('[data-pdf]').forEach(e=>e.onclick=()=>openPdfFor([companies.find(c=>String(c.id)===e.dataset.pdf)]))}async function saveEdit(id,db){const c=companies.find(x=>String(x.id)===id),v={company_name:document.querySelector(`[data-cn="${id}"]`).value,address:document.querySelector(`[data-ad="${id}"]`).value,recipient:document.querySelector(`[data-rp="${id}"]`).value};printOverrides.set(id,v);if(db)await fetch(U+`/rest/v1/companies?id=eq.${id}`,{method:'PATCH',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({company_name:v.company_name,address:v.address})});editOpen.delete(id);render()}const PX=10,mm=v=>v*PX;function drawVertical(ctx,text,x,y,size,max){const ch=[...String(text||'').replace(/\s+/g,'')];ctx.font=`${mm(size)}px "Yu Mincho",serif`;ctx.textAlign='center';ctx.textBaseline='middle';let yy=mm(y);const step=Math.min(mm(size*1.25),mm(max)/Math.max(ch.length,1));ch.forEach(v=>{ctx.fillText(v,mm(x),yy);yy+=step})}function drawPostcardCanvas(c){const ec=effectiveCompany(c),cv=document.createElement('canvas');cv.width=1000;cv.height=1480;const x=cv.getContext('2d'),p=postalParts(ec.address),r=recipientFor(c),centers=[47,54.5,62,68.8,76.3,82.8,89.8];x.fillStyle='#fff';x.fillRect(0,0,1000,1480);x.fillStyle='#111';x.font=`${mm(4.7)}px sans-serif`;x.textAlign='center';[...p.postal].forEach((d,i)=>x.fillText(d,mm(centers[i]),mm(15)));drawVertical(x,p.address,88,35,4.6,96);drawVertical(x,r.company,56,40,6.2,88);drawVertical(x,r.recipient,38,46,5,82);return cv}async function openPdfFor(a){await document.fonts.ready;const{jsPDF}=window.jspdf,p=new jsPDF({orientation:'portrait',unit:'mm',format:[100,148]});a.forEach((c,i)=>{if(i)p.addPage([100,148]);p.addImage(drawPostcardCanvas(c).toDataURL(),'PNG',0,0,100,148)});window.open(URL.createObjectURL(p.output('blob')),'_blank')}const product='ネームプレート(NP)、銘板、ラベル、表示物等';const seasonal={spring:{title:'春のご挨拶申し上げます',art:'sakura',text:`春暖の候、貴社ますますご清栄のこととお慶び申し上げます。\n平素は格別のお引き立てを賜り、厚く御礼申し上げます。\n\n${product}のご用命がございましたら、小ロットからでもお気軽にお申し付けください。\n\n今後とも変わらぬご愛顧のほど、よろしくお願い申し上げます。`},summer:{title:'暑中お見舞い申し上げます',art:'asagao',text:`暑中お見舞い申し上げます。\n平素は格別のお引き立てを賜り、厚く御礼申し上げます。\n\n${product}のご用命がございましたら、小ロットからでもお気軽にお申し付けください。\n\n暑さ厳しき折、皆様のご健勝を心よりお祈り申し上げます。`},lateSummer:{title:'残暑お見舞い申し上げます',art:'uchiwa',text:`残暑お見舞い申し上げます。\n平素は格別のお引き立てを賜り、厚く御礼申し上げます。\n\n${product}のご用命がございましたら、ぜひお気軽にご相談ください。\n\n残暑厳しき折、皆様のご健勝を心よりお祈り申し上げます。`},autumn:{title:'秋のご挨拶申し上げます',art:'momiji',text:`秋涼の候、貴社ますますご清栄のこととお慶び申し上げます。\n平素は格別のお引き立てを賜り、厚く御礼申し上げます。\n\n${product}のご予定がございましたら、ぜひ弊社へお声掛けください。\n\n今後ともよろしくお願い申し上げます。`},winter:{title:'寒中お見舞い申し上げます',art:'tsubaki',text:`寒中お見舞い申し上げます。\n厳しい寒さが続いておりますが、皆様いかがお過ごしでしょうか。\n\n${product}のご用命がございましたら、小ロットからでもお気軽にお申し付けください。\n\n本年も変わらぬご愛顧のほど、よろしくお願い申し上げます。`},newyear:{title:'謹んで新年のご挨拶を申し上げます',art:'ume',text:`旧年中は格別のご厚情を賜り、誠にありがとうございました。\n本年もより一層お役に立てるよう努めてまいります。\n\n${product}のご用命がございましたら、どうぞお気軽にお申し付けください。\n\n本年も何卒よろしくお願い申し上げます。`}};function flower(x,cx,cy,r,color,n=5){x.fillStyle=color;for(let i=0;i<n;i++){const a=i*Math.PI*2/n;x.beginPath();x.ellipse(cx+Math.cos(a)*r*.7,cy+Math.sin(a)*r*.7,r*.5,r, a+Math.PI/2,0,Math.PI*2);x.fill()}x.fillStyle='#d6a33a';x.beginPath();x.arc(cx,cy,r*.25,0,7);x.fill()}function drawArt(x,key){x.save();x.translate(560,930);x.lineCap='round';if(['sakura','ume','tsubaki','momiji'].includes(key)){const colors={sakura:'#ef9eb5',ume:'#e7a0ad',tsubaki:'#bd3d49',momiji:'#d36b3d'};x.strokeStyle=key==='tsubaki'?'#55734c':'#795a45';x.lineWidth=8;x.beginPath();x.moveTo(0,180);x.quadraticCurveTo(120,80,300,40);x.stroke();[[70,130],[140,95],[215,70],[280,48]].forEach(p=>flower(x,p[0],p[1],key==='tsubaki'?30:23,colors[key],key==='tsubaki'?7:5))}else if(key==='asagao'){x.strokeStyle='#578451';x.lineWidth=7;x.beginPath();x.moveTo(80,30);x.quadraticCurveTo(20,130,70,240);x.stroke();[[65,75],[35,145],[90,190]].forEach((p,i)=>flower(x,p[0],p[1],30,i===1?'#7c69b3':'#7488c7'))}else if(key==='furin'){x.strokeStyle='#7895a0';x.lineWidth=5;x.beginPath();x.moveTo(150,0);x.lineTo(150,55);x.stroke();x.fillStyle='#d9edf4';x.beginPath();x.arc(150,105,55,Math.PI,0);x.lineTo(190,170);x.lineTo(110,170);x.closePath();x.fill();x.stroke();x.beginPath();x.moveTo(150,170);x.lineTo(150,230);x.stroke();x.fillStyle='#77a9d1';x.fillRect(135,230,30,60)}else if(key==='kingyo'){x.fillStyle='#e66b43';x.beginPath();x.ellipse(150,120,65,42,0,0,7);x.fill();x.beginPath();x.moveTo(95,120);x.lineTo(35,70);x.lineTo(40,165);x.closePath();x.fill();x.fillStyle='#222';x.beginPath();x.arc(185,110,5,0,7);x.fill()}else if(key==='uchiwa'){x.fillStyle='#d9ecf4';x.beginPath();x.arc(160,105,90,0,7);x.fill();x.strokeStyle='#7895a0';x.lineWidth=5;x.stroke();x.strokeStyle='#9b7757';x.lineWidth=11;x.beginPath();x.moveTo(110,175);x.lineTo(45,270);x.stroke()}else if(key==='susuki'){x.strokeStyle='#8d7b55';x.lineWidth=6;for(let i=0;i<5;i++){x.beginPath();x.moveTo(60+i*45,260);x.quadraticCurveTo(80+i*45,120,55+i*45,30);x.stroke();x.fillStyle='#c9b887';for(let j=0;j<7;j++){x.beginPath();x.ellipse(55+i*45+j*2,35+j*12,5,18,-.4,0,7);x.fill()}}}else{x.strokeStyle='#365c3f';x.lineWidth=8;for(let i=0;i<6;i++){x.beginPath();x.moveTo(50,60+i*30);x.lineTo(280,35+i*20);x.stroke()}x.fillStyle='#b7d5e8';for(let i=0;i<8;i++){x.beginPath();x.arc(30+i*40,230+(i%2)*20,8,0,7);x.fill()}}x.restore()}function wrap(x,text,w){const out=[];for(const p of String(text).split('\n')){if(!p){out.push('');continue}let l='';for(const c of p){if(x.measureText(l+c).width>w&&l){out.push(l);l=c}else l+=c}if(l)out.push(l)}return out}function drawBackCanvas(target){const cv=target||document.createElement('canvas');cv.width=1000;cv.height=1480;const x=cv.getContext('2d'),s=seasonal[$('season').value],body=$('backText').value;x.fillStyle='#fffdf9';x.fillRect(0,0,1000,1480);x.fillStyle='#242424';x.textBaseline='top';x.font='700 58px "Yu Mincho",serif';wrap(x,s.title,820).forEach((l,i)=>x.fillText(l,90,125+i*72));x.font='400 34px "Yu Mincho",serif';let y=280;for(const l of wrap(x,body,820)){if(!l){y+=28;continue}x.fillText(l,90,y);y+=58}drawArt(x,$('illustration').value);x.strokeStyle='#d8d0c5';x.beginPath();x.moveTo(90,1265);x.lineTo(910,1265);x.stroke();x.font='600 28px sans-serif';x.fillStyle='#555';x.fillText('ネームプレート(NP)・銘板・ラベル・表示物等のご用命を承ります',90,1305);return cv}function updatePreview(){$('seasonChip').textContent='選択中：'+$('illustration').options[$('illustration').selectedIndex].text;drawBackCanvas($('backPreview'))}function setSeasonText(){$('backText').value=seasonal[$('season').value].text;$('illustration').value=seasonal[$('season').value].art;updatePreview()}async function makeBackPdf(){await document.fonts.ready;const{jsPDF}=window.jspdf,p=new jsPDF({orientation:'portrait',unit:'mm',format:[100,148]});p.addImage(drawBackCanvas().toDataURL(),'PNG',0,0,100,148);window.open(URL.createObjectURL(p.output('blob')),'_blank')}$('search').oninput=render;$('selectAll').onclick=()=>{visible().forEach(c=>selected.add(String(c.id)));render()};$('clearAll').onclick=()=>{selected.clear();render()};$('pdfButton').onclick=()=>openPdfFor(companies.filter(c=>selected.has(String(c.id))));$('season').onchange=setSeasonText;$('illustration').onchange=updatePreview;$('resetText').onclick=()=>{$('backText').value=seasonal[$('season').value].text;updatePreview()};$('backText').oninput=updatePreview;$('backPdfButton').onclick=makeBackPdf;setSeasonText();(async()=>{try{[companies,contacts]=await Promise.all([apiGetAll('/rest/v1/companies?select=id,company_name,address&order=company_name.asc'),apiGetAll('/rest/v1/contacts?select=id,company_id,name,department,position,employment_status&order=name.asc')]);render()}catch(e){$('companyList').textContent='読み込みに失敗しました。'}})();</script></body></html>
