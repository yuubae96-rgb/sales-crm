<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DM・はがき印刷</title>
<link rel="stylesheet" href="./dm-print-fix.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#f5f5f5;color:#222}header{background:#fff;border-bottom:1px solid #ddd;padding:16px 18px;font-size:22px;font-weight:800}.wrap{max-width:980px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0001}h2{margin:0 0 12px}.muted{font-size:13px;color:#666;line-height:1.6}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1;min-width:150px}label{display:block;font-weight:700;margin:8px 0 5px}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}button{border:0;border-radius:11px;padding:12px 14px;font-size:16px;font-weight:800}.primary{background:#111;color:#fff}.secondary{background:#e9e9e9}.print-note{background:#fff8df;border:1px solid #ead48a;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px;font-weight:700;line-height:1.6}.status{font-size:13px;font-weight:700;margin-top:10px}
.company-row{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:16px 0;border-bottom:1px solid #e8e8e8}.select-cell{padding-top:4px}.select-cell input{width:24px;height:24px}.company-edit{min-width:0}.company-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.company-head strong{font-size:18px}.edited-badge{display:inline-block;font-size:11px;color:#1769e0;font-weight:800}.fields{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:9px}.fields label{font-size:12px;margin:0 0 4px}.recipient-select{margin-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.save-temp{background:#fff;border:1px solid #bbb;color:#222}.save-db{background:#1769e0;color:#fff}.single-pdf{background:#111;color:#fff}.single-pdf:disabled{background:#bbb}.hint{margin-top:7px;font-size:12px;color:#777;line-height:1.5}
@media(max-width:700px){.wrap{padding:10px}.card{padding:14px}.company-row{grid-template-columns:30px 1fr;gap:8px;padding:14px 0}.company-head strong{font-size:17px}.fields{grid-template-columns:1fr}.fields input{padding:10px}.recipient-select{margin-top:7px}.actions{grid-template-columns:1fr 1fr}.actions .single-pdf{grid-column:1/-1}.actions button{padding:12px 8px;font-size:15px}.hint{display:none}}
</style></head><body>
<header>DM・はがき印刷</header><div class="wrap"><a href="./index.html">← 営業管理へ戻る</a><div class="card"><h2>送付する会社を選ぶ</h2><label>会社を検索</label><input id="search" type="search" placeholder="会社名・住所で検索"><div class="toolbar" style="margin-top:12px"><button class="secondary" id="selectAll">表示中をすべて選択</button><button class="secondary" id="clearAll">選択解除</button></div><p id="count" class="muted"></p><div id="companyList">読み込み中…</div></div>
<div class="card"><h2>宛名面の印刷</h2><div class="print-note">会社名・住所・宛名は一覧でそのまま編集できます。修正後は「PDFに反映」、元データも直す場合だけ「会社情報を保存」を押してください。</div><button class="primary" id="pdfButton">選択した会社のPDFを作る</button><div id="status" class="status"></div></div></div>
<script>
const U='https://emauqxftmauvsffdjvyh.supabase.co',K='sb_publishable_9rgwKLiJU9dGVkqttq0-fQ_hrhNqnfa',A='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtYXVxeGZ0bWF1dnNmZmRqdnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Njg0NzksImV4cCI6MjEwMjQ0NDQ3OX0.iN2xz71VCeP7o6nz89v0wJMrUYkGyPKATtWaCl-MIO4',H={apikey:K,Authorization:`Bearer ${A}`};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');let companies=[],contacts=[],selected=new Set(),recipientChoice=new Map(),printOverrides=new Map();
async function apiGetAll(path){let all=[],offset=0;while(true){const r=await fetch(U+path+`&limit=100&offset=${offset}`,{headers:H}),d=await r.json();if(!r.ok)throw Error('取得エラー');all.push(...d);if(d.length<100)break;offset+=100}return all}
function postalParts(raw){const text=String(raw||'').trim(),m=text.match(/(?:〒\s*)?(\d{3})[-ー‐‑‒–—−]?\s*(\d{4})/);return{postal:m?m[1]+m[2]:'',address:m?text.replace(m[0],'').trim():text}}
function activeContacts(id){return contacts.filter(c=>String(c.company_id)===String(id)&&!['退職','異動'].includes(c.employment_status||'在籍'))}
function effectiveCompany(c){const o=printOverrides.get(String(c.id));return o?{...c,company_name:o.company_name||c.company_name,address:o.address||c.address}:c}
function recipientFor(c){const ec=effectiveCompany(c),o=printOverrides.get(String(c.id)),choice=recipientChoice.get(String(c.id))||'company';if(choice==='company')return{company:ec.company_name,recipient:o?.recipient||'資材・調達・購買部 御中'};const p=contacts.find(x=>String(x.id)===choice);return p?{company:ec.company_name+([p.department,p.position].filter(Boolean).length?'　'+[p.department,p.position].filter(Boolean).join('　'):''),recipient:o?.recipient||p.name+' 様'}:{company:ec.company_name,recipient:o?.recipient||'資材・調達・購買部 御中'}}
function visible(){const q=$('search').value.trim().toLowerCase();return companies.filter(c=>{const ec=effectiveCompany(c);return !q||(`${ec.company_name} ${ec.address||''}`).toLowerCase().includes(q)})}
function render(){const a=visible();$('count').textContent=`${a.length}社 ／ ${selected.size}社選択`;$('companyList').innerHTML=a.map(c=>{const id=String(c.id),ec=effectiveCompany(c),people=activeContacts(c.id),r=recipientFor(c),edited=printOverrides.has(id),opts=[`<option value="company">会社宛</option>`,...people.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} 様</option>`)].join('');return `<div class="company-row"><div class="select-cell"><input type="checkbox" data-id="${esc(id)}" ${selected.has(id)?'checked':''} ${ec.address?'':'disabled'}></div><div class="company-edit"><div class="company-head"><strong>${esc(ec.company_name)}</strong>${edited?'<span class="edited-badge">PDF修正あり</span>':''}</div><div class="fields"><div><label>会社名</label><input data-edit-company="${esc(id)}" value="${esc(ec.company_name)}"></div><div><label>郵便番号・住所</label><input data-edit-address="${esc(id)}" value="${esc(ec.address||'')}" placeholder="〒000-0000 住所"></div><div><label>宛名</label><input data-edit-recipient="${esc(id)}" value="${esc(r.recipient)}" placeholder="資材・調達・購買部 御中"></div></div><select class="recipient-select" data-rec="${esc(id)}">${opts}</select><div class="actions"><button class="save-temp" data-save-temp="${esc(id)}">PDFに反映</button><button class="save-db" data-save-db="${esc(id)}">会社情報を保存</button><button class="single-pdf" data-pdf="${esc(id)}" ${ec.address?'':'disabled'}>この会社のPDF</button></div><div class="hint">「PDFに反映」は営業管理の元データを変更しません。「会社情報を保存」は会社名と住所も営業管理へ保存します。</div></div></div>`}).join('');document.querySelectorAll('[data-id]').forEach(e=>e.onchange=()=>{e.checked?selected.add(String(e.dataset.id)):selected.delete(String(e.dataset.id));$('count').textContent=`${visible().length}社 ／ ${selected.size}社選択`});document.querySelectorAll('[data-rec]').forEach(e=>{const id=String(e.dataset.rec);e.value=recipientChoice.get(id)||'company';e.onchange=()=>{recipientChoice.set(id,e.value);const c=companies.find(x=>String(x.id)===id),ri=document.querySelector(`[data-edit-recipient="${CSS.escape(id)}"]`);if(c&&ri){const old=printOverrides.get(id);if(old)printOverrides.delete(id);ri.value=recipientFor(c).recipient;if(old)printOverrides.set(id,old)}}});document.querySelectorAll('[data-save-temp]').forEach(e=>e.onclick=()=>savePrintEdit(String(e.dataset.saveTemp),false));document.querySelectorAll('[data-save-db]').forEach(e=>e.onclick=()=>savePrintEdit(String(e.dataset.saveDb),true));document.querySelectorAll('[data-pdf]').forEach(e=>e.onclick=async()=>{const id=String(e.dataset.pdf);if(applyEdit(id))await makeSinglePdf(id)})}
function readEdit(id){const companyInput=document.querySelector(`[data-edit-company="${CSS.escape(id)}"]`),addressInput=document.querySelector(`[data-edit-address="${CSS.escape(id)}"]`),recipientInput=document.querySelector(`[data-edit-recipient="${CSS.escape(id)}"]`);return{company_name:(companyInput?.value||'').trim(),address:(addressInput?.value||'').trim(),recipient:(recipientInput?.value||'').trim()}}
function applyEdit(id){const v=readEdit(id);if(!v.company_name){alert('会社名を入力してください。');return false}if(!v.address){alert('住所を入力してください。');return false}printOverrides.set(id,{...v,recipient:v.recipient||'資材・調達・購買部 御中'});return true}
async function savePrintEdit(id,saveDb){const c=companies.find(x=>String(x.id)===id);if(!c||!applyEdit(id))return;const v=printOverrides.get(id);if(saveDb){try{$('status').textContent='会社情報を更新中…';const r=await fetch(U+`/rest/v1/companies?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{...H,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({company_name:v.company_name,address:v.address})});if(!r.ok)throw Error(await r.text());c.company_name=v.company_name;c.address=v.address;$('status').textContent='会社名・住所を営業管理にも保存しました。'}catch(e){console.error(e);$('status').textContent='会社情報の保存に失敗しました。PDF用の修正は保持しています。';return}}else{$('status').textContent='この修正をPDFに反映しました。'}render()}
const PX=10,mm=v=>v*PX;
function normalizeVerticalText(text,isAddress=false){let s=String(text||'').replace(/\s+/g,'').replace(/\(/g,'（').replace(/\)/g,'）');if(isAddress)s=s.replace(/[0-9]/g,d=>'０１２３４５６７８９'[Number(d)]).replace(/[-‐‑‒–—−]/g,'｜');return s}
function drawVertical(ctx,text,xMm,yMm,fontMm,maxHeightMm,weight='400',lineGap=1.45,isAddress=false){const chars=[...normalizeVerticalText(text,isAddress)],fontPx=mm(fontMm),startY=mm(yMm),available=mm(maxHeightMm),baseStep=fontPx*lineGap,minStep=fontPx*.9,fitStep=chars.length>1?(available-fontPx)/(chars.length-1):baseStep,step=Math.max(minStep,Math.min(baseStep,fitStep));ctx.save();ctx.fillStyle='#111';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${weight} ${fontPx}px "Yu Mincho","Hiragino Mincho ProN","Hiragino Mincho Pro",serif`;const x=mm(xMm);let y=startY+fontPx/2;for(const ch of chars){if(ch==='ー'||ch==='（'||ch==='）'){ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/2);ctx.fillText(ch,0,0);ctx.restore()}else ctx.fillText(ch,x,y);y+=step}ctx.restore()}
function drawPostcardCanvas(c){const ec=effectiveCompany(c),canvas=document.createElement('canvas');canvas.width=100*PX;canvas.height=148*PX;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#111';const p=postalParts(ec.address),r=recipientFor(c),centers=[47,54.5,62,68.8,76.3,82.8,89.8];ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`400 ${mm(4.7)}px "Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif`;[...p.postal.slice(0,7)].forEach((d,i)=>ctx.fillText(d,mm(centers[i]),mm(15)));drawVertical(ctx,p.address,88,35,4.6,96,'400',1.18,true);drawVertical(ctx,r.company,56,40,6.2,88,'700',1.12,false);drawVertical(ctx,r.recipient,38,46,5,82,'600',1.15,false);return canvas}
async function openPdfFor(a){if(!a.length)return;if(!window.jspdf)return alert('PDF機能の読み込みに失敗しました。再読み込みしてください。');try{$('status').textContent='PDFを作成中…';await document.fonts.ready;const{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:[100,148],compress:true});for(let i=0;i<a.length;i++){if(i)pdf.addPage([100,148],'portrait');const canvas=drawPostcardCanvas(a[i]);pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,100,148,undefined,'FAST')}const blob=pdf.output('blob'),url=URL.createObjectURL(blob);$('status').textContent=`${a.length}枚のPDFを作成しました。PDFを開いて共有 → プリントしてください。`;window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),180000)}catch(e){console.error(e);$('status').textContent='PDF作成に失敗しました。もう一度お試しください。'}}
async function makeSinglePdf(id){const c=companies.find(x=>String(x.id)===id);if(!c||!effectiveCompany(c).address)return alert('住所が登録されていません。');await openPdfFor([c])}
async function makePdf(){const ids=[...selected];for(const id of ids){if(document.querySelector(`[data-edit-company="${CSS.escape(id)}"]`)&&!applyEdit(id))return}const a=companies.filter(c=>selected.has(String(c.id))&&effectiveCompany(c).address);if(!a.length)return alert('印刷する会社を選択してください。');await openPdfFor(a)}
$('search').oninput=render;$('selectAll').onclick=()=>{visible().filter(c=>effectiveCompany(c).address).forEach(c=>selected.add(String(c.id)));render()};$('clearAll').onclick=()=>{selected.clear();render()};$('pdfButton').onclick=makePdf;(async()=>{try{[companies,contacts]=await Promise.all([apiGetAll('/rest/v1/companies?select=id,company_name,address,relationship_type&order=company_name.asc'),apiGetAll('/rest/v1/contacts?select=id,company_id,name,department,position,employment_status&order=name.asc')]);render()}catch(e){$('companyList').textContent='読み込みに失敗しました。'}})();
</script></body></html>
